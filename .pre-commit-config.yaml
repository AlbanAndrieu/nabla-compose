---
fail_fast: true
minimum_pre_commit_version: 4.2.0
exclude: >-
  (?x)^(anything-llm/.*|langfuse/.*|litellm/.*|n8n/.*|pgwatch/.*|plumber-platform/.*|reactive/.*|sentry/.*|temporal/.*|docs/site/.*|docs/_build/.*|\.history/.*|.*cache.*/.*|.*venv.*/.*|\.direnv/.*|\.yarn/.*|\.ansible/.*|node_modules/.*|reports/.*|\.npm/.*|\.nuxt/.*|\.netlify.*|\.vercel/.*)$
ci:
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: monthly
  autofix_commit_msg: "chore: auto fixes from pre-commit.com hooks"
  submodules: false
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=123]
        exclude: >-
          ^(package-lock\.json|npm-shrinkwrap\.json|poetry\.lock|Pipfile\.lock|yarn\.lock|sbom\.json|pnpm-lock\.yaml|trivy-sbom\.json)$
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pre-commit.git
    rev: v4.6.2
    hooks:
      - id: validate_manifest

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        name: "🐚 shell · Format shell scripts"
        exclude: '^build\.sh$'
        args: ['-ln=bash', '-i=2']

  - repo: https://github.com/detailyang/pre-commit-shell
    rev: v1.0.6
    hooks:
      - id: shell-lint
        name: "🐚 shell · Lint shell scripts"
        # Resolve source=../... directives relative to each script, not repo root.
        args: [-x, -P, SCRIPTDIR]
        exclude: >-
          ^(mvnw|biscuitcutter\.sh|hooks|tests/.*|docs/Makefile|\.envrc|scripts/run-wicked\.sh|build\.sh)$

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        name: "🐚 shell · Check shell style"
        # shfmt owns formatting and shell-lint/ShellCheck owns semantic shell lint.
        # These Bashate rules duplicate those checks or false-positive on jq text.
        args: [-i, "E003,E006,E011,E042,E043"]
        exclude: '^(trunk|scripts/run-python\.sh|scripts/run-wicked\.sh|\.envrc)$'

  - repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
        name: "🐮 Makefile · Lint Makefile"

  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.9"
    hooks:
      - id: biome-check
        name: "🟨 javascript · Biome check"
        additional_dependencies: ["@biomejs/biome@2.4.12"]
        exclude: '^(trivy-sbom\.json|catalog/(?:service-topology|services)\.json|apps/n8n/.*)$'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "✨ config · Format YAML/HTML/SCSS"
        types_or: [yaml, html, scss]
        additional_dependencies: ["prettier@3.4.2"]
        exclude: '^(\.pre-commit-config\.yaml|apps/n8n/.*)$'

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: "✨ yaml · Lint YAML"
        args: [-c, .yamllint.yml]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
        name: "🧩 github-actions · Validate workflows"
        args: ["--verbose"]
      - id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"
      - id: check-metaschema
        name: "🔐 secrets · Validate secret manifest JSON Schema"
        files: '^config/secrets/manifest[.]schema[.]json$'
      - id: check-jsonschema
        name: "🔐 secrets · Validate manifest against JSON Schema"
        args: ["--schemafile", "config/secrets/manifest.schema.json"]
        files: '^config/secrets/manifest[.]json$'

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: "🐳 hadolint · Validate Dockerfile"

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks
        name: "🔒 security · Detect secrets with Betterleaks"
        # Preserve reviewed suppression rules until a dedicated policy migration.
        args: [--config=.gitleaks.toml]

  - repo: local
    hooks:
      - id: developer-tooling-contract
        name: "🛠️ tooling · Validate Betterleaks and Just compatibility"
        language: system
        entry: python -m unittest tests.test_dev_tooling_contract -v
        pass_filenames: false
        files: >-
          ^([.]pre-commit-config[.]yaml|[.]gitleaks[.]toml|[.]mega-linter[.]yml|mise[.]toml|mise[.]lock|justfile|Makefile|tests/test_dev_tooling_contract[.]py)$

      - id: context7-agent-contract
        name: "📚 agent · Validate Context7 free-first routing"
        language: python
        entry: python -m pytest -q tests/test_context7_agent_contract.py
        additional_dependencies: ["pytest==9.1.1"]
        pass_filenames: false
        files: >-
          ^([.]mcp[.]json|[.]cursor/mcp[.]json|AGENTS[.]md|[.]agents/skills/(?:context7-docs|local-first-quality)/SKILL[.]md|docs/roadmap[.]md|tests/test_context7_agent_contract[.]py)$

      - id: dagger-agent-contract
        name: "🗡️ agent · Validate bounded Dagger local-first PoC"
        language: python
        entry: python -m pytest -q tests/test_dagger_agent_contract.py
        additional_dependencies: ["pytest==9.1.1"]
        pass_filenames: false
        files: >-
          ^(dagger[.]toml|mise[.]toml|mise[.]lock|justfile|[.]agents/skills/local-first-quality/SKILL[.]md|docs/roadmap[.]md|tests/test_dagger_agent_contract[.]py)$

      - id: renovate-config-contract
        name: "🤖 renovate · Validate dependency automation contract"
        language: system
        entry: python -m unittest tests.test_renovate_config_contract -v
        pass_filenames: false
        files: >-
          ^(renovate[.]json|[.]github/(?:dependabot[.]yml|workflows/renovate[.]yml)|tests/test_renovate_config_contract[.]py)$

      - id: secret-manifest
        name: "🔐 secrets · Validate metadata-only manifest"
        language: python
        entry: python scripts/secrets/render_from_bitwarden.py --check
        additional_dependencies: ["jsonschema==4.22.0"]
        pass_filenames: false
        files: '^(config/secrets/manifest(?:[.]schema)?\.json|scripts/secrets/render_from_bitwarden\.py|tests/test_secrets_renderer\.py)$'

      - id: secret-renderer-tests
        name: "🔐 secrets · Test Bitwarden renderer"
        language: python
        entry: python -m unittest discover -s tests -p test_secrets_renderer.py -v
        additional_dependencies: ["jsonschema==4.22.0"]
        pass_filenames: false
        files: '^(config/secrets/manifest(?:[.]schema)?\.json|scripts/secrets/render_from_bitwarden\.py|tests/test_secrets_renderer\.py)$'

      - id: secret-consumer-audit
        name: "🔐 secrets · Prevent new unmanaged secret debt"
        language: system
        entry: python scripts/secrets/audit_consumers.py --check-baseline
        pass_filenames: false
        files: >-
          ^(apps/.*/(?:compose|docker-compose)\.ya?ml|(?:docker-)?compose[^/]*\.ya?ml|bootstrap/compose\.ya?ml|config/secrets/(?:manifest|debt-baseline)\.json|scripts/secrets/audit_consumers\.py|tests/test_secret_consumer_audit\.py)$

      - id: secret-materialization-contract
        name: "🔐 secrets · Enforce unprivileged Vaultwarden materialization"
        language: system
        entry: python -m unittest tests.test_secret_materialization_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/(?:lib/secrets[.]sh|secrets/materialize_runtime[.]py|truenas/(?:install-runtime-secret|prepare-security-tooling-secrets)[.]sh)|tests/test_secret_materialization_contract[.]py|docs/(?:security-tooling-runtime-bootstrap|secrets-runtime-initialization)[.]md|config/secrets/README[.]md)$

      - id: legacy-secret-import-contract
        name: "🔐 secrets · Validate bounded legacy dotenv migration"
        language: python
        entry: python -m unittest tests.test_legacy_secret_import -v
        additional_dependencies: ["python-dotenv==1.2.4", "jsonschema==4.22.0"]
        pass_filenames: false
        files: >-
          ^(scripts/secrets/(?:audit_consumers|import_dotenv_to_bitwarden|import_env_to_bitwarden|render_from_bitwarden)[.]py|config/secrets/(?:manifest(?:[.]schema)?|debt-baseline)[.]json|tests/test_legacy_secret_import[.]py)$

      - id: dotenv-source-compare-contract
        name: "🔐 secrets · Validate dotenv alias comparison"
        language: python
        entry: python -m pytest -q tests/test_compare_dotenv_sources.py
        additional_dependencies: ["pytest==9.1.1", "python-dotenv==1.2.4", "jsonschema==4.22.0"]
        pass_filenames: false
        files: >-
          ^(apps/scrutiny/compose[.]yml|scripts/secrets/(?:compare_dotenv_sources|import_dotenv_to_bitwarden|render_from_bitwarden)[.]py|scripts/truenas/(?:bootstrap-scrutiny-influxdb|deploy-scrutiny)[.]sh|config/secrets/manifest(?:[.]schema)?[.]json|tests/test_compare_dotenv_sources[.]py)$

      - id: p0-backstage-migration-bundle-contract
        name: "🔐🕸️ migration · Validate P0.3 + Backstage service bundle"
        language: python
        entry: python -m pytest -q tests/test_runtime_layout_policy_contract.py
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(apps/(?:scanopy|joplin|autokuma|code)/(?:catalog-info[.]yaml|compose[.]yml)|config/secrets/manifest[.]json|scripts/(?:check-service-migration-bundle[.]py|truenas/(?:accept-runtime-env-first-wave|bootstrap-repository-(?:env-files|runtime)|deploy-scanopy)[.]sh)|[.]agents/skills/(?:docker-compose-orchestration|homelab-secrets|nabla-service-catalog)/SKILL[.]md|docs/(?:roadmap|secrets-migration-roadmap|truenas-runtime-layout)[.]md|tests/test_runtime_layout_policy_contract[.]py)$

      - id: scanopy-image-lock-contract
        name: "🔒 scanopy · Validate fail-closed image admission"
        language: python
        entry: python -m unittest tests.test_scanopy_image_lock -v
        pass_filenames: false
        files: >-
          ^(apps/scanopy/compose[.]yml|scripts/truenas/(?:check-scanopy-image-lock|deploy-scanopy)[.]sh|tests/(?:test_scanopy_image_lock|test_runtime_layout_policy_contract)[.]py)$

      - id: service-initialization-audit-contract
        name: "🧰 truenas · Validate initialization and local ops classifier"
        language: python
        entry: python -m pytest -q tests/test_service_initialization_audit.py tests/test_nabla_ops_contract.py
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(catalog/services[.]json|config/secrets/(?:manifest|debt-baseline)[.]json|scripts/(?:nabla-service[.]py|nabla_ops/(?:__init__|catalog|model|state)[.]py|secrets/audit_consumers[.]py|truenas/audit-service-initialization[.]py)|tests/(?:test_service_initialization_audit|test_nabla_ops_contract)[.]py)$

      # generate-catalog-v2-artifacts.py remains scope-only until Backstage
      # materialization is complete; generated v2 artifacts are not yet authoritative.
      - id: catalog-v2-preparation-contract
        name: "🕸️ catalog · Validate v2 migration inventory coverage"
        language: python
        entry: bash -c 'python scripts/audit-service-catalog-v2-parity.py --check && python -m pytest -q tests/test_catalog_v2_exports.py'
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(catalog/(?:business-criticality-policy[.]yaml|catalog-info[.]yaml|homelab-services[.]json|homelab-exposure-overrides[.]json|services[.]json)|docker-compose(?:-truenas)?[.]yml|apps/[^/]+/(?:catalog-info[.]yaml|(?:compose|docker-compose)(?:[.][^.]*)?[.]ya?ml)|scripts/(?:audit-service-catalog-v2-parity[.]py|generate-catalog-v2-artifacts[.]py|nabla_ops/(?:business_criticality|catalog_exports|catalog_v2|compose_paths)[.]py)|tests/(?:test_business_criticality|test_catalog_v2_exports|test_catalog_v2_parity)[.]py|docs/(?:service-catalog-v2-normalization|service-catalog-security-graph|roadmap)[.]md)$

      - id: catalog-v2-pilot-contract
        name: "🕸️ catalog · Validate Backstage/Compose v2 pilot"
        language: system
        entry: python -m unittest tests.test_business_criticality tests.test_catalog_v2_parity tests.test_catalog_v2_pilot -v
        pass_filenames: false
        files: >-
          ^(catalog/(?:business-criticality-policy[.]yaml|catalog-info[.]yaml|homelab-services[.]json|homelab-exposure-overrides[.]json|services[.]json)|apps/(?:neo4j|cartography|sample|traefik|postgres)/(?:catalog-info[.]yaml|compose[.]yml)|scripts/(?:audit-service-catalog-v2-parity[.]py|nabla_ops/(?:business_criticality|catalog_v2)[.]py)|tests/(?:test_business_criticality|test_catalog_v2_(?:parity|pilot))[.]py|docs/(?:service-catalog-v2-normalization|service-catalog-security-graph|roadmap)[.]md)$

      - id: observability-contract
        name: "📊 observability · Validate lightweight logging contract"
        language: system
        entry: python -m unittest tests.test_observability_contract -v
        pass_filenames: false
        files: >-
          ^(apps/(grafana|prometheus|gatus|autokuma)/|scripts/observability/|[.]mcp[.]json|[.]cursor/mcp[.]json|config/secrets/manifest[.]json|tests/test_observability_contract[.]py)$

      - id: openwebui-pra-contract
        name: "💾 continuity · Validate OpenWebUI BIA/PRA contract"
        language: python
        entry: python -m unittest tests.test_openwebui_pra_contract -v
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(apps/(?:openwebui|openrag|litellm)/(?:catalog-info[.]yaml|compose[.]yml)|catalog/catalog-info[.]yaml|docs/(?:openwebui-backup-pra|roadmap)[.]md|scripts/truenas/diagnose-openwebui-backup-pra[.]sh|tests/test_openwebui_pra_contract[.]py)$

      - id: truenas-app-lifecycle-contract
        name: "🧰 truenas · Validate app lifecycle recovery contract"
        language: system
        entry: python -m unittest tests.test_truenas_app_lifecycle_contract -v
        pass_filenames: false
        files: >-
          ^(apps/(?:bichon|gatus|graylog|influxdb|langflow|mongo|openrag|opensearch)/|scripts/(?:generate-service-consumers[.]py|truenas/audit-app-lifecycle[.]sh)|docs/(?:truenas-app-lifecycle|homelab-platform-migration-roadmap)[.]md|tests/test_truenas_app_lifecycle_contract[.]py)$

      - id: agent-quality-gate-contract
        name: "✅ quality · Validate agent-first gate contract"
        language: python
        entry: python -m pytest -q tests/test_agent_quality_gate_contract.py
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(scripts/(?:agent-(?:quality-gate|pre-push|task-context)[.](?:sh|py)|truenas/bootstrap-dev-tools[.]sh)|tests/test_agent_quality_gate_contract[.]py|[.]pre-commit-(?:config|pre-push)[.]yaml|[.]mega-linter[.]yml|[.]github/workflows/(?:pre-commit|mega-linter|compose-validate|observability-ci|secret-contract|service-consumers|terragrunt-ci)[.]ya?ml|[.]agents/skills/local-first-quality/SKILL[.]md|[.]opencode/.*|opencode[.]json|AGENTS[.]md|agent[.]md|justfile|mise[.]toml)$

      - id: security-ci-contract
        name: "🛡️ security · Validate SAST/runtime production gate contract"
        language: system
        entry: python -m unittest tests.test_security_ci_contract -v
        pass_filenames: false
        files: >-
          ^([.]github/workflows/(?:codeql|production-security|runtime-baseline)[.]ya?ml|config/security/production-http-baseline[.]json|tests/test_security_ci_contract[.]py|docs/runtime-baseline-tests[.]md)$

      - id: truenas-deployment-automation-contract
        name: "🚢 truenas · Validate Doco-CD deployment authority"
        language: python
        entry: python -m pytest -q tests/test_truenas_deployment_automation.py
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(docker-compose(?:-truenas)?[.]yml|bootstrap/compose[.]ya?ml|catalog/(?:catalog-info[.]yaml|services[.]json|service-topology[.]json)|docs/truenas-deployment-automation[.]md|scripts/(?:cron[.]sh|truenas/bootstrap-dev-tools[.]sh)|tests/test_truenas_deployment_automation[.]py)$

      - id: truenas-operator-tools-contract
        name: "🧰 truenas · Validate operator tools installer"
        language: system
        entry: python -m unittest tests.test_truenas_operator_tools -v
        pass_filenames: false
        files: >-
          ^(scripts/truenas/install-operator-tools[.]sh|docs/truenas-operator-tools[.]md|tests/test_truenas_operator_tools[.]py)$

      - id: talos-operator-client-contract
        name: "🔐 talos · Validate non-root operator client contract"
        language: system
        entry: python -m unittest tests.test_talos_operator_client_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/talos/(?:configure-operator-client[.]sh|lib/client-config[.]sh|validate-cluster[.]sh|smoke-kubernetes-network[.]sh|validate-csi-prereqs[.]sh|install-truenas-csi-nfs[.]sh|smoke-truenas-csi-nfs[.]sh|preflight-kubara[.]sh|smoke-fastapi-sample[.]sh)|scripts/truenas/install-operator-tools[.]sh|docs/(?:truenas-operator-tools|kubernetes-csi-preflight)[.]md|tests/(?:test_talos_operator_client_contract|test_truenas_operator_tools)[.]py)$

      - id: truenas-csi-nfs-contract
        name: "💾 kubernetes · Validate TrueNAS NFS CSI contract"
        language: python
        entry: python -m unittest tests.test_truenas_csi_nfs_contract -v
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(kubernetes/truenas-csi/|scripts/lib/truenas[.]sh|scripts/talos/(?:validate-csi-prereqs|install-truenas-csi-nfs|smoke-truenas-csi-nfs)[.]sh|docs/(?:kubernetes-csi-preflight|homelab-platform-migration-roadmap|roadmap)[.]md|tests/test_truenas_csi_nfs_contract[.]py)$

      - id: pfsense-posture-audit-contract
        name: "🛡️ pfSense · Parse posture regression audit"
        language: system
        entry: bash scripts/pfsense/audit-posture.sh --help
        pass_filenames: false
        files: >-
          ^(scripts/pfsense/audit-posture[.]sh|[.]agents/skills/pfsense-api-debugging/SKILL[.]md|docs/pfsense-flow-observability-memory[.]md)$

      - id: dns-recovery-contract
        name: "🌐 DNS · Validate pfSense/Talos recovery contract"
        language: system
        entry: python -m unittest tests.test_dns_recovery_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/(?:pfsense/audit-posture|talos/generate-config)[.]sh|docs/(?:talos-local-machine-config|truenas-talos-bootstrap|dns-ingress-ownership)[.]md|docs/incidents/2026-09-27-pfsense-dns-truenas-dependency[.]md|tests/test_dns_recovery_contract[.]py)$

      - id: pfsense-recovery-contract
        name: "🛡️ pfSense · Validate diagnosis/recovery ownership contract"
        language: system
        entry: python -m unittest tests.test_pfsense_diagnose_recover_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/pfsense/diagnose-recover[.]sh|docs/pfsense-diagnose-recover[.]md|tests/test_pfsense_diagnose_recover_contract[.]py)$

      - id: dsomm-contract
        name: "🧭 dsomm · Validate maturity UI and baseline evidence contract"
        language: python
        entry: bash -c 'python scripts/dsomm/validate-seed.py && python -m unittest tests.test_dsomm_contract tests.test_dsomm_baseline_summary tests.test_dsomm_repository_assessment_aggregate -v'
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(apps/dsomm/|config/secrets/manifest[.]json|scripts/dsomm/(?:validate-seed|aggregate-repository-assessments)[.]py|scripts/truenas/(?:deploy-dsomm|prepare-security-tooling-secrets)[.]sh|docs/(?:roadmap|security-tooling-control-architecture)[.]md|tests/(?:test_dsomm_contract|test_dsomm_baseline_summary|test_dsomm_repository_assessment_aggregate|test_secrets_renderer)[.]py)$

      - id: security-audit-skill-contract
        name: "🛡️ security · Validate vendored audit/report contract"
        language: system
        entry: python -m pytest -q tests/test_security_audit_skill_contract.py
        pass_filenames: false
        files: >-
          ^([.]agents/skills/security-audit/|docs/security-audits/|scripts/truenas/bootstrap-repository-storage[.]sh|apps/dsomm/README[.]md|docs/roadmap[.]md|tests/test_security_audit_skill_contract[.]py)$

      - id: opencre-contract
        name: "🧭 opencre · Validate standards-correlation service contract"
        language: python
        entry: python -m pytest -q tests/test_opencre_contract.py
        additional_dependencies: ["pytest==9.1.1", "PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(apps/opencre/|docs/(?:roadmap|security-tooling-control-architecture)[.]md|scripts/truenas/(?:bootstrap-repository-storage|deploy-opencre)[.]sh|tests/test_opencre_contract[.]py)$

      - id: diagnostic-output-contract
        name: "📋 diagnostics · Validate shared compact/full output contract"
        language: system
        entry: python -m unittest tests.test_diagnostic_output_contract tests.test_truenas_csi_orphan_diagnostic -v
        pass_filenames: false
        files: >-
          ^(scripts/(?:lib/diagnostic|run-diagnostic)[.]sh|scripts/(?:infra|observability|security|talos|truenas)/.*[.]sh|tests/(?:test_diagnostic_output_contract|test_truenas_csi_orphan_diagnostic)[.]py|docs/roadmap[.]md)$

      - id: probe-library-contract
        name: "🌐 probes · Validate bounded network probe library"
        language: python
        entry: python -m unittest tests.test_probe_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/lib/probe[.]sh|scripts/(?:ingress/verify-sample-exposure|talos/validate-csi-prereqs)[.]sh|scripts/truenas/(?:deploy-dsomm|diagnose-nginx-proxy-manager|accept-runtime-env-first-wave|audit-app-lifecycle|verify-pihole-dns-sync|smoke-sentry-event|diagnose-sentry|bootstrap-openrag-langflow-key|smoke-fastapi-observability)[.]sh|tests/test_probe_contract[.]py)$

      - id: operator-script-refactor-contract
        name: "🧱 truenas · Validate shared operator primitives"
        language: python
        entry: python -m unittest tests.test_operator_script_refactor_contract -v
        pass_filenames: false
        files: >-
          ^(scripts/lib/(?:common|docker|truenas)[.]sh|scripts/truenas/(?:audit-docker-network-migration|deploy-docling|deploy-joplin|deploy-scanopy|deploy-wazuh|diagnose-csi-orphans|diagnose-docker-orphan-shims|diagnose-influxdb|diagnose-platform|diagnose-stuck-apps|diagnose-nginx-proxy-manager|materialize-reboot-bundle|migrate-docker-address-pool|prune-docker-images|reconcile-reboot-resume|reconcile-talos-vm-policy|verify-talos-vm-autostart)[.]sh|tests/test_operator_script_refactor_contract[.]py|docs/(?:README|roadmap)[.]md|scripts/README[.]md)$

      - id: stuck-app-diagnostic-contract
        name: "🩺 truenas · Validate stuck-app recovery diagnostics"
        language: python
        entry: python -m pytest -q tests/test_stuck_app_diagnostic_contract.py
        additional_dependencies: ["pytest==9.1.1"]
        pass_filenames: false
        files: >-
          ^(apps/vaultwarden/compose[.]yml|scripts/truenas/(?:diagnose-stuck-apps|diagnose-nginx-proxy-manager|repair-grafana-storage-permissions|diagnose-sentry-migrator-credential|reconcile-sentry-migrator-credential|reconcile-openrag-opensearch-secret|reconcile-sentry-system-secret|recover-sentry-deploying)[.]sh|tests/test_stuck_app_diagnostic_contract[.]py)$

      - id: runtime-primitive-duplication
        name: "🧱 runtime · Reject duplicate migrated shell primitives"
        language: system
        entry: python scripts/quality/check-runtime-primitive-duplication.py
        pass_filenames: false
        files: >-
          ^(config/quality/runtime-primitives[.]json|scripts/.*[.]sh|scripts/quality/check-runtime-primitive-duplication[.]py|tests/test_runtime_primitive_duplication[.]py|docs/roadmap[.]md)$

      - id: service-topology-sync
        name: "🕸️ catalog · Generate declared services and topology"
        language: python
        entry: python scripts/generate-service-topology.py --check
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: '^(catalog/(?:service-topology(?:\.static)?|service-icons|services)(?:\.schema)?\.json|scripts/(?:generate-service-topology|nabla_ops/compose_paths)\.py|(?:apps/[^/]+/)?(?:compose|docker-compose)(?:[.-][^./]+)?\.ya?ml)$'

      - id: service-consumer-contract
        name: "🧩 catalog · Validate service consumers and unit tests"
        language: python
        entry: bash scripts/quality/check-service-consumers.sh
        additional_dependencies: ["PyYAML==6.0.3"]
        pass_filenames: false
        files: >-
          ^(catalog/(?:service-consumers[.]static[.]yml|service-icons[.]json|service-topology(?:[.]static)?[.]json|service-topology[.]schema[.]json|services(?:[.]schema)?[.]json)|scripts/(?:generate-service-(?:consumers|topology)[.]py|nabla_ops/compose_paths[.]py|quality/check-service-consumers[.]sh)|(?:compose|docker-compose)(?:[.-][^./]+)?[.]ya?ml|apps/[^/]+/(?:compose|docker-compose)(?:[.-][^./]+)?[.]ya?ml|apps/(?:homarr/sync[.]py|homarr/generated/apps[.]json|gatus/config/config[.]yml|autokuma/static/generated-monitors[.]json)|tests/(?:test_homarr_sync|test_service_consumers_status_contract|test_service_topology_generator)[.]py)$

      - id: prometheus-config
        name: "📈 prometheus · Validate runtime config with promtool"
        language: system
        entry: bash scripts/prometheus/check-config.sh
        pass_filenames: false
        files: >-
          ^(apps/prometheus/(?:prometheus[.]yml|compose[.]yml|rules/.*[.]ya?ml)|scripts/prometheus/check-config[.]sh|tests/test_prometheus_quality_gate_contract[.]py)$

      - id: compose-config
        name: "🐳 compose · Validate Compose configuration"
        language: system
        entry: bash -c 'for file do docker compose --project-directory "$(dirname "$file")" -f "$file" config --quiet --no-interpolate --no-env-resolution || exit; done' --
        files: '(^|/)(compose|docker-compose)([.-][^./]+)?\.ya?ml$'
        stages: [pre-commit]
