fail_fast: true
minimum_pre_commit_version: 4.2.0
exclude: |
  (?x)^(
      anything-llm/.*|
      langfuse/.*|
      litellm/.*|
      n8n/.*|
      pgwatch/.*|
      plumber-platform/.*|
      reactive/.*|
      sentry/.*|
      temporal/.*|
      .*\{\{.*\}\}.*|
      docs/site/.*|
      docs/_build/.*|
      \.history/.*|
      .*cache.*/.*|
      .*venv.*/.*|
      .direnv/.*|
      .yarn/.*|
      .ansible/.*|
      node_modules/.*|
      reports/.*|
      .npm/.*|
      .nuxt/.*|
      .netlify.*|
      .vercel/.*|
  )$
ci:
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: monthly
  autofix_commit_msg: |
    chore: auto fixes from pre-commit.com hooks
    for more information, see https://pre-commit.ci
  skip:
  -   pip-compile
  -   pyright
  -   schemas
  submodules: false
default_install_hook_types:
-   pre-commit
-   commit-msg
-   pre-push

default_stages:
-   pre-commit

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        name: "📁 filesystem · Remove trailing whitespace"
    -   id: fix-byte-order-marker
        name: "📁 filesystem · Verify byte order"
    -   id: mixed-line-ending
        name: "📁 filesystem · Verify line endings"
        args: [--fix=lf]
    -   id: end-of-file-fixer
        name: "📁 filesystem · Verify end of file"
    -   id: check-symlinks
        name: "📁 filesystem · Check symlink validity"
    -   id: destroyed-symlinks
        name: "📁 filesystem · Detect broken symlinks"
    -   id: check-json
        name: "📁 filesystem · Check JSON"
    -   id: check-toml
        name: "📁 filesystem · Check TOML"
    -   id: check-yaml
        name: "📁 filesystem · Check YAML"
        args: [--allow-multiple-documents]
    -   id: check-merge-conflict
        name: "🌳 git · Detect conflict markers"
    -   id: check-added-large-files
        name: "🌳 git · Block large files"
        args: [--maxkb=123]
        exclude: "^(package-lock.json|npm-shrinkwrap.json|poetry.lock|Pipfile.lock|yarn.lock|sbom.json|pnpm-lock.yaml|trivy-sbom.json)$"
    -   id: detect-private-key
        name: "🔒 security · Detect private keys"

-   repo: https://github.com/pre-commit/pre-commit.git
    rev: v4.6.2
    hooks:
    -   id: validate_manifest
        name: "🤖 manifest · Validate manifest scripts"

-   repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
    -   id: shfmt-docker
        name: "🐚 shell · Format shell scripts"
        exclude: ^build\.sh$

-   repo: https://github.com/detailyang/pre-commit-shell
    rev: v1.0.6
    hooks:
    -   id: shell-lint
        name: "🐚 shell · Lint shell scripts"
        args: [-x]
        exclude: "^(mvnw|biscuitcutter\.sh|hooks|tests/.*|docs/Makefile|\.envrc|scripts/run-wicked\.sh|build\.sh)$"

-   repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
    -   id: bashate
        name: "🐚 shell · Check shell style"
        args: [-i, "E003,E006"]
        exclude: "^(trunk|scripts/run-python\.sh|scripts/run-wicked\.sh|\.envrc)$"

-   repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.2
    hooks:
    -   id: checkmake
        name: "🐮 Makefile · Lint Makefile"

-   repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
    -   id: sqlfluff-lint
        name: "📊 SQL · Lint SQL"

-   repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.9"
    hooks:
    -   id: biome-check
        name: "🟨 javascript · Biome check"
        additional_dependencies: ["@biomejs/biome@1.9.4"]
        exclude: "^(trivy-sbom\.json|public/.*|api/hello\.js)$"

-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
    -   id: prettier
        name: "✨ config · Format YAML/HTML/SCSS"
        types_or: [yaml, html, scss]
        additional_dependencies:
        -   prettier@3.4.2
        exclude: "^(\.pre-commit-config\.yaml|trivy-sbom\.json|public/.*)$"

-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
    -   id: check-github-workflows
        name: "🧩 github-actions · Validate workflows"
        args: ["--verbose"]
    -   id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"

-   repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
    -   id: hadolint-docker
        name: "🐳 hadolint · Validate Dockerfile"

-   repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
    -   id: gitleaks
        name: "🔒 security · Detect secrets"
