---
fail_fast: true
minimum_pre_commit_version: 4.2.0
exclude: >-
  (?x)^(anything-llm/.*|langfuse/.*|litellm/.*|n8n/.*|pgwatch/.*|plumber-platform/.*|reactive/.*|sentry/.*|temporal/.*|docs/site/.*|docs/_build/.*|\.history/.*|.*cache.*/.*|.*venv.*/.*|\.direnv/.*|\.yarn/.*|\.ansible/.*|node_modules/.*|reports/.*|\.npm/.*|\.nuxt/.*|\.netlify.*|\.vercel/.*)$
ci:
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: monthly
  autofix_commit_msg: "chore: auto fixes from pre-commit.com hooks"
  submodules: false
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=123]
        exclude: >-
          ^(package-lock\.json|npm-shrinkwrap\.json|poetry\.lock|Pipfile\.lock|yarn\.lock|sbom\.json|pnpm-lock\.yaml|trivy-sbom\.json)$
      - id: detect-private-key

  - repo: https://github.com/pre-commit/pre-commit.git
    rev: v4.6.2
    hooks:
      - id: validate_manifest

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt-docker
        name: "🐚 shell · Format shell scripts"
        exclude: '^build\.sh$'

  - repo: https://github.com/detailyang/pre-commit-shell
    rev: v1.0.6
    hooks:
      - id: shell-lint
        name: "🐚 shell · Lint shell scripts"
        args: [-x]
        exclude: >-
          ^(mvnw|biscuitcutter\.sh|hooks|tests/.*|docs/Makefile|\.envrc|scripts/run-wicked\.sh|build\.sh)$

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        name: "🐚 shell · Check shell style"
        args: [-i, "E003,E006"]
        exclude: '^(trunk|scripts/run-python\.sh|scripts/run-wicked\.sh|\.envrc)$'

  - repo: https://github.com/mrtazz/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
        name: "🐮 Makefile · Lint Makefile"

  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.9"
    hooks:
      - id: biome-check
        name: "🟨 javascript · Biome check"
        additional_dependencies: ["@biomejs/biome@2.4.12"]
        exclude: '^(trivy-sbom\.json|apps/n8n/.*)$'

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "✨ config · Format YAML/HTML/SCSS"
        types_or: [yaml, html, scss]
        additional_dependencies: ["prettier@3.4.2"]
        exclude: '^(\.pre-commit-config\.yaml|apps/n8n/.*)$'

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-github-workflows
        name: "🧩 github-actions · Validate workflows"
        args: ["--verbose"]
      - id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        name: "🐳 hadolint · Validate Dockerfile"

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: "🔒 security · Detect secrets"
