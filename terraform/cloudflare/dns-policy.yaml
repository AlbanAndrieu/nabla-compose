---
# Public DNS policy of albandrieu.com, read by dns.tofu and by
# scripts/cloudflare/capture-dns-records.py. No record content lives here:
# tunnel CNAMEs are derived from local.tunnel_ingress (tunnel.tofu).
version: 1

# Hostnames that must disappear from public DNS. Retirement is two reviewed
# plans: dns_retirement_phase=adopt imports the live records unchanged, then
# dns_retirement_phase=retire destroys them (terraform/cloudflare/README.md).
# The 26 names of the first round (media PoCs, kibana, routes removed from the
# tunnel 04-06/11) were destroyed on 10/11/2026 and answer NXDOMAIN; see git
# history for the list. The second round, postgres.albandrieu.com, was
# destroyed on 11/11/2026. The third round, s3.int (Garage S3 must stay
# LAN-only), was destroyed on 12/11/2026.
retired_hostnames: []

# Tunnel routes whose CNAME does not exist yet and may be created. Every other
# tunnel hostname must be imported first (import-first, never blind create).
new_tunnel_hostnames: []

# Private namespace served by Pi-hole; a public record under it is drift
# (docs/dns-ingress-ownership.md).
forbidden_public_suffixes:
  - .int.albandrieu.com
