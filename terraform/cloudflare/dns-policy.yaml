---
# Public DNS policy of albandrieu.com, read by dns.tofu and by
# scripts/cloudflare/capture-dns-records.py. No record content lives here:
# tunnel CNAMEs are derived from local.tunnel_ingress (tunnel.tofu).
version: 1

# Hostnames that must disappear from public DNS. Retirement is two reviewed
# plans: dns_retirement_phase=adopt imports the live records unchanged, then
# dns_retirement_phase=retire destroys them (terraform/cloudflare/README.md).
# The 26 names of the first round (media PoCs, kibana, routes removed from the
# tunnel 04-06/11) were destroyed on 10/11/2026 and answer NXDOMAIN; see git
# history for the list. The second round, postgres.albandrieu.com, was
# destroyed on 11/11/2026. The third round, s3.int (Garage S3 must stay
# LAN-only), was destroyed on 12/11/2026.
# Fourth round (16/11/2026): the workstation tunnel routes retired with their
# route, except famp-albandrieu (tunnel-workstation.tofu).
# Fifth round (16/11/2026): Sentry is LAN-only (owner decision), served as
# sentry.int.albandrieu.com by Traefik; its public route is removed.
# Sixth round (17/11/2026): traefik, drawio, pihole and autoxpose stay LAN-only
# (owner decision); immich and nexus keep their public route behind Access.
# Seventh round (20/11/2026): A records to the fixed Free IPv4, dead since
# pfSense and its HAProxy left on 18/11 (public traffic only enters through the
# tunnel). Kept: the apex and www (a Redirect Rule answers before any origin)
# and home (Free PTR, dns.tofu); hello.int and s3.int, published by
# cloudflare-ddns (owner decision, 20/11/2026). Frozen (20/11/2026): login,
# until the owner decides whether the honeypot must be exposed there.
# Eighth round (20/11/2026): index, a proxied CNAME to the apex answering 403
# 1050 (owner decision). Kept: mail2 (A, MX to mx3.mtahosting.com), a
# receive-only Project Honey Pot MX donation created by the owner on 27/12/2025
# (Cloudflare audit log); the only declared exception of the Google-only mail
# scan (config/security/public-mail-domains.json, mx_exceptions).
retired_hostnames:
  - account.albandrieu.com
  - anythingllm-albandrieu.albandrieu.com
  - apache.albandrieu.com
  - api.albandrieu.com
  - autoxpose.albandrieu.com
  - drawio.albandrieu.com
  - honeypot-albandrieu.albandrieu.com
  - index.albandrieu.com
  - localai-gpu-albandrieu.albandrieu.com
  - manager.albandrieu.com
  - motion-albandrieu.albandrieu.com
  - netalertx-albandrieu.albandrieu.com
  - nexus-albanandrieu.albandrieu.com
  - nexus-albandrieu.albandrieu.com
  - ntopng-albandrieu.albandrieu.com
  - ollama-gpu-albandrieu.albandrieu.com
  - ollama-gpu.albandrieu.com
  - ollama.albandrieu.com
  - pihole.albandrieu.com
  - plumber-albandrieu.albandrieu.com
  - portracker-albandrieu.albandrieu.com
  - sentry.albandrieu.com
  - toto.albandrieu.com
  - traefik.albandrieu.com
  - truenas.albandrieu.com
  - vaultwarden-albandrieu.albandrieu.com
  - warp.albandrieu.com
  - www.toto.albandrieu.com

# Tunnel routes whose CNAME does not exist yet and may be created. Every other
# tunnel hostname must be imported first (import-first, never blind create).
new_tunnel_hostnames: []

# Tunnel routes deliberately left without a public CNAME (adopted as found on
# 14/11/2026): the route exists, the name does not resolve. Publishing one is
# an explicit decision: move it to new_tunnel_hostnames.
unpublished_tunnel_hostnames: []

# Private namespace served by Pi-hole; a public record under it is drift
# (docs/dns-ingress-ownership.md).
forbidden_public_suffixes:
  - .int.albandrieu.com
