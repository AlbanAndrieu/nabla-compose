# This is the default gitleaks configuration file.
# Betterleaks v1.9.0: ignore only three reviewed upstream Docker examples.
# Do not exclude .agents/skills globally; all other findings remain active.
filter = '''
finding["rule_id"] == "generic-password" &&
(
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/assets/bad-vs-good.md" &&
    finding["line"] == "      POSTGRES_PASSWORD: supersecretpassword123"
  ) ||
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/SKILL.md" &&
    finding["line"] == "- When defaults are needed in the `environment:` block for local development, use variable substitution with fallbacks: ${DB_PASSWORD:-postgres}. Never write bare plaintext values for password fields."
  ) ||
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/assets/compose-web-app.yaml" &&
    finding["line"] == "      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-secret}@db:5432/myapp"
  )
)
'''

# Rules and allowlists are defined within this file.
# Rules instruct gitleaks on what should be considered a secret.
# Allowlists instruct gitleaks on what is allowed, i.e. not a secret.
title = "gitleaks config"

[extend]
# useDefault will extend the base configuration with the default gitleaks config:
# https://github.com/zricethezav/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

[allowlist]
description = "global allow lists"
regexes = [
    '''219-09-9999''',
    '''078-05-1120''',
    '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
    '''#nosec''',
    '''allow:gitleaks''',
    '''password-reset-XXX''',
    '''123456789abcdef''',
    ]
paths = [
    '''gitleaks.toml''',
    '''(.*?)(jpg|gif|doc|docx|zip|xls|pdf|bin|svg|socket|vsidx|v2|suo|wsuo|.dll|pdb|exe)$''',
    '''(go.mod|go.sum|go.work|go.work.sum)$''',
    '''gradle.lockfile''',
    '''megalinter-reports''',
    '''node_modules''',
    '''.mypy_cache''',
    '''(.*?)gitleaks\.toml$''',
    '''vue-client/node_modules''',
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
    '''Database.refactorlog''',
    '''vendor''',
    '''.venv''',
    '''.direnv''',
    '''.tox''',
    '''environment.yml''',
    '''.terraform''',
]

# Exceptions précises pour des exemples pédagogiques Docker.
# Ne pas exclure globalement les skills.
filter = '''
finding["rule_id"] == "generic-password" &&
(
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/assets/bad-vs-good.md" &&
    finding["line"] == "      POSTGRES_PASSWORD: supersecretpassword123"
  ) ||
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/SKILL.md" &&
    filter.containsAny(finding["line"], ["${DB_PASSWORD:-postgres}"])
  ) ||
  (
    attributes["path"] == ".agents/skills/docker-compose-patterns/assets/compose-web-app.yaml" &&
    filter.containsAny(finding["line"], ["${POSTGRES_PASSWORD:-secret}"])
  )
)
'''

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Vaultwarden item UUIDs used by Doco-CD"
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^\.doco-cd\.ya?ml$''']
  regexes = [
    '''^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'''
  ]
