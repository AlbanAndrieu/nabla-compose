min_version = "2024.9.5"

[tools]
python = "{{ get_env(name='PYTHON_VERSION', default='3.14') }}"
ruff = "latest"
awscli = { version = "latest", symlink_bins = "true" }
k9s = "latest"
kubectl = "latest"
"aqua:siderolabs/talos" = "1.13.9"
helm = "latest"
argocd = "latest"
trivy = "latest"
pre-commit = "latest"
task = "latest"
just = "1.58.0"
go = "1.25.12"
"go:github.com/betterleaks/betterleaks" = "v1.9.0"
yamlfmt = "latest"
actionlint = "latest"
opentofu = "latest"
op = "latest"
terragrunt = "0.97.0"
sops = "latest"
docker-compose = "latest"
dagger = "0.21.10"
hyperfine = "2.0.0"
# 1password = "latest"

[settings]
lockfile = true

[env]
_.file = [".env.secrets", ".env.local"]

ENV = "dev"

# Keep repository-wide mise environment value-free. Runtime credentials belong
# in the shell, mise.local.toml, or the repository secret rendering contract.
PROJECT_NAME = "{{ config_root | basename }}"

[tasks]
init = "bash ./scripts/run-install.sh"

[tasks.hooks]
description = "Install canonical pre-commit, commit-msg and pre-push Git hooks"
run = '''
pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
pre-commit install --config .pre-commit-pre-push.yaml --install-hooks --hook-type pre-push
'''

[tasks.quality]
description = "Run the canonical publication quality gate"
run = "bash scripts/quality-gate.sh"

[tasks.agent-context]
description = "Show bounded branch, changed-path and skill-routing context for local agents"
run = "python scripts/agent-task-context.py"

[tasks.agent-preflight]
description = "Run the cheap Git-only safety gate before dependency/setup work"
run = "bash scripts/agent-quality-gate.sh --preflight"

[tasks.agent-quality]
description = "Run the repo-specific agent-first gate before publication"
run = "bash scripts/agent-quality-gate.sh"

[tasks.agent-loop]
description = "Converge deterministic fixes and run targeted changed-file contracts during edit iterations"
run = "bash scripts/agent-quality-gate.sh --loop"

[tasks.agent-fix]
description = "Regenerate deterministic artifacts and converge local pre-commit fixes"
run = "bash scripts/agent-quality-gate.sh --fix"

[tasks.agent-publish]
description = "Run the strict agent gate and clean-tree publication check"
run = "bash scripts/agent-quality-gate.sh --publish"

[tasks.agent-pre-push]
description = "Converge deterministic fixes, run full local validation, and block the push if fixes still need committing"
run = "bash scripts/agent-pre-push.sh"

[tasks.info]
description = "Show repository tooling context"
run = '''
echo "Project: $PROJECT_NAME"
echo "Python: $(python --version 2>&1)"
echo "Pre-commit: $(pre-commit --version 2>&1)"
'''

[tasks.dagger-sync]
description = "Refresh the Dagger lock, require it, and show the review diff without generating SDK files"
run = '''
dagger --x-release=v1.0.0-beta.15 workspace update --no-generate
test -f dagger.lock || { echo "dagger workspace update did not create dagger.lock"; exit 2; }
git diff -- dagger.lock
'''

[tasks.dagger-list]
description = "List experimental Dagger checks only after the reviewed workspace lock exists"
run = '''
test -f dagger.lock || { echo "dagger.lock missing; run: just dagger-sync"; exit 2; }
dagger --x-release=v1.0.0-beta.15 check -l
'''

[tasks.dagger-native-parity]
description = "Run non-mutating native ShellCheck and pinned Biome parity controls"
run = '''
test -x node_modules/.bin/biome || { echo "pinned Biome missing; run: npm ci"; exit 2; }
pre-commit run shellcheck --all-files
node_modules/.bin/biome check
'''

[tasks.dagger-poc]
description = "Run bounded Dagger checks only from a reviewed lock; agent-pre-push remains authoritative"
run = '''
test -f dagger.lock || { echo "dagger.lock missing; run: just dagger-sync"; exit 2; }
dagger --x-release=v1.0.0-beta.15 check --no-generate
'''

[tasks.dagger-bench]
description = "Benchmark warm native-vs-Dagger parity paths without deleting caches"
run = '''
test -f dagger.lock || { echo "dagger.lock missing; run: just dagger-sync"; exit 2; }
hyperfine --warmup 1 --runs 3 'just dagger-native-parity' 'just dagger-poc'
'''
