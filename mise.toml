min_version = "2024.9.5"

[tools]
python = "{{ get_env(name='PYTHON_VERSION', default='3.14') }}"
ruff = "latest"
awscli = { version = "latest", symlink_bins = "true" }
k9s = "latest"
kubectl = "latest"
"aqua:siderolabs/talos" = "1.13.9"
helm = "latest"
argocd = "latest"
trivy = "latest"
pre-commit = "latest"
task = "latest"
yamlfmt = "latest"
actionlint = "latest"
opentofu = "latest"
op = "latest"
terragrunt = "0.97.0"
sops = "latest"
docker-compose = "latest"
# 1password = "latest"

[settings]
lockfile = true

[env]
_.file = [".env.secrets", ".env.local"]

ENV = "dev"

# Keep repository-wide mise environment value-free. Runtime credentials belong
# in the shell, mise.local.toml, or the repository secret rendering contract.
PROJECT_NAME = "{{ config_root | basename }}"

[tasks]
init = "bash ./scripts/run-install.sh"

[tasks.hooks]
description = "Install canonical pre-commit, commit-msg and pre-push Git hooks"
run = '''
pre-commit install --install-hooks --hook-type pre-commit --hook-type commit-msg
pre-commit install --config .pre-commit-pre-push.yaml --install-hooks --hook-type pre-push
'''

[tasks.quality]
description = "Run the canonical publication quality gate"
run = "bash scripts/quality-gate.sh"

[tasks.info]
description = "Show repository tooling context"
run = '''
echo "Project: $PROJECT_NAME"
echo "Python: $(python --version 2>&1)"
echo "Pre-commit: $(pre-commit --version 2>&1)"
'''
