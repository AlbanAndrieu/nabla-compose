# Default deny, then DNS and the TrueNAS PostgreSQL only. Effective once
# scripts/talos/smoke-networkpolicy-enforcement.sh is green (gate B1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 172.17.0.24/32
      ports:
        - protocol: TCP
          port: 5432
---
# Ingress: cloudflared (TrueNAS) and Prometheus/Gatus (TrueNAS) reach the
# NodePorts; in-cluster callers are not expected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.17.0.0/24
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
