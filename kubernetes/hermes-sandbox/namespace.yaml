# Sandboxes run untrusted, agent-driven commands: PSA restricted is enforced,
# unlike the hermes gateway namespace (baseline, s6 root bootstrap).
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
