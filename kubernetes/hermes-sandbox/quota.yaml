# Hard ceiling on what the broker can provision, whatever Hermes asks for:
# ephemeral pods only, no persistent volumes, Services or LoadBalancers.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-sandbox-quota
spec:
  hard:
    pods: "4"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    requests.ephemeral-storage: 20Gi
    limits.ephemeral-storage: 40Gi
    persistentvolumeclaims: "0"
    services: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hermes-sandbox-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 4Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 10Gi
