# Hermes gateway on Talos — phase 2 of docs/security/hermes-talos-migration.md.
# NOT applied. Same read-only toolset as the Compose service apps/hermes: only the
# nabla_observe MCP, no terminal/file/code/browser/web.
#
# The policy files are shared with the Compose service (single source of truth),
# hence the relaxed load restrictor:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone kubernetes/hermes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes

resources:
  - namespace.yaml
  - storageclass-retain.yaml
  - serviceaccount.yaml
  - service.yaml
  - statefulset.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: hermes
      app.kubernetes.io/managed-by: nabla-compose
    includeSelectors: false

configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=../../config/hermes/config.yaml
  - name: hermes-policy
    files:
      - readonly_mcp.py=../../scripts/hermes/readonly_mcp.py

images:
  # Fail closed: replace with the verified immutable digest before any apply.
  - name: nousresearch/hermes-agent
    digest: sha256:REPLACE_WITH_VERIFIED_DIGEST
