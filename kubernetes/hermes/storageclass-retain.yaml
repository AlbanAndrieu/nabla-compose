# Hermes /opt/data holds state.db* (SQLite): the shared nabla-truenas-nfs class
# uses reclaimPolicy Delete and would destroy it on uninstall. Same TrueNAS
# NFS parameters, but Retain and bound only when the pod is scheduled.
# Single writer only: never scale the StatefulSet above one replica.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nabla-truenas-nfs-retain
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: csi.truenas.io
parameters:
  protocol: "nfs"
  pool: "cpool"
  datasetPath: "k8s/csi"
  compression: "LZ4"
  sync: "STANDARD"
  nfs.networks: "172.17.0.51/32,172.17.0.52/32"
  nfs.mountOptions: "hard,nfsvers=4.1"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
mountOptions:
  - hard
  - nfsvers=4.1
