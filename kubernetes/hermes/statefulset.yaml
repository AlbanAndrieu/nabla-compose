# Kubernetes translation of apps/hermes/compose.yml. One replica: /opt/data is
# not safe for concurrent writers. Secrets come from the operator-created
# Secret hermes-runtime, never from Git.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
spec:
  serviceName: hermes-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: nousresearch/hermes-agent
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          # s6 starts as root and drops the gateway to UID 10000; keep only the
          # bootstrap ownership/identity capabilities, as in the Compose service.
          # Prove at runtime that the gateway's effective UID is 10000 and its
          # CapEff is empty before accepting this phase.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            - name: HERMES_DASHBOARD
              value: "0"
            - name: API_SERVER_ENABLED
              value: "false"
            - name: HERMES_SKIP_CONFIG_MIGRATION
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - secretRef:
                name: hermes-runtime
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "test -w /opt/data && hermes --version"]
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Read-only, GitOps-owned policy: never editable from a chat or UI.
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: policy
              mountPath: /opt/hermes-policy/readonly_mcp.py
              subPath: readonly_mcp.py
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: policy
          configMap:
            name: hermes-policy
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: nabla-truenas-nfs-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
