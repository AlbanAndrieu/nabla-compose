---
# Bazarr of the *arr media stack (status planned).
# Design and acceptance: docs/arr-media-library-roadmap.md
name: bazarr

services:
  bazarr:
    image: ghcr.io/linuxserver/bazarr:1.6.2@sha256:7ef0e58216900dbce30b123e0eb65f5cb30e36f126de9474acdd2022fb069c54
    container_name: bazarr
    restart: unless-stopped
    x-nabla:
      id: bazarr
      name: Bazarr
      kind: subtitle-manager
      category: media
      status: planned
      presentationRole: service
      criticality: low
      description: >-
        Subtitle manager for the Radarr and Sonarr libraries (French and English).
      url: https://bazarr.int.albandrieu.com
      internalUrl: http://bazarr:6767
      runtime:
        provider: truenas-app
        containerService: bazarr
      lifecycle:
        phase: applications
        priority: 76
      monitoring:
        type: http
        target: http://172.17.0.24:30046/
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: radarr
          type: consumesApi
          strength: required
          description: Bazarr reads the movie library through the Radarr API.
          evidence:
            - docs/arr-media-library-roadmap.md:P5 Bazarr
        - target: sonarr
          type: consumesApi
          strength: required
          description: Bazarr reads the series library through the Sonarr API.
          evidence:
            - docs/arr-media-library-roadmap.md:P5 Bazarr
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik exposes the UI only through bazarr.int.albandrieu.com.
          evidence:
            - apps/bazarr/compose.yml:traefik.http.routers.bazarr
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: "568"
      PGID: "568"
      UMASK: "002"
      TZ: Europe/Paris
    ports:
      - name: web
        target: 6767
        published: "30046"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/bazarr/config:/config
      - /mnt/cpool/media:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:6767/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.albandrieu.nabla.entity-ref: component:default/bazarr
      com.albandrieu.nabla.logs: media
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.bazarr.rule: Host(`bazarr.int.albandrieu.com`)
      traefik.http.routers.bazarr.entrypoints: websecure
      traefik.http.routers.bazarr.tls.certresolver: letsencrypt
      traefik.http.routers.bazarr.service: bazarr
      traefik.http.services.bazarr.loadbalancer.server.port: "6767"
    networks:
      - media
      - traefik_network

  bazarr-exporter:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: bazarr-exporter
    restart: unless-stopped
    command:
      - bazarr
    x-nabla:
      id: bazarr-exporter
      name: Bazarr exporter
      kind: metrics-exporter
      category: observability
      status: planned
      presentationRole: support
      criticality: low
      description: >-
        Exportarr metrics for Bazarr (library, queue, health issues) scraped
        by Prometheus over the intranet network.
      runtime:
        provider: truenas-app
        containerService: bazarr-exporter
      lifecycle:
        phase: applications
        priority: 90
      relations:
        - target: bazarr
          type: consumesApi
          strength: required
          description: The exporter reads the Bazarr API with the instance API key.
          evidence:
            - apps/bazarr/compose.yml:URL=http://bazarr:6767
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes bazarr-exporter:9707 (job exportarr_bazarr).
          evidence:
            - apps/prometheus/prometheus.yml:job_name=exportarr_bazarr
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      # API_KEY: same Vaultwarden field as the Bazarr instance key.
      - /mnt/cpool/secrets/runtime/bazarr/.env.secrets
    environment:
      PORT: "9707"
      URL: http://bazarr:6767
      LOG_LEVEL: info
    labels:
      com.albandrieu.nabla.entity-ref: component:default/bazarr-exporter
      com.albandrieu.nabla.logs: media
      com.albandrieu.nabla.healthcheck: prometheus-up
    networks:
      - media
      - intranet

networks:
  media:
    external: true
    name: media
  traefik_network:
    external: true
    name: traefik_network
  intranet:
    external: true
    name: intranet
