---
name: nexus
# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nexus:
    logging: *nabla-logging
    container_name: nexus
    image: sonatype/nexus3:3.92.3-alpine # 3.87.1-01
    x-nabla:
      id: nexus
      name: Nexus Repository
      kind: artifact-repository
      category: development
      presentationRole: service
      criticality: medium
      description: Repository manager for development artifacts and package proxies.
      runtime:
        provider: truenas-app
        containerService: nexus
      # Build-time only, nothing requires it: its JVM starts after the critical waves.
      lifecycle:
        phase: applications
        priority: 90
      monitoring:
        type: port
        host: 172.17.0.24
        port: 8081
      # Public through the Cloudflare tunnel behind Access (owner decision, 17/11/2026).
      exposure:
        - name: public
          hostnames:
            - nexus.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
    restart: unless-stopped
    # Homelab trial (28/11): keep the 2g heap and 2g direct-memory budget;
    # 512 MiB remains for other native memory. Validate peak and package proxies before applying.
    mem_limit: 4608m
    user: "1002:1002" # TrueNAS nexus user
    ports:
      - name: web
        target: 8081
        published: "8081"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/nexus3:/nexus-data
    env_file:
      # - /mnt/cpool/nexus/.env
      - /mnt/cpool/secrets/runtime/nexus/.env.secrets
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
    networks: ["traefik_network"]
    labels:
      com.albandrieu.nabla.entity-ref: component:default/nexus
      # Enabled 22/11/2026: Pi-hole resolves nexus.int and Traefik serves its certificate.
      # NEXUS_PRIVATE_INGRESS_ENABLED=false in the app env is the rollback.
      traefik.enable: "${NEXUS_PRIVATE_INGRESS_ENABLED:-true}"
      traefik.docker.network: traefik_network
      traefik.http.routers.nexus-private.rule: "Host(`nexus.int.albandrieu.com`)"
      traefik.http.routers.nexus-private.entrypoints: websecure
      traefik.http.routers.nexus-private.tls.certresolver: letsencrypt
      traefik.http.routers.nexus-private.service: nexus-private
      # Defense in depth: inspect the socket peer, never spoofable X-Forwarded-For.
      # The public Cloudflare tunnel does not join these trusted workstation LANs.
      traefik.http.routers.nexus-private.middlewares: nexus-private-lan-only
      traefik.http.middlewares.nexus-private-lan-only.ipallowlist.sourcerange: "172.17.0.0/24,192.168.1.0/24"
      # Public route for CI (Cloudflare Access service token), only once the tunnel targets
      # https://traefik:443 (nexus_tunnel_via_traefik). IP-only bouncer: AppSec body limits
      # would break artifact uploads; CrowdSec reads the client IP from Cf-Connecting-Ip.
      traefik.http.routers.nexus-public.rule: "Host(`nexus.albandrieu.com`)"
      traefik.http.routers.nexus-public.entrypoints: websecure
      traefik.http.routers.nexus-public.tls: "true"
      traefik.http.routers.nexus-public.service: nexus-private
      traefik.http.routers.nexus-public.middlewares: crowdsec@file
      traefik.http.services.nexus-private.loadbalancer.server.scheme: http
      traefik.http.services.nexus-private.loadbalancer.server.port: "8081"

networks:
  traefik_network:
    external: true
