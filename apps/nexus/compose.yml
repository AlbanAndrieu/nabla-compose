---
services:
  nexus:
    container_name: nexus
    image: sonatype/nexus3:3.92.3-alpine # 3.87.1-01
    x-nabla:
      id: nexus
      name: Nexus Repository
      kind: artifact-repository
      category: development
      presentationRole: service
      criticality: medium
      description: Repository manager for development artifacts and package proxies.
      runtime:
        provider: truenas-app
        containerService: nexus
      monitoring:
        type: port
        host: 172.17.0.24
        port: 8081
    restart: unless-stopped
    user: "1002:1002" # TrueNAS nexus user
    ports:
      - "8081:8081"
    volumes:
      - /mnt/cpool/nexus3:/nexus-data
    env_file:
      # - /mnt/cpool/nexus/.env
      - /mnt/cpool/nexus3/.env.secrets
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
    networks: ["traefik_network"]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.nexus.rule=Host(`nexus.int.albandrieu.com`)"
    #   - "traefik.http.routers.nexus.entrypoints=websecure"
    #   - "traefik.http.routers.nexus.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.nexus.service=nexus"

networks:
  traefik_network:
    external: true
