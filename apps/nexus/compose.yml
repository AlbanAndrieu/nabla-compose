---
name: nexus
services:
  nexus:
    container_name: nexus
    image: sonatype/nexus3:3.92.3-alpine # 3.87.1-01
    x-nabla:
      id: nexus
      name: Nexus Repository
      kind: artifact-repository
      category: development
      presentationRole: service
      criticality: medium
      description: Repository manager for development artifacts and package proxies.
      runtime:
        provider: truenas-app
        containerService: nexus
      monitoring:
        type: port
        host: 172.17.0.24
        port: 8081
    restart: unless-stopped
    user: "1002:1002" # TrueNAS nexus user
    ports:
      - name: web
        target: 8081
        published: "8081"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/nexus3:/nexus-data
    env_file:
      # - /mnt/cpool/nexus/.env
      - /mnt/cpool/nexus3/.env.secrets
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
    networks: ["traefik_network"]
    labels:
      com.albandrieu.nabla.entity-ref: component:default/nexus
      # Disabled until DNS, TLS and reverse-proxy ownership are verified.
      # Explicit opt-in during reviewed TrueNAS redeploy; does not change
      # the public nexus.albandrieu.com route.
      traefik.enable: "${NEXUS_PRIVATE_INGRESS_ENABLED:-false}"
      traefik.docker.network: traefik_network
      traefik.http.routers.nexus-private.rule: "Host(`nexus.int.albandrieu.com`)"
      traefik.http.routers.nexus-private.entrypoints: websecure
      traefik.http.routers.nexus-private.tls.certresolver: letsencrypt
      traefik.http.routers.nexus-private.service: nexus-private
      traefik.http.services.nexus-private.loadbalancer.server.scheme: http
      traefik.http.services.nexus-private.loadbalancer.server.port: "8081"

networks:
  traefik_network:
    external: true
