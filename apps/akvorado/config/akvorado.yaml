---
kafka:
  topic: akvorado-flows
  brokers:
    - kafka:9092
  topic-configuration:
    num-partitions: 1
    replication-factor: 1
    config-entries:
      retention.ms: 86400000
      cleanup.policy: delete
      compression.type: producer

clickhousedb:
  servers:
    - clickhouse:9000
  database: akvorado
  username: akvorado

clickhouse:
  orchestrator-url: http://akvorado-orchestrator:8080
  prometheus-endpoint: /metrics

inlet:
  flow:
    inputs:
      - type: udp
        decoder: netflow
        listen: :2055
        workers: 2
        receive-buffer: 212992

outlet:
  # NetFlow v5 capture on 2026-10-23: both input/output ifIndex=11 (10/10 records).
  # Actual pfSense interface name and link speed remain unverified.
  # Static provider avoids repeated failed SNMP GETs against memory-limited Netgate 1100.
  # Unknown ifIndexes deliberately remain unresolved; do not invent a default.
  metadata:
    providers:
      - type: static
        exporters:
          172.17.0.1/32:
            name: pfsense-netgate1100
            ifindexes:
              11:
                name: pflow-ifindex-11
                description: Observed NetFlow v5 ifIndex 11; pfSense interface unverified
  geoip:
    optional: true
  networks:
    networks:
      172.17.0.0/24:
        name: homelab-lan
        role: internal
    network-sources: []
  core:
    exporter-classifiers:
      - ClassifySite("homelab")
      - ClassifyRegion("europe")
      - ClassifyTenant("nabla")
      - ClassifyRole("edge")
    interface-classifiers:
      - ClassifyInternal()

console:
  database:
    saved-filters:
      - description: Homelab LAN
        content: SrcNetName = "homelab-lan" OR DstNetName = "homelab-lan"
