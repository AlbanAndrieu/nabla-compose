services:
  elasticsearch:
    image: docker.io/elasticsearch:8.14.0
    container_name: elasticsearch
    x-nabla:
      id: elasticsearch
      name: Elasticsearch
      kind: search
      category: data
      runtime:
        provider: truenas-app
        containerService: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      # - esdata:/usr/share/elasticsearch/data
      - /mnt/cpool/elasticsearch/data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - traefik_network
    restart: unless-stopped

  kibana:
    image: docker.io/kibana:8.14.0
    container_name: kibana
    x-nabla:
      id: kibana
      name: Kibana
      kind: dashboard
      category: observability
      runtime:
        provider: truenas-app
        containerService: kibana
      relations:
        - target: elasticsearch
          type: dependsOn
          strength: required
          description: Kibana queries Elasticsearch for indexed data and saved objects.
          evidence:
            - apps/elasticsearch/compose.yml:ELASTICSEARCH_HOSTS
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - traefik_network
    restart: unless-stopped

# volumes:
#   esdata:

networks:
  traefik_network:
    external: true
