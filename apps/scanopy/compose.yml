---
services:
  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    x-nabla:
      id: scanopy-daemon
      name: Scanopy Daemon
      kind: network-discovery-scanner
      category: network
      presentationRole: support
      criticality: medium
      securityFunctions:
        - identify
        - detect
      description: Privileged agentless scanner used by Scanopy to discover hosts, ports, containers, and network topology.
      runtime:
        provider: truenas-app
        containerService: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://172.17.0.24:60072
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:60073/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - /mnt/cpool/scanopy/daemon-config:/root/.config/scanopy/daemon
      # Required for native Docker discovery. Keep the socket read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy:
    image: ghcr.io/scanopy/scanopy/server:latest
    container_name: scanopy
    x-nabla:
      id: scanopy
      name: Scanopy
      kind: network-topology-management
      category: network
      presentationRole: service
      criticality: medium
      securityFunctions:
        - identify
        - detect
      url: http://172.17.0.24:60072
      description: Agentless network discovery and continuously updated topology documentation backed by the shared PostgreSQL service.
      runtime:
        provider: truenas-app
        containerService: scanopy
      monitoring:
        type: port
        host: 172.17.0.24
        port: 60072
      relations:
        - target: postgresql
          type: storesIn
          strength: required
          description: Scanopy stores topology, inventory, and discovery history in its dedicated scanopy database on the shared PostgreSQL service.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_DATABASE_URL
        - target: scanopy-daemon
          type: consumesApi
          strength: required
          description: Scanopy consumes discovery data from its integrated daemon.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_INTEGRATED_DAEMON_URL
    restart: unless-stopped
    env_file:
      # Must define SCANOPY_DATABASE_URL for role/database scanopy on 172.17.0.24:5432.
      - /mnt/cpool/secrets/runtime/scanopy/.env.secrets
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://172.17.0.24:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "172.17.0.24:60072:60072"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      scanopy-daemon:
        condition: service_healthy
    volumes:
      - /mnt/cpool/scanopy/data:/data
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
