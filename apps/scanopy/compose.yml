---
name: scanopy
services:
  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:v0.19.5@sha256:6b1acbde375dd2306aca6eba9388a94b7b28fb66eca46ffe484d4ce487b1d4c6
    container_name: scanopy-daemon
    labels:
      com.albandrieu.nabla.entity-ref: component:default/scanopy-daemon
    x-nabla:
      id: scanopy-daemon
      name: Scanopy Daemon
      kind: network-discovery-scanner
      category: network
      presentationRole: support
      criticality: medium
      securityFunctions:
        - identify
        - detect
      description: Agentless scanner used by Scanopy to discover hosts, ports and network topology.
      runtime:
        provider: truenas-app
        containerService: scanopy-daemon
    # Host networking stays for LAN/ARP discovery, which needs raw sockets, not privileged mode.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      # /api/initialize is unauthenticated until the first org claims the daemon: listen on
      # docker0 (TrueNAS pool 10.200.0.0/16), which host.docker.internal reaches, not the LAN.
      SCANOPY_BIND_ADDRESS: 10.200.0.1
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://172.17.0.24:60072
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://10.200.0.1:60073/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - /mnt/cpool/scanopy/daemon-config:/root/.config/scanopy/daemon
      # No Docker socket: a ro bind does not restrict the Docker API. Docker discovery goes
      # through docker-socket-proxy, configured as a credential in the Scanopy UI.

  scanopy:
    image: ghcr.io/scanopy/scanopy/server:v0.19.5@sha256:ec6a9b23af5094c009cb61d3078b4ba25c01471c9c3a126566b735b5df9cee3f
    container_name: scanopy
    labels:
      com.albandrieu.nabla.entity-ref: component:default/scanopy
    x-nabla:
      id: scanopy
      name: Scanopy
      kind: network-topology-management
      category: network
      presentationRole: service
      criticality: medium
      securityFunctions:
        - identify
        - detect
      url: http://172.17.0.24:60072
      description: Agentless network discovery and continuously updated topology documentation backed by the shared PostgreSQL service.
      runtime:
        provider: truenas-app
        containerService: scanopy
      monitoring:
        type: port
        host: 172.17.0.24
        port: 60072
      relations:
        - target: postgresql
          type: storesIn
          strength: required
          description: Scanopy stores topology, inventory, and discovery history in its dedicated scanopy database on the shared PostgreSQL service.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_DATABASE_URL
        - target: scanopy-daemon
          type: consumesApi
          strength: required
          description: Scanopy consumes discovery data from its integrated daemon.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_INTEGRATED_DAEMON_URL
    restart: unless-stopped
    env_file:
      # Must define SCANOPY_DATABASE_URL for role/database scanopy on 172.17.0.24:5432.
      - /mnt/cpool/secrets/runtime/scanopy/.env.secrets
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://172.17.0.24:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      # Every sign-up creates its own org and the first one claims the integrated daemon:
      # closed unless the one-time admin bootstrap (README) sets it to false.
      SCANOPY_DISABLE_REGISTRATION: ${SCANOPY_DISABLE_REGISTRATION:-true}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - name: web
        target: 60072
        published: "60072"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      scanopy-daemon:
        condition: service_healthy
    volumes:
      - /mnt/cpool/scanopy/data:/data
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
