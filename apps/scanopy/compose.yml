---
services:
  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    x-nabla:
      id: scanopy-daemon
      name: Scanopy Daemon
      kind: network-discovery-scanner
      category: network
      presentationRole: support
      criticality: medium
      securityFunctions:
        - identify
        - detect
      description: Privileged agentless scanner used by Scanopy to discover hosts, ports, containers, and network topology.
      runtime:
        provider: truenas-app
        containerService: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://172.17.0.24:60072
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:60073/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - /mnt/cpool/scanopy/daemon-config:/root/.config/scanopy/daemon
      # Required for native Docker discovery. Keep the socket read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy-postgres:
    image: postgres:17-alpine
    container_name: scanopy-postgres
    x-nabla:
      id: scanopy-postgres
      name: Scanopy PostgreSQL
      kind: relational-database
      category: data
      presentationRole: support
      criticality: medium
      description: Dedicated PostgreSQL database for Scanopy topology and discovery data.
      runtime:
        provider: truenas-app
        containerService: scanopy-postgres
    restart: unless-stopped
    env_file:
      # Must define POSTGRES_PASSWORD; never commit it to this repository.
      - /mnt/cpool/scanopy/.env.secrets
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: scanopy
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanopy -d scanopy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - /mnt/cpool/scanopy/postgres:/var/lib/postgresql/data
    networks:
      - intranet

  scanopy:
    image: ghcr.io/scanopy/scanopy/server:latest
    container_name: scanopy
    x-nabla:
      id: scanopy
      name: Scanopy
      kind: network-topology-management
      category: network
      presentationRole: service
      criticality: medium
      securityFunctions:
        - identify
        - detect
      url: http://172.17.0.24:60072
      description: Agentless network discovery and continuously updated topology documentation.
      runtime:
        provider: truenas-app
        containerService: scanopy
      monitoring:
        type: port
        host: 172.17.0.24
        port: 60072
      relations:
        - target: scanopy-postgres
          type: storesIn
          strength: required
          description: Scanopy stores its topology, inventory, and discovery history in its dedicated PostgreSQL database.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_DATABASE_URL
        - target: scanopy-daemon
          type: consumesApi
          strength: required
          description: Scanopy consumes discovery data from its integrated daemon.
          evidence:
            - apps/scanopy/compose.yml:SCANOPY_INTEGRATED_DAEMON_URL
    restart: unless-stopped
    env_file:
      # Must define SCANOPY_DATABASE_URL with the same password as POSTGRES_PASSWORD.
      - /mnt/cpool/scanopy/.env.secrets
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://172.17.0.24:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "172.17.0.24:60072:60072"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      scanopy-postgres:
        condition: service_healthy
      scanopy-daemon:
        condition: service_healthy
    volumes:
      - /mnt/cpool/scanopy/data:/data
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
