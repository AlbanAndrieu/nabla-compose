---
secrets:
  ntopng_runtime_env:
    file: /mnt/cpool/secrets/runtime/ntopng/.env.secrets

services:
  ntopng:
    # Upstream only publishes a rolling `latest` (apt-stable, rebuilt daily): pinned by digest for Renovate.
    image: ntop/ntopng:latest@sha256:72433036b248b7aaf5c8b59380dc6162aa292b7bd791f94843cd80a50c8b43d6
    container_name: ntopng
    restart: unless-stopped
    labels:
      com.albandrieu.nabla.entity-ref: component:default/ntopng
    x-nabla:
      id: ntopng
      name: ntopng
      kind: network-observability
      category: network
      url: http://172.17.0.24:31080
      runtime:
        provider: truenas-app
        containerService: ntopng
      monitoring:
        type: port
        host: 172.17.0.24
        port: 31080
    # Host networking: ntopng captures br0 itself (ntopng.conf).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    # Mounted as a file, not env_file: the admin password stays out of Docker Config.Env.
    secrets:
      - source: ntopng_runtime_env
        target: ntopng_runtime_env
        mode: "0400"
    environment:
      TZ: ${TZ:-Europe/Paris}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/nabla-ntopng-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --timeout=5 http://172.17.0.24:31080/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /mnt/cpool/ntopng:/var/lib/ntopng
      - /mnt/cpool/ntopng/redis:/var/lib/redis
      - type: bind
        source: /mnt/cpool/compose/nabla-compose/apps/ntopng/ntopng.conf
        target: /etc/ntopng/nabla.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/compose/nabla-compose/apps/ntopng/entrypoint.sh
        target: /usr/local/bin/nabla-ntopng-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
