---
services:
  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    x-nabla:
      id: ntopng
      name: ntopng
      kind: network-observability
      category: network
      runtime:
        provider: truenas-app
        containerService: ntopng
      relations:
        - target: clickhouse
          type: storesIn
          strength: required
          description: ntopng stores historical flow data in the existing ClickHouse service.
          evidence:
            - apps/ntopng/compose.yml:CLICKHOUSE_HOST
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - /mnt/cpool/ntopng/.env.secrets
    environment:
      TZ: ${TZ:-Europe/Paris}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-172.17.0.24}
      NTOPNG_INTERFACE: ${NTOPNG_INTERFACE:-eth0}
      NTOPNG_HTTP_PORT: ${NTOPNG_HTTP_PORT:-3000}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/nabla-ntopng-entrypoint.sh
    volumes:
      - /mnt/cpool/ntopng:/var/lib/ntopng
      - /mnt/cpool/ntopng/redis:/var/lib/redis
      - type: bind
        source: /mnt/cpool/ntopng/ntopng.license
        target: /etc/ntopng.license
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/compose/nabla-compose/apps/ntopng/entrypoint.sh
        target: /usr/local/bin/nabla-ntopng-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
