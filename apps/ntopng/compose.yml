---
services:
  ntopng:
    image: ntop/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    x-nabla:
      id: ntopng
      name: ntopng
      kind: network-observability
      category: network
      runtime:
        provider: truenas-app
        containerService: ntopng
      relations:
        - target: clickhouse
          type: storesIn
          strength: required
          description: ntopng stores historical flow data in the existing ClickHouse service.
          evidence:
            - apps/ntopng/compose.yml:CLICKHOUSE_HOST
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ:-Europe/Paris}
    command:
      - -i
      - ${NTOPNG_INTERFACE:-eth0}
      - -w
      - ${NTOPNG_HTTP_PORT:-3000}
      - -F
      - "clickhouse;${CLICKHOUSE_HOST:-172.17.0.24};${NTOPNG_CLICKHOUSE_DATABASE:-ntopng};${CLICKHOUSE_USER:-clickhouse};${CLICKHOUSE_PASSWORD:-clickhouse}"
    volumes:
      - /mnt/cpool/ntopng:/var/lib/ntopng
      - /mnt/cpool/ntopng/redis:/var/lib/redis
