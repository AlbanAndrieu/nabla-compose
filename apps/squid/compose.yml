---
name: squid
# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  squid:
    logging: *nabla-logging
    image: sameersbn/squid:3.5.27-2
    x-nabla:
      id: squid
      name: Squid Proxy
      kind: forward-proxy
      category: network
      presentationRole: support
      criticality: medium
      description: Internal forward proxy for controlled HTTP(S) egress experiments.
      runtime:
        provider: truenas-app
        containerService: squid
      monitoring:
        type: port
        host: 172.17.0.24
        port: 3128
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: proxy
    restart: unless-stopped
    labels:
      com.albandrieu.nabla.entity-ref: component:default/squid
    ports:
      - name: proxy
        target: 3128
        published: "3128"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    tmpfs:
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=64m
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
