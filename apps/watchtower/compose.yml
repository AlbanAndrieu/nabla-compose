---
name: watchtower
x-nabla:
  deploymentUnit:
    id: watchtower
    criticality: high
    stateful: false
    upgradePolicy: excluded
services:
  watchtower:
    # Maintained upstream fork; archived containrrr/watchtower must not be used.
    # Manual dry-run only until TrueNAS/Docker API and socket gates pass.
    image: nickfedor/watchtower:1.23.1
    profiles: ["manual-audit"]
    container_name: watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_LABEL_TAKE_PRECEDENCE: "false"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_INCLUDE_RESTARTING: "false"
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.albandrieu.nabla.entity-ref: component:default/watchtower
    volumes:
      # :ro prevents socket file replacement, NOT Docker API write access.
      # Mounting this socket grants effectively host-root privileges.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
