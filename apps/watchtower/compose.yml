---
name: watchtower
x-nabla:
  deploymentUnit:
    id: watchtower
    criticality: high
    stateful: false
    upgradePolicy: excluded
services:
  watchtower:
    # Maintained upstream fork; archived containrrr/watchtower must not be used.
    # Manual dry-run only until TrueNAS/Docker API and socket gates pass.
    image: nickfedor/watchtower:1.23.1
    profiles: ["manual-audit"]
    x-nabla:
      id: watchtower
      name: Watchtower
      kind: image-update-auditor
      category: security
      status: planned
      presentationRole: support
      description: Manual monitor-only image update audit through the read-only Docker socket proxy; never updates containers.
      runtime:
        provider: truenas-app
        containerService: watchtower
      relations:
        - target: docker-socket-proxy
          type: consumesApi
          strength: required
          description: Watchtower lists containers and images through the allowlisted, POST-disabled Docker API proxy.
          evidence:
            - apps/watchtower/compose.yml:DOCKER_HOST
    container_name: watchtower
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_NO_PULL: "true"
      WATCHTOWER_LABEL_TAKE_PRECEDENCE: "false"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_INCLUDE_RESTARTING: "false"
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    # Audit-only Docker GET boundary: the existing proxy has POST=0.
    # No raw engine socket, host ports or update capabilities here.
    networks:
      - intranet
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
