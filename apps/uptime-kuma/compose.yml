---
name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.10-rootless
    container_name: uptime-kuma
    labels:
      com.albandrieu.nabla.entity-ref: component:default/uptime-kuma
    x-nabla:
      id: uptime-kuma
      name: Uptime Kuma
      kind: uptime-monitor
      category: observability
      url: http://172.17.0.24:31050
      description: Repository-owned Uptime Kuma monitoring engine and UI, reconciled by AutoKuma.
      runtime:
        provider: truenas-app
        appId: uptime-kuma
        containerService: uptime-kuma
      lifecycle:
        phase: platform-services
        priority: 40
    restart: unless-stopped
    # LAN-bound host port; the Cloudflare tunnel route to it sits behind Access (README).
    ports:
      - "172.17.0.24:31050:3001"
    volumes:
      - /mnt/cpool/uptime-kuma:/app/data
    user: "568:568"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
