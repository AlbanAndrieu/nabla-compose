---
services:
  pyroscope:
    image: grafana/pyroscope:2.3.0
    container_name: pyroscope
    x-nabla:
      id: pyroscope
      name: Grafana Pyroscope
      kind: continuous-profiler
      category: observability
      presentationRole: support
      criticality: medium
      description: Continuous profiling backend with persistent Pyroscope v2 metastore state.
      runtime:
        provider: truenas-app
        containerService: pyroscope
      monitoring:
        type: http
        target: http://172.17.0.24:4040/
        url: http://172.17.0.24:4040/metrics
      relations:
        - target: grafana
          type: observedBy
          strength: optional
          description: Grafana queries Pyroscope as a profiling data source.
          evidence:
            - apps/pyroscope/compose.yml:TCP/4040
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes Pyroscope self-metrics from /metrics.
          evidence:
            - apps/pyroscope/compose.yml:pyroscope.x-nabla.monitoring.url
    restart: unless-stopped
    ports:
      - "4040:4040"
    command:
      - "server"
      # Pyroscope v2 keeps its metastore Raft WAL/state on disk. Keep both
      # v1 compatibility data and v2 metadata outside the container layer so
      # restarts/recreates do not reuse or lose opaque ephemeral state.
      - "-pyroscopedb.data-path=/var/lib/pyroscope/v1"
      - "-metastore.raft.dir=/var/lib/pyroscope/v2/metastore/raft"
      - "-metastore.data-dir=/var/lib/pyroscope/v2/metastore/data"
      - "-storage.filesystem.dir=/var/lib/pyroscope/v2/shared"
    volumes:
      - /mnt/cpool/pyroscope/data:/var/lib/pyroscope
