---
services:
  cyberbro:
    image: ghcr.io/stanfrbd/cyberbro:v0.14.2
    container_name: cyberbro
    restart: unless-stopped
    x-nabla:
      id: cyberbro
      name: Cyberbro
      kind: threat-intelligence-analysis
      category: security
      presentationRole: service
      criticality: medium
      securityFunctions:
        - identify
        - detect
      url: http://172.17.0.24:5100
      description: Lightweight threat-intelligence workbench for extracting IoCs and checking reputation across OSINT, CTI, and EDR engines.
      runtime:
        provider: truenas-app
        containerService: cyberbro
      monitoring:
        type: http
        target: http://172.17.0.24:5100/
        conditions:
          - "[STATUS] == 200"
    env_file:
      - path: /mnt/cpool/secrets/runtime/cyberbro/.env.secrets
        required: false
    environment:
      API_CACHE_TIMEOUT: ${CYBERBRO_API_CACHE_TIMEOUT:-86400}
      API_PREFIX: ${CYBERBRO_API_PREFIX:-api}
      DISABLE_VERSION_CHECK: ${CYBERBRO_DISABLE_VERSION_CHECK:-false}
      FLASK_DEBUG: "false"
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      GUI_CACHE_TIMEOUT: ${CYBERBRO_GUI_CACHE_TIMEOUT:-1800}
      GUI_ENABLED_ENGINES: ${CYBERBRO_GUI_ENABLED_ENGINES:-}
      GUNICORN_THREADS_COUNT: ${CYBERBRO_GUNICORN_THREADS_COUNT:-2}
      GUNICORN_TIMEOUT: ${CYBERBRO_GUNICORN_TIMEOUT:-120}
      GUNICORN_WORKERS_COUNT: ${CYBERBRO_GUNICORN_WORKERS_COUNT:-2}
      MAX_FORM_MEMORY_SIZE: ${CYBERBRO_MAX_FORM_MEMORY_SIZE:-1048576}
      MIGRATE_OWNERSHIP_ON_START: "true"
      PROXY_URL: ${CYBERBRO_PROXY_URL:-}
      SSL_VERIFY: ${CYBERBRO_SSL_VERIFY:-true}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "172.17.0.24:${CYBERBRO_PORT:-5100}:5000"
    volumes:
      - /mnt/cpool/cyberbro/data:/app/data
      - /mnt/cpool/cyberbro/logs:/var/log/cyberbro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - intranet

  mcp-cyberbro:
    image: ghcr.io/stanfrbd/mcp-cyberbro:v0.0.5
    container_name: mcp-cyberbro
    restart: unless-stopped
    x-nabla:
      id: mcp-cyberbro
      name: Cyberbro MCP
      kind: mcp-server
      category: security
      presentationRole: support
      criticality: low
      securityFunctions:
        - identify
        - detect
      description: Model Context Protocol bridge exposing Cyberbro observable-analysis tools to MCP-capable clients such as LiteLLM.
      runtime:
        provider: truenas-app
        containerService: mcp-cyberbro
      monitoring:
        type: port
        host: 172.17.0.24
        port: 8013
      relations:
        - target: cyberbro
          type: consumesApi
          strength: required
          description: Cyberbro MCP submits observables to the Cyberbro HTTP API and retrieves analysis results.
          evidence:
            - apps/cyberbro/compose.yml:CYBERBRO_URL
        - target: litellm
          type: providesApi
          strength: optional
          description: LiteLLM can consume this streamable HTTP MCP endpoint as an upstream MCP server.
          evidence:
            - apps/litellm/config.yaml:mcp_servers.cyberbro
    environment:
      API_PREFIX: api
      CYBERBRO_URL: http://cyberbro:5000
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_STREAMABLE_HTTP_PATH: /mcp
      MCP_TRANSPORT: streamable-http
      SSL_VERIFY: "true"
    ports:
      - "172.17.0.24:${CYBERBRO_MCP_PORT:-8013}:8000"
    depends_on:
      cyberbro:
        condition: service_healthy
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
