---
name: postgres-exporter

services:
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres_exporter
    labels:
      com.albandrieu.nabla.entity-ref: component:default/postgres-exporter
    x-nabla:
      id: postgres-exporter
      name: PostgreSQL Exporter
      kind: metrics-exporter
      category: observability
      presentationRole: support
      criticality: medium
      description: Prometheus exporter for the shared PostgreSQL service.
      runtime:
        provider: truenas-app
        containerService: postgres_exporter
      monitoring:
        type: port
        host: 172.17.0.24
        port: 9187
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: The exporter queries the shared PostgreSQL service.
          evidence:
            - apps/postgres-exporter/compose.yml:DATA_SOURCE_NAME
    restart: unless-stopped
    # Scoped runtime secret materialized from Vaultwarden by the operator.
    # Do not inherit all application DB secrets or interpolate a missing DSN.
    env_file:
      # render_from_bitwarden.py single-quotes a DSN (it has "?"), which Compose
      # reads literally; format: raw would keep the quotes inside the value.
      - path: /mnt/cpool/secrets/runtime/postgres-exporter/.env.secrets
        required: true
    ports:
      - name: metrics
        target: 9187
        published: "9187"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    networks:
      - default
