---
services:
  influxdb:
    image: influxdb:2.8
    container_name: influxdb
    restart: unless-stopped
    x-nabla:
      id: influxdb
      name: InfluxDB
      kind: time-series-database
      category: data
      description: Shared InfluxDB 2.x time-series database for Scrutiny and future homelab consumers.
      runtime:
        provider: truenas-app
        containerService: influxdb
    ports:
      - "127.0.0.1:31055:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?set INFLUXDB_ADMIN_PASSWORD via the secret provider}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-nabla}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_DEFAULT_BUCKET:-scrutiny}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?set INFLUXDB_ADMIN_TOKEN via the secret provider}
      TZ: Europe/Paris
    volumes:
      - /mnt/cpool/influxdb/data:/var/lib/influxdb2
      - /mnt/cpool/influxdb/config:/etc/influxdb2
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8086/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
