---
services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    x-nabla:
      id: influxdb
      name: InfluxDB
      kind: time-series-database
      category: data
      description: Shared InfluxDB 2.x time-series database for Scrutiny and future homelab consumers.
      runtime:
        provider: truenas-app
        containerService: influxdb
    ports:
      - "127.0.0.1:31055:8086"
    environment:
      INFLUXD_HTTP_BIND_ADDRESS: ":8086"
      TZ: Europe/Paris
    volumes:
      - /mnt/cpool/influxdb/data:/var/lib/influxdb2
      - /mnt/cpool/influxdb/config:/etc/influxdb2
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:8086/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      intranet:
        aliases:
          - influxdb

networks:
  intranet:
    external: true
    name: intranet
