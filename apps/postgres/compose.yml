---
name: postgres

services:
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    labels:
      com.albandrieu.nabla.entity-ref: component:default/postgres-exporter
    x-nabla:
      id: postgres-exporter
      name: PostgreSQL Exporter
      kind: metrics-exporter
      category: observability
      presentationRole: support
      criticality: medium
      description: Prometheus exporter for the shared PostgreSQL service.
      runtime:
        provider: truenas-app
        containerService: postgres_exporter
      monitoring:
        type: port
        host: 172.17.0.24
        port: 9187
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: The exporter queries the shared PostgreSQL service.
          evidence:
            - apps/postgres/compose.yml:DATA_SOURCE_NAME
    restart: unless-stopped
    # Scoped runtime secret materialized from Vaultwarden by the operator.
    # Do not inherit all application DB secrets or interpolate a missing DSN.
    env_file:
      # Requires Docker Compose >=2.30.0; preserves dollar signs in passwords.
      - path: /mnt/cpool/secrets/runtime/postgres-exporter/.env.secrets
        required: true
        format: raw
    ports:
      - name: metrics
        target: 9187
        published: "9187"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    networks:
      - default
