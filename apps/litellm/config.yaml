model_list:
  # ========== Ollama ==========
  # The 6 GB workstation GPU holds one chat model: every route to 172.17.0.57:11434 uses
  # bonsai-2:9b at num_ctx 32768, like the workstation LiteLLM, so they share one instance.
  # llama3.2 and gemma3 were removed on 14 Nov 2026: each loaded a second model.

  # - model_name: qwen
  #   litellm_params:
  #     model: ollama_chat/qwen3.5:2b
  #     api_base: http://ollama:11434
  #     num_ctx: 4096
  #     temperature: 1.0
  #     top_p: 0.95
  #     extra_body:
  #       top_k: 20
  #       presence_penalty: 1.5

  # Same model and num_ctx as the workstation LiteLLM "qwen": another num_ctx reloads the model on
  # the 6 GB GPU; think false skips the reasoning trace. Qwen3.5 9B ternary, 100% GPU at 32k
  # (ansible-workstation docs/gpu-llm-workstation.md).
  - model_name: qwen
    litellm_params:
      model: ollama_chat/bonsai-2:9b
      api_base: http://172.17.0.57:11434 # using RTX 2060
      # api_base: "http://172.17.0.24:30068"
      num_ctx: 32768
      think: false
    model_info:
      mode: chat
      # OpenClaw tool calls require this model-specific capability.
      supports_function_calling: true
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Same GPU instance with the reasoning trace (about 3x slower): think does not reload the model.
  - model_name: qwen-think
    litellm_params:
      model: ollama_chat/bonsai-2:9b
      api_base: http://172.17.0.57:11434 # using RTX 2060
      num_ctx: 32768
      think: true
    model_info:
      mode: chat
      supports_function_calling: true
      supports_reasoning: true
      input_cost_per_token: 0
      output_cost_per_token: 0

  # Primary embedding route: proxy the request to the GPU workstation LiteLLM.
  # The upstream workstation must expose the model alias "embedding".
  - model_name: embedding
    litellm_params:
      model: openai/embedding
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 300
    model_info:
      mode: embedding

  # Explicit local fallback/rollback target. Keep this alias separate so the
  # router never load-balances silently between GPU and TrueNAS CPU inference.
  - model_name: embedding-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: "http://172.17.0.24:30068"
    model_info:
      mode: embedding

  # OpenClaw embedding governance: model-specific aliases. Do NOT configure
  # cross-model fallback: each model requires its own vector index.
  # These routes reuse the existing scoped workstation upstream credential;
  # verify its allowlist and upstream model availability before deployment.
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 300
    model_info:
      mode: embedding

  - model_name: text-embedding-ada-002
    litellm_params:
      model: openai/text-embedding-ada-002
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 300
    model_info:
      mode: embedding

  # Personal OpenAI API last-resort route intentionally NOT active.
  # Activation requires separate runtime secret, cost cap, and explicit review.
  # - model_name: text-embedding-3-small
  #   litellm_params:
  #     model: openai/text-embedding-3-small
  #     api_key: os.environ/OPENAI_PERSONAL_EMBEDDINGS_API_KEY
  #   model_info:
  #     mode: embedding

  # Hermes private/opt-in routing: provider credentials live ONLY in the
  # LiteLLM TrueNAS secret file; Hermes receives a model-scoped virtual key.
  # DO NOT redeploy the shared proxy before Vaultwarden materializes both
  # ANTHROPIC_API_KEY and OPENAI_API_KEY and the installed LiteLLM version
  # is verified to support these pinned Opus model identifiers.
  # Exact model versions, no "latest" aliases or wildcard grants.
  - model_name: hermes-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: hermes-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: hermes-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  # Explicitly last in Hermes' failover chain, never a random load-balancer.
  - model_name: hermes-openai
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  # OpenClaw Gateway parity: same public names as the Workstation proxy
  # (litellm-main/gpt-4.1, litellm-cron/gpt-4.1-mini); the Workstation keeps
  # the provider deployments, TrueNAS only relays.
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 180
    model_info:
      mode: chat
      supports_function_calling: true

  # Future proxy path for consumers that should traverse TrueNAS LiteLLM first.
  - model_name: workstation-qwen
    litellm_params:
      model: openai/qwen
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_IDE_API_KEY
      request_timeout: 900
    model_info:
      mode: chat
      supports_function_calling: true

  # Dedicated FastAPI staging relay: never reuse unrestricted IDE key.
  # This is a different TrueNAS virtual model, not a workstation model name.
  - model_name: fastapi-qwen
    litellm_params:
      model: openai/qwen
      api_base: os.environ/LITELLM_WORKSTATION_API_BASE
      api_key: os.environ/LITELLM_FASTAPI_WORKSTATION_API_KEY
      request_timeout: 120
    model_info:
      mode: chat
      supports_function_calling: true
      # Internal metering quota for on-prem Qwen, NOT a provider invoice.
      # Verify effective spend counters before treating virtual budget as enforced.
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Reactive Resume: same model and num_ctx as "qwen", so both routes share one GPU instance.
  # Its chat sends the whole resume JSON and a patch_resume tool (3/3 edits vs 2/3 for qwen2.5:3b).
  - model_name: rr-json
    litellm_params:
      model: ollama_chat/bonsai-2:9b
      api_base: "http://172.17.0.57:11434"
      temperature: 0
      num_ctx: 32768
      think: false

  # Optional generic external providers: do not enable until the matching
  # private runtime credentials and model availability have been validated.
  # - model_name: gpt-image
  #   litellm_params:
  #     model: openai/gpt-image-1
  #     api_key: os.environ/NABLA_FREE_OPENAI_API_KEY
  # - model_name: claude-3-5-sonnet-20241022
  #   litellm_params:
  #     model: anthropic/claude-3-5-sonnet-20241022
  #     api_key: os.environ/ANTHROPIC_API_KEY
  # - model_name: deepseek-chat
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY

mcp_servers:
  cyberbro:
    transport: http
    url: os.environ/CYBERBRO_MCP_URL
    description: Cyberbro threat-intelligence and IoC analysis tools

general_settings:
  # master_key: sk_XXX
  # database_url: "postgresql://<user>:<password>@<host>:<port>/<dbname>"
  # database_url: postgresql://nabla:XXX@172.17.0.24:5432/litellm
  # disable_cache_on_db_queries: true
  # store_model_in_db: false # change to true or fix : Invalid proxy server token passed ... not found in db
  store_model_in_db: true
  # P1 hardening: named proxy_admin verified with access to models, users and budgets.
  # Deploy only after validating Cloudflare Access and rollback procedure.
  disable_env_credential_login: true
  # A service key restricted to fastapi-qwen cannot use global router fallbacks.
  enforce_fallback_model_access: true
  store_prompts_in_spend_logs: true
  custom_headers:
    forward_headers:
      - X-OpenWebUI-User-Name
      - X-OpenWebUI-User-Id
      - X-OpenWebUI-User-Email
      - X-OpenWebUI-User-Role
      - X-OpenWebUI-Chat-Id
      - X-OpenWebUI-Session
      - X-Session-Id
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
litellm_settings:
  fallbacks:
    # Only use aliases configured on this TrueNAS proxy.
    # Private paid upstream routes remain outside this deployment.
    # Another local model would only swap the GPU model; the GPU routes share one instance.
    - { "qwen": [] }
    - { "qwen-think": [] }
    - { "rr-json": [] }
    # Explicitly no alternate paid/local model for this budget-scoped service.
    - { "fastapi-qwen": [] }
    # Strict paid-model order for Hermes (no local/random model substitution).
    # The Hermes virtual key permits exactly these four model groups; gateway
    # enforce_fallback_model_access blocks every other route, including default_fallbacks.
    - {
        "hermes-opus-5-5":
          ["hermes-opus-5", "hermes-opus-4-8", "hermes-openai"],
      }
    - { "hermes-opus-5": ["hermes-opus-4-8", "hermes-openai"] }
    - { "hermes-opus-4-8": ["hermes-openai"] }
    - { "hermes-openai": [] }
  default_fallbacks: ["qwen"]
  cache: true
  cache_params:
    type: redis
    redis_url: os.environ/REDIS_URL
    # host: redis
    # port: 6379
  request_timeout: 600
  num_retries: 1
  # stream: true
  drop_params: true
  # set_verbose: true
  callbacks:
    - langfuse_otel
    - prometheus
  success_callback: ["langfuse_otel"]
  failure_callback: ["langfuse_otel"]
  turn_off_message_logging: false
  langfuse_default_tags:
    - openwebui
    - thiga-ai
    - local-ollama
    - qwen
    - rag
    - assistant-thiga-solution-architect
    - prompt-v1
    - truenas
  prometheus_initialize_budget_metrics: true
router_settings:
  # Prefer the least-busy deployment when multiple backends share an alias.
  routing_strategy: least-busy
  allowed_fails: 1
  cooldown_time: 30
  timeout: 120
  enable_pre_call_checks: true
  # Do not copy the Workstation's five retries: repeated requests amplify 429s.
  num_retries: 1
