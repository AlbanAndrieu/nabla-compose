---
services:
  obsidian:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/obsidian
    image: lscr.io/linuxserver/obsidian:1.13.7
    container_name: obsidian
    restart: unless-stopped
    x-nabla:
      id: obsidian
      name: Obsidian
      kind: application
      category: productivity
      runtime:
        provider: truenas-app
        containerService: obsidian
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web
    environment:
      PGID: ${PGID:-568}
      PUID: ${PUID:-568}
      TZ: ${TZ:-Europe/Paris}
    ports:
      - name: web
        target: 3000
        published: "${OBSIDIAN_HTTP_PORT:-3002}"
        protocol: tcp
        app_protocol: http
      - "${OBSIDIAN_HTTPS_PORT:-3003}:3001"
    shm_size: 1gb
    volumes:
      - /mnt/cpool/obsidian:/config
