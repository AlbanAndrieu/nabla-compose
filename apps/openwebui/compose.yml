  #     - open-webui
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
  #     interval: 30s
  #     timeout: 5s

volumes:
  # open-webui: {}
  pipelines: {}
