---
x-nabla:
  nodes:
    - id: searxng
      name: SearXNG
      kind: search
      category: ai
      description: Optional metasearch backend consumed by Open WebUI web-search tooling.
    - id: open-terminal
      name: Open Terminal
      kind: tool-service
      category: ai
      description: Optional agent terminal API consumed by Open WebUI tools.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0 # latest or main
    container_name: open-webui
    restart: unless-stopped
    x-nabla:
      id: openwebui
      name: Open WebUI
      kind: application
      category: ai
      runtime:
        provider: truenas-app
        containerService: open-webui
      relations:
        - target: litellm
          type: consumesApi
          strength: required
          description: Open WebUI sends chat and RAG OpenAI-compatible requests through LiteLLM.
          evidence:
            - apps/openwebui/compose.yml:OPENAI_API_BASE_URL
            - apps/openwebui/compose.yml:RAG_OPENAI_API_BASE_URL
        - target: searxng
          type: consumesApi
          strength: optional
          description: Open WebUI can delegate web search to the SearXNG integration.
        - target: open-terminal
          type: consumesApi
          strength: optional
          description: Open WebUI agents can invoke the Open Terminal tool API.
    volumes:
      # - open-webui:/app/backend/data
      - /mnt/cpool/openwebui/data:/app/backend/data
      # - ./data:/app/backend/data/import:ro
    # depends_on:
    #   - ollama
    ports:
      - ${OPEN_WEBUI_PORT-31028}:8080
    environment:
      - TZ=Europe/Paris
      - DEFAULT_LOCALE=en-US
      - OPENAI_API_BASE_URL=http://172.17.0.24:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_OPENAI_API=true
      # To use litellm
      - ENABLE_OLLAMA_API=false
      - ENABLE_API_KEY=true
      - ENABLE_API_KEY_AUTH=true
      # qwen3.5:2b
      - DEFAULT_MODELS=qwen
      - DEFAULT_PINNED_MODELS=qwen
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME:-Nabla}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-alban.andrieu@free.fr}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-ChooseAVeryStrongPassword}
      - ENABLE_DIRECT_CONNECTIONS=false
      - ENABLE_SIGNUP=false
      - ENABLE_ADMIN_EXPORT=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_PERSISTENT_CONFIG=false
      - ENABLE_DIRECT_CONNECTIONS=false
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      # - RAG_EMBEDDING_ENGINE=sentence_transformers
      # - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_EMBEDDING_MODEL=embedding
      - RAG_OPENAI_API_BASE_URL=http://172.17.0.24:4000/v1
      - RAG_OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENV=dev
      - WEBUI_NAME=Nabla
      - CORS_ALLOW_ORIGIN=https://openwebui.albandrieu.com,https://fastapi-sample.fastapicloud.dev,https://www.albanandrieu.com
    extra_hosts:
      - host.docker.internal:host-gateway

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: unless-stopped
    x-nabla:
      id: openwebui-pipelines
      name: Open WebUI Pipelines
      kind: service
      category: ai
      runtime:
        provider: truenas-app
        containerService: pipelines
    volumes:
      - pipelines:/app/pipelines
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 9099:9099
    # depends_on:
    #   - langfuse-web

  # See https://github.com/open-webui/oikb
  # oikb:
  #   image: ghcr.io/open-webui/oikb:latest
  #   environment:
  #     - OPEN_WEBUI_URL=http://open-webui:8080
  #     - OPEN_WEBUI_API_KEY=${OPEN_WEBUI_API_KEY}
  #     - OIKB_API_KEY=${OIKB_API_KEY}
  #     - LOG_FORMAT=json
  #   volumes:
  #     - ./.oikb.yaml:/app/.oikb.yaml:ro
  #   command: daemon
  #   ports:
  #     - "8080:8080"
