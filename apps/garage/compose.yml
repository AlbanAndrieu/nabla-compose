---
x-nabla:
  nodes:
    - id: garage-admin
      name: Garage Admin
      kind: api
      category: data
      url: https://garage-admin.albandrieu.com
      internalUrl: http://172.17.0.24:3903
      presentationRole: support
      criticality: high
      description: Garage Admin API exposed through Cloudflare Tunnel to the LAN-bound :3903 origin without Traefik.
  relations:
    - source: garage-webui
      target: cloudflared
      type: exposedBy
      strength: required
      description: Cloudflare Tunnel forwards garage.albandrieu.com through cloudflared directly to the Garage WebUI :3909 origin.
      evidence:
        - docs/dns-ingress-ownership.md:Garage exposure boundary
    - source: garage-admin
      target: garage
      type: partOf
      strength: required
      description: Garage Admin :3903 is the administration API of the Garage object-storage service.
      evidence:
        - apps/garage/garage.toml:[admin] api_bind_addr=:3903
    - source: garage-admin
      target: cloudflared
      type: exposedBy
      strength: required
      description: Cloudflare Tunnel forwards garage-admin.albandrieu.com through cloudflared directly to Garage Admin :3903.
      evidence:
        - docs/dns-ingress-ownership.md:Garage exposure boundary

configs:
  garage_config:
    file: ./garage.toml

services:
  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    x-nabla:
      id: garage
      name: Garage S3
      kind: object-storage
      category: data
      url: https://s3.int.albandrieu.com
      description: S3-compatible object storage exposed directly through pfSense HAProxy, TLS re-encryption and Traefik on TrueNAS.
      runtime:
        provider: truenas-app
        containerService: garage
      relations:
        - target: traefik
          type: exposedBy
          strength: required
          description: Traefik routes the direct s3.int.albandrieu.com S3 ingress to Garage :3900 after pfSense HAProxy TLS re-encryption.
          evidence:
            - apps/garage/compose.yml:traefik.http.routers.garage-s3.rule
            - apps/garage/compose.yml:traefik.http.services.garage-s3.loadbalancer.server.port
    configs:
      - source: garage_config
        target: /etc/garage.toml
    env_file:
      - /mnt/cpool/garage/.env.secrets
    # environment:
    #  - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    #  - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - /mnt/cpool/garage/meta:/var/lib/garage/meta
      - /mnt/cpool/garage/data:/var/lib/garage/data
      - /mnt/cpool/garage/garage_admin_token:/run/secrets/garage_admin_token:ro
    ports:
      - "172.17.0.24:3900:3900" # S3 API, trusted LAN only
      - "172.17.0.24:3901:3901" # RPC Garage, trusted LAN only
      - "172.17.0.24:3903:3903" # Admin API, trusted LAN only
    networks: ["traefik_network"]
    labels:
      - "traefik.enable=true"
      # S3 API
      - "traefik.http.routers.garage-s3.rule=Host(`s3.int.albandrieu.com`) || HostRegexp(`{subdomain:.+}.s3.int.albandrieu.com`)"
      - "traefik.http.routers.garage-s3.entrypoints=websecure"
      - "traefik.http.routers.garage-s3.tls.certresolver=letsencrypt"
      - "traefik.http.routers.garage-s3.service=garage-s3"
      - "traefik.http.services.garage-s3.loadbalancer.server.scheme=http"
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"

  webui:
    container_name: garage-webui
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    x-nabla:
      id: garage-webui
      name: Garage
      kind: application
      category: data
      url: https://garage.albandrieu.com
      description: Garage web administration UI exposed by Cloudflare Tunnel directly to the LAN-bound :3909 origin without Traefik.
      runtime:
        provider: truenas-app
        containerService: webui
      relations:
        - target: garage
          type: consumesApi
          strength: required
          description: Garage WebUI uses the Garage Admin API and S3 API.
          evidence:
            - apps/garage/compose.yml:API_BASE_URL
            - apps/garage/compose.yml:S3_ENDPOINT_URL
    configs:
      - source: garage_config
        target: /etc/garage.toml
    ports:
      - "172.17.0.24:3909:3909" # WebUI, trusted LAN only
    volumes:
      - /mnt/cpool/garage/garage_admin_token:/run/secrets/garage_admin_token:ro
    environment:
      API_BASE_URL: "http://garage:3903"
      API_ADMIN_KEY: "${GARAGE_ADMIN_TOKEN}"
      S3_ENDPOINT_URL: "http://garage:3900"
      # AUTH_USER_PASS: "${GARAGE_WEBUI_ADMIN_PASS}"
    networks: ["traefik_network"]

networks:
  traefik_network:
    external: true
