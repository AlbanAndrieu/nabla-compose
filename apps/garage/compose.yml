---
name: garage
x-nabla:
  deploymentUnit:
    id: garage
    criticality: high
    stateful: true
    upgradePolicy: controlled
    probeOrder: [garage, garage-admin, garage-webui]
    probePolicy:
      rank: 0
  nodes:
    - id: garage-admin
      name: Garage Admin API
      kind: api
      category: data
      url: http://172.17.0.24:3903
      internalUrl: http://172.17.0.24:3903
      presentationRole: support
      criticality: high
      description: Garage Admin API on the LAN-bound :3903 origin only; its Cloudflare Tunnel route was removed on 04/11/2026.
  relations:
    - source: garage-webui
      target: cloudflared
      type: exposedBy
      strength: required
      description: Cloudflare Tunnel forwards garage.albandrieu.com through cloudflared directly to the Garage WebUI :3909 origin.
      evidence:
        - docs/dns-ingress-ownership.md:Garage exposure boundary
    - source: garage-admin
      target: garage
      type: partOf
      strength: required
      description: Garage Admin :3903 is the administration API of the Garage object-storage service.
      evidence:
        - apps/garage/garage.toml:[admin] api_bind_addr=:3903

configs:
  garage_config:
    file: ./garage.toml

services:
  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    x-nabla:
      id: garage
      name: Garage S3 API
      kind: object-storage
      category: data
      url: https://s3.int.albandrieu.com
      description: S3-compatible object storage for LAN clients only via internal DNS and Traefik on TrueNAS. Deny the S3 hostname on public pfSense HAProxy; Garage WebUI is a separate public Tunnel hostname.
      runtime:
        provider: truenas-app
        containerService: garage
      relations:
        - target: traefik
          type: exposedBy
          strength: required
          description: Traefik serves the LAN-only s3.int.albandrieu.com S3 ingress to Garage :3900. External HAProxy must deny this Host; do not publish the S3 API on WAN.
          evidence:
            - apps/garage/compose.yml:traefik.http.routers.garage-s3.rule
            - apps/garage/compose.yml:traefik.http.services.garage-s3.loadbalancer.server.port
      exposure:
        - name: lan
          hostnames:
            - s3.int.albandrieu.com
          protocol: HTTPS
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: s3
          riskAcceptance:
            id: garage-s3-internal-only
            status: rejected
            reason: "Garage S3 s3.int.albandrieu.com is internal-only; public DNS and WAN HAProxy/NAT routes are unauthorized. Verify OpenTofu state backend connectivity before the infrastructure-side cutover."
            control: lan-only-no-public-dns
            reviewAfter: null
        - name: lan
          entityRef: component:default/garage-admin
          hostnames:
            - garage-admin.albandrieu.com
          protocol: HTTPS
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: admin
          riskAcceptance:
            id: garage-admin-lan-only
            status: rejected
            reason: "No WAN or Cloudflare Tunnel exposure approved for Garage Admin API."
            control: lan-or-vpn-only
            reviewAfter: null
    configs:
      - source: garage_config
        target: /etc/garage.toml
    env_file:
      - /mnt/cpool/garage/.env.secrets
    # environment:
    #  - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
    #  - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - /mnt/cpool/garage/meta:/var/lib/garage/meta
      - /mnt/cpool/garage/data:/var/lib/garage/data
      - /mnt/cpool/garage/garage_admin_token:/run/secrets/garage_admin_token:ro
    ports:
      - name: s3
        target: 3900
        published: "3900"
        host_ip: 172.17.0.24
        protocol: tcp
      - name: rpc
        target: 3901
        published: "3901"
        host_ip: 172.17.0.24
        protocol: tcp
      - name: admin
        target: 3903
        published: "3903"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    networks: ["traefik_network"]
    labels:
      - "com.albandrieu.nabla.entity-ref=component:default/garage"
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      # S3 API
      - "traefik.http.routers.garage-s3.rule=Host(`s3.int.albandrieu.com`) || HostRegexp(`{subdomain:.+}.s3.int.albandrieu.com`)"
      - "traefik.http.routers.garage-s3.entrypoints=websecure"
      - "traefik.http.routers.garage-s3.tls.certresolver=letsencrypt"
      - "traefik.http.routers.garage-s3.service=garage-s3"
      - "traefik.http.services.garage-s3.loadbalancer.server.scheme=http"
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"

  webui:
    container_name: garage-webui
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    x-nabla:
      id: garage-webui
      name: Garage Web UI
      kind: application
      category: data
      url: https://garage.albandrieu.com
      description: Garage web administration UI exposed by Cloudflare Tunnel directly to the LAN-bound :3909 origin without Traefik.
      runtime:
        provider: truenas-app
        containerService: webui
      relations:
        - target: garage
          type: consumesApi
          strength: required
          description: Garage WebUI uses the Garage Admin API and S3 API.
          evidence:
            - apps/garage/compose.yml:API_BASE_URL
            - apps/garage/compose.yml:S3_ENDPOINT_URL
      exposure:
        - name: public
          hostnames:
            - garage.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
    configs:
      - source: garage_config
        target: /etc/garage.toml
    ports:
      - name: web
        target: 3909
        published: "3909"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/garage/garage_admin_token:/run/secrets/garage_admin_token:ro
    environment:
      API_BASE_URL: "http://garage:3903"
      API_ADMIN_KEY: "${GARAGE_ADMIN_TOKEN}"
      S3_ENDPOINT_URL: "http://garage:3900"
      # AUTH_USER_PASS: "${GARAGE_WEBUI_ADMIN_PASS}"
    networks: ["traefik_network"]
    labels:
      - "com.albandrieu.nabla.entity-ref=component:default/garage-webui"
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  traefik_network:
    external: true
