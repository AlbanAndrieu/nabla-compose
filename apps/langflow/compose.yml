services:
  langflow:
    image: docker.io/langflowai/openrag-langflow:latest
    container_name: langflow
    x-nabla:
      id: langflow
      name: Langflow
      kind: workflow
      category: ai
      runtime:
        provider: truenas-app
        containerService: langflow
      relations:
        - target: elasticsearch
          type: dependsOn
          strength: required
          description: The OpenRAG Langflow runtime accesses Elasticsearch.
          evidence:
            - apps/langflow/compose.yml:ES_HOST
    ports:
      - "7860:7860"
    volumes:
      - ./flows:/app/flows:U,z
      - ./langflow-data:/app/langflow-data:U,z
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASS=${ELASTIC_PASSWORD:-changeme}
      - LANGFLOW_DEACTIVATE_TRACING=
      # Add more envs from the openrag compose as needed
    networks:
      - traefik_network
    restart: unless-stopped

networks:
  traefik_network:
    external: true
