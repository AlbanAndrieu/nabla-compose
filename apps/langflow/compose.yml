---
services:
  langflow:
    # Shared global Langflow runtime for OpenRAG; this is not a private
    # openrag-langflow service. Pin the OpenRAG-compatible Langflow image to the
    # same release as the OpenRAG backend/frontend.
    image: docker.io/langflowai/openrag-langflow:${OPENRAG_VERSION:-0.7.1}
    container_name: langflow
    x-nabla:
      id: langflow
      name: Langflow
      kind: workflow
      category: ai
      runtime:
        provider: truenas-app
        containerService: langflow
      relations:
        - target: opensearch
          type: dependsOn
          strength: required
          description: The OpenRAG Langflow runtime accesses the shared OpenSearch service.
          evidence:
            - apps/langflow/compose.yml:OPENSEARCH_HOST
    env_file:
      - /mnt/cpool/langflow/.env.secrets
    ports:
      - "7860:7860"
    volumes:
      # Do not bind an unversioned/empty ./flows directory over /app/flows:
      # the pinned OpenRAG Langflow image already contains the compatible flow
      # definitions and custom components.
      - ./langflow-data:/app/langflow-data:U,z
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-admin}"
      OPENSEARCH_URL: https://opensearch:9200
      LANGFLOW_DEACTIVATE_TRACING: "true"
      DO_NOT_TRACK: "true"
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-langflow}
      LANGFLOW_NEW_USER_IS_ACTIVE: "false"
      LANGFLOW_CONFIG_DIR: /app/langflow-data
      LANGFLOW_DATABASE_URL: sqlite:////app/langflow-data/langflow.db?timeout=60
      LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:7860/health_check', timeout=5).read()
      # /health_check is readiness (DB + chat/cache), not mere process liveness.
      # Probe often so TrueNAS can leave DEPLOYING quickly once ready, while
      # allowing first-start SQLite/schema initialization extra grace.
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 180s
    networks:
      intranet:
        aliases:
          - langflow
      traefik_network: {}
    restart: unless-stopped

networks:
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
