---
name: drawio

services:
  drawio:
    image: jgraph/drawio
    container_name: drawio
    x-nabla:
      id: drawio
      name: Draw.io
      kind: diagramming
      category: productivity
      presentationRole: service
      criticality: low
      description: Self-hosted diagrams.net editor.
      runtime:
        provider: truenas-app
        containerService: drawio
      monitoring:
        type: port
        host: 172.17.0.24
        port: 9080
    labels:
      com.albandrieu.nabla.entity-ref: component:default/drawio
    restart: unless-stopped
    ports:
      - name: web
        target: 8080
        published: "9080"
        protocol: tcp
        app_protocol: http
      # - 30425:8443 # NOK with cloudflared
    environment:
      - PUBLIC_DNS=${PUBLIC_DNS:-drawio.albandrieu.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.drawio.rule=Host(`drawio.albandrieu.com`)"
    #   - "traefik.http.routers.drawio.entrypoints=websecure"
    #   - "traefik.http.routers.drawio.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.drawio.service=drawio"
    #   - "traefik.http.services.drawio.loadbalancer.server.scheme=http"
    #   # - "traefik.http.services.drawio.loadbalancer.server.port=30425"
