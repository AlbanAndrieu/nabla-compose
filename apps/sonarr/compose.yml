---
# Sonarr of the *arr media stack (status planned).
# Design and acceptance: docs/arr-media-library-roadmap.md
name: sonarr

services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:4.0.20@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    container_name: sonarr
    restart: unless-stopped
    x-nabla:
      id: sonarr
      name: Sonarr
      kind: media-manager
      category: media
      status: planned
      presentationRole: service
      criticality: low
      description: >-
        TV series library manager; imports with hardlinks into /data/library/tv.
      url: https://sonarr.int.albandrieu.com
      internalUrl: http://sonarr:8989
      runtime:
        provider: truenas-app
        containerService: sonarr
      lifecycle:
        phase: applications
        priority: 74
      monitoring:
        type: http
        target: http://172.17.0.24:30113/ping
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: qbittorrent
          type: consumesApi
          strength: required
          description: Sonarr sends releases to qBittorrent through gluetun:8080.
          evidence:
            - docs/arr-media-library-roadmap.md:P4 download client gluetun:8080
        - target: prowlarr
          type: consumesApi
          strength: optional
          description: Sonarr searches indexers synchronized by Prowlarr.
          evidence:
            - docs/arr-media-library-roadmap.md:P3 Full Sync
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik exposes the UI only through sonarr.int.albandrieu.com.
          evidence:
            - apps/sonarr/compose.yml:traefik.http.routers.sonarr
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web
    security_opt:
      - no-new-privileges:true
    env_file:
      # SONARR__AUTH__APIKEY from Vaultwarden item nabla/prod/sonarr; never committed.
      - /mnt/cpool/secrets/runtime/sonarr/.env.secrets
    environment:
      PUID: "568"
      PGID: "568"
      UMASK: "002"
      TZ: Europe/Paris
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: Enabled
      SONARR__LOG__ANALYTICSENABLED: "False"
    ports:
      - name: web
        target: 8989
        published: "30113"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/sonarr/config:/config
      - /mnt/cpool/media:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:8989/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.albandrieu.nabla.entity-ref: component:default/sonarr
      com.albandrieu.nabla.logs: media
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.sonarr.rule: Host(`sonarr.int.albandrieu.com`)
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls.certresolver: letsencrypt
      traefik.http.routers.sonarr.service: sonarr
      traefik.http.services.sonarr.loadbalancer.server.port: "8989"
    networks:
      - media
      - traefik_network

  sonarr-exporter:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: sonarr-exporter
    restart: unless-stopped
    command:
      - sonarr
    x-nabla:
      id: sonarr-exporter
      name: Sonarr exporter
      kind: metrics-exporter
      category: observability
      status: planned
      presentationRole: support
      criticality: low
      description: >-
        Exportarr metrics for Sonarr (library, queue, health issues) scraped
        by Prometheus over the intranet network.
      runtime:
        provider: truenas-app
        containerService: sonarr-exporter
      lifecycle:
        phase: applications
        priority: 90
      relations:
        - target: sonarr
          type: consumesApi
          strength: required
          description: The exporter reads the Sonarr API with the instance API key.
          evidence:
            - apps/sonarr/compose.yml:URL=http://sonarr:8989
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes sonarr-exporter:9707 (job exportarr_sonarr).
          evidence:
            - apps/prometheus/prometheus.yml:job_name=exportarr_sonarr
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      # API_KEY: same Vaultwarden field as the Sonarr instance key.
      - /mnt/cpool/secrets/runtime/sonarr/.env.secrets
    environment:
      PORT: "9707"
      URL: http://sonarr:8989
      LOG_LEVEL: info
    labels:
      com.albandrieu.nabla.entity-ref: component:default/sonarr-exporter
      com.albandrieu.nabla.logs: media
      com.albandrieu.nabla.healthcheck: prometheus-up
    networks:
      - media
      - intranet

networks:
  media:
    external: true
    name: media
  traefik_network:
    external: true
    name: traefik_network
  intranet:
    external: true
    name: intranet
