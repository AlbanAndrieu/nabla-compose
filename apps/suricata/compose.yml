---
services:
  suricata:
    image: jasonish/suricata:8.0.6
    container_name: suricata
    restart: unless-stopped
    x-nabla:
      id: suricata
      name: Suricata
      kind: ids
      category: security
      securityFunctions:
        - detect
      runtime:
        provider: truenas-app
        containerService: suricata
      lifecycle:
        phase: platform-services
        priority: 40
      relations:
        - target: crowdsec
          type: observedBy
          strength: optional
          description: CrowdSec consumes Suricata event logs for behavioral decisions.
          evidence:
            - apps/crowdsec/acquis.d/security.yaml
        - target: alloy
          type: observedBy
          strength: optional
          description: Grafana Alloy tails Suricata JSON logs for Loki ingestion.
          evidence:
            - apps/grafana/config/alloy.alloy:loki.source.file
    entrypoint:
      - /usr/local/bin/nabla-suricata-entrypoint.sh
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      ENABLE_CRON: "yes"
      PGID: ${PGID:-568}
      PUID: ${PUID:-568}
      # TrueNAS exposes the LAN through br0. With host networking Suricata sees
      # the host interfaces, so eth0 is not a safe default on this appliance.
      SURICATA_OPTIONS: -i ${SURICATA_INTERFACE:-br0}
      TZ: ${TZ:-Europe/Paris}
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /var/lib/suricata/rules/suricata.rules && kill -0 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    volumes:
      - ./entrypoint.sh:/usr/local/bin/nabla-suricata-entrypoint.sh:ro
      - /mnt/cpool/suricata/etc:/etc/suricata
      - /mnt/cpool/suricata/log:/var/log/suricata
      - /mnt/cpool/suricata/lib:/var/lib/suricata
