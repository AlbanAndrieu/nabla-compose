# Runtime secrets are injected from /mnt/cpool/langfuse/.env.secrets.
# DATABASE_URL uses the dedicated PostgreSQL `langfuse` identity and `langfuse` database.
# Langfuse v4 uses the shared PostgreSQL, Redis, MinIO and ClickHouse services
# over the private intranet network.
x-nabla:
  nodes:
    - id: langfuse
      name: Langfuse
      kind: observability
      category: ai
      description: Logical Langfuse v4 observability platform composed of web and worker workloads.

services:
  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:4.30.0
    restart: always
    depends_on:
      langfuse-web:
        condition: service_healthy
    env_file:
      - /mnt/cpool/langfuse/.env.secrets
    x-nabla:
      id: langfuse-worker
      name: Langfuse Worker
      kind: worker
      category: ai
      runtime:
        provider: truenas-app
        containerService: langfuse-worker
      relations:
        - target: langfuse
          type: partOf
          strength: required
          description: The worker is a runtime workload of the logical Langfuse platform.
        - target: postgresql
          type: dependsOn
          strength: required
          description: Langfuse Worker stores transactional application data in PostgreSQL.
          evidence:
            - apps/langfuse/compose.yml:DATABASE_URL
        - target: clickhouse
          type: dependsOn
          strength: required
          description: Langfuse Worker stores analytical event data in ClickHouse.
          evidence:
            - apps/langfuse/compose.yml:CLICKHOUSE_URL
        - target: minio
          type: storesIn
          strength: required
          description: Langfuse Worker uses S3-compatible object storage for event, media and export data.
          evidence:
            - apps/langfuse/compose.yml:LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
            - apps/langfuse/compose.yml:LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
        - target: redis
          type: dependsOn
          strength: required
          description: Langfuse Worker uses Redis for queues and asynchronous processing.
          evidence:
            - apps/langfuse/compose.yml:REDIS_HOST
    ports:
      - "127.0.0.1:3030:3030"
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3030/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://langfuse.albandrieu.com}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      LANGFUSE_USE_AZURE_BLOB: ${LANGFUSE_USE_AZURE_BLOB:-false}
      LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: ${LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE:-false}
      LANGFUSE_OCI_AUTH_TYPE: ${LANGFUSE_OCI_AUTH_TYPE:-workload_identity}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse-v4}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse-v4}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION:-auto}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE:-true}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX:-media/}
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED:-false}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BATCH_EXPORT_BUCKET:-langfuse-v4}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: ${LANGFUSE_S3_BATCH_EXPORT_PREFIX:-exports/}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_BATCH_EXPORT_REGION:-auto}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT:-http://minio:9000}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT:-http://172.17.0.24:9002}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: ${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-langfuse-v4:}
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: ${LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK:-false}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
    networks:
      - intranet

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:4.30.0
    restart: always
    env_file:
      - /mnt/cpool/langfuse/.env.secrets
    x-nabla:
      id: langfuse-web
      name: Langfuse Web
      kind: application
      category: ai
      runtime:
        provider: truenas-app
        containerService: langfuse-web
      relations:
        - target: langfuse
          type: partOf
          strength: required
          description: The web application is a runtime workload of the logical Langfuse platform.
        - target: postgresql
          type: dependsOn
          strength: required
          description: Langfuse Web stores transactional application data in PostgreSQL.
          evidence:
            - apps/langfuse/compose.yml:DATABASE_URL
        - target: clickhouse
          type: dependsOn
          strength: required
          description: Langfuse Web reads and writes analytical event data in ClickHouse.
          evidence:
            - apps/langfuse/compose.yml:CLICKHOUSE_URL
        - target: minio
          type: storesIn
          strength: required
          description: Langfuse Web uses S3-compatible object storage for media and exports.
          evidence:
            - apps/langfuse/compose.yml:LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
        - target: redis
          type: dependsOn
          strength: required
          description: Langfuse Web uses Redis-backed queues and shared asynchronous state.
          evidence:
            - apps/langfuse/compose.yml:REDIS_HOST
    ports:
      - "172.17.0.24:3000:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    environment:
      <<: *langfuse-worker-env
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://172.17.0.24:9002}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT:-http://minio:9000}
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
