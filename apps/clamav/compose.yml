---
name: clamav
services:
  clamav:
    image: clamav/clamav:1.5.4@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a
    # No container_name: the TrueNAS cron jobs (ansible-workstation truenas-stabilize.yml) exec into ix-clamav-clamav-1.
    x-nabla:
      id: clamav
      name: ClamAV
      kind: antivirus-engine
      category: security
      presentationRole: support
      criticality: high
      securityFunctions: [protect, detect]
      url: https://clamav.albandrieu.com
      internalUrl: https://clamav.int.albandrieu.com
      description: clamd scans the TrueNAS datasets through the clamav-scan cron jobs; TCP/3310 on port 30005.
      runtime:
        provider: truenas-app
        containerService: clamav
      monitoring:
        type: port
        host: 172.17.0.24
        port: 30005
      exposure:
        - name: lan
          hostnames:
            - clamav.albandrieu.com
          protocol: TCP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: clamd
    restart: unless-stopped
    # Same limits and capabilities as the catalog App it replaces.
    mem_limit: 2g
    cpus: 1
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    labels:
      com.albandrieu.nabla.entity-ref: component:default/clamav
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - name: clamd
        target: 3310
        host_ip: 172.17.0.24
        published: "30005"
        protocol: tcp
    environment:
      - CLAMAV_NO_MILTERD=true
      - CLAMD_STARTUP_TIMEOUT=1800
      # A concurrent reload doubles signature memory: clamd was OOM-killed at the 2 GiB limit on 13/11.
      - CLAMD_CONF_ConcurrentDatabaseReload=no
      - FRESHCLAMD_CHECKS=1
      - TZ=Etc/UTC
    volumes:
      - /mnt/cpool/clamav:/var/lib/clamav
      - /mnt/cpool/logs:/mnt/logs
      # Read-only, and rslave so a dataset unmounted on the host leaves the container too:
      # the catalog App's private mount kept every dataset busy and blocked zfs destroy.
      - type: bind
        source: /mnt/cpool
        target: /scandir
        read_only: true
        bind:
          propagation: rslave
