---
services:
  keycloak:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/keycloak
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    x-nabla:
      id: keycloak
      name: Keycloak
      kind: identity-provider
      category: security
      presentationRole: core
      criticality: critical
      description: Central OIDC/SAML identity provider backed by the shared PostgreSQL service.
      runtime:
        provider: truenas-app
        appId: keycloak
        containerService: keycloak
      monitoring:
        type: http
        target: http://172.17.0.24:30239/health/ready
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: Keycloak stores realm, client and identity state in the shared PostgreSQL service.
          evidence:
            - apps/keycloak/compose.yml:KC_DB_URL
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes Keycloak metrics from the private management interface.
          evidence:
            - apps/keycloak/compose.yml:KC_METRICS_ENABLED
    restart: unless-stopped
    # JVM memory cap (2026-11-06): Quarkus sizes its heap at 70% of the cgroup limit; without a limit it used host RAM; an OOM stays in this cgroup.
    mem_limit: 1536m
    command: ["start"]
    env_file:
      - /mnt/cpool/keycloak/.env.secrets
    # Public CA certificate, no private key. Fail closed until the PostgreSQL PKI is provisioned.
    volumes:
      - /mnt/cpool/secrets/runtime/postgres/tls/ca.crt:/etc/nabla/pki/postgres-ca.crt:ro
    environment:
      KC_DB: postgres
      # Override KEYCLOAK_DB_HOST for DNS SAN; default IP requires a matching IP SAN.
      KC_DB_URL: jdbc:postgresql://${KEYCLOAK_DB_HOST:-172.17.0.24}:5432/keycloak
      KC_DB_TLS_MODE: verify-server
      KC_DB_TLS_TRUST_STORE_FILE: /etc/nabla/pki/postgres-ca.crt
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: https://keycloak.albandrieu.com
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
    ports:
      - "172.17.0.24:30238:8080"
      - "172.17.0.24:30239:9000"
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
