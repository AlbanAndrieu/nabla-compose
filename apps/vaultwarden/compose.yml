---
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    user: "568:568" # TrueNAS apps user
    environment:
      DOMAIN: "https://vaultwarden.albandrieu.com"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN}"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURITY: "starttls"
      SMTP_FROM: "alban.andrieu@gmail.com"
      SMTP_FROM_NAME: "Vaultwarden Alban Andrieu"
      SMTP_USERNAME: "${VAULTWARDEN_SMTP_USERNAME}"
      SMTP_PASSWORD: "${VAULTWARDEN_SMTP_PASSWORD}"
      HELO_NAME: "vaultwarden.albandrieu.com"
      IP_HEADER: "X-Forwarded-For"
    volumes:
      - /mnt/cpool/vaultwarden/vw-data/:/data/
    ports:
      - 30032:80
    networks:
      - default
      - traefik_network
      - secrets-backend

  # Optional Doco-CD Vault Management API bridge. Human/operator access uses
  # the official Bitwarden Password Manager CLI (`bw`) against Vaultwarden.
  # These BW_* values are bootstrap secrets and must remain outside Git.
  bitwarden-api:
    image: ghcr.io/kimdre/bitwarden-rest-api-server:latest
    container_name: bitwarden-api
    restart: unless-stopped
    init: true
    user: "568:568" # TrueNAS apps user
    environment:
      BW_HOST: "https://vaultwarden.albandrieu.com"
      BW_CLIENTID: "${BW_CLIENTID}"
      BW_CLIENTSECRET: "${BW_CLIENTSECRET}"
      BW_PASSWORD: "${BW_PASSWORD}"
    volumes:
      - /mnt/cpool/vaultwarden/bw-data/:/data/
    ports:
      - 8087
    depends_on:
      - vaultwarden
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - default
      - secrets-backend

networks:
  secrets-backend:
    external: true
  traefik_network:
    external: true
