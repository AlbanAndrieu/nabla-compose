---
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    user: "568:568" # TrueNAS apps user
    environment:
      DOMAIN: "https://vaultwarden.albandrieu.com"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      # Bootstrap secrets: keep outside Git until the long-term machine-secret
      # bootstrap is available.
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN}"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_SECURITY: "starttls"

      SMTP_FROM: "alban.andrieu@gmail.com"
      SMTP_FROM_NAME: "Vaultwarden Alban Andrieu"

      SMTP_USERNAME: "${VAULTWARDEN_SMTP_USERNAME}"
      SMTP_PASSWORD: "${VAULTWARDEN_SMTP_PASSWORD}"

      HELO_NAME: "vaultwarden.albandrieu.com"
      IP_HEADER: "X-Forwarded-For"
    volumes:
      - /mnt/cpool/vaultwarden/vw-data/:/data/
    ports:
      - 30032:80
    # labels:
    #  - "traefik.enable=true"
    #  - "traefik.http.routers.vaultwarden.rule=Host(`vaultwarden.albandrieu.com`) || Host(`vaultwarden.int.albandrieu.com`)"
    #  - "traefik.http.routers.vaultwarden.entrypoints=websecure"
    #  - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
    #  - "traefik.http.routers.vaultwarden.service=vaultwarden"
    #  - "traefik.http.services.vaultwarden.loadbalancer.server.scheme=http"
    #  - "traefik.http.middlewares.security.headers.customResponseHeaders.Referrer-Policy=same-origin"
    networks:
      - default
      - traefik_network
      - secrets-backend

  # Legacy Doco-CD compatibility adapter. Do not add new consumers here.
  # New Compose migrations use the official `bw` CLI renderer documented in
  # config/secrets/README.md. Remove this service only after Doco-CD no longer
  # depends on its Vault Management API compatibility endpoint.
  # BW_CLIENTID/BW_CLIENTSECRET/BW_PASSWORD are bootstrap secrets and cannot be
  # fetched from the same Vaultwarden session they are required to unlock.
  bitwarden-api:
    image: ghcr.io/kimdre/bitwarden-rest-api-server:latest
    container_name: bitwarden-api
    restart: unless-stopped
    init: true
    user: "568:568" # TrueNAS apps user
    environment:
      BW_HOST: "https://vaultwarden.albandrieu.com"
      BW_CLIENTID: "${BW_CLIENTID}"
      BW_CLIENTSECRET: "${BW_CLIENTSECRET}"
      BW_PASSWORD: "${BW_PASSWORD}"
    volumes:
      - /mnt/cpool/vaultwarden/bw-data/:/data/
    expose:
      - "8087"
    depends_on:
      - vaultwarden
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - default
      - secrets-backend

networks:
  secrets-backend:
    external: true
  traefik_network:
    external: true
