---
x-nabla:
  nodes:
    - id: pfsense
      name: pfSense
      kind: firewall
      category: network
      presentationRole: core
      description: External pfSense firewall running the lightweight CrowdSec remediation component.

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    restart: unless-stopped
    x-nabla:
      id: crowdsec
      name: CrowdSec
      kind: security-agent
      category: security
      runtime:
        provider: truenas-app
        containerService: crowdsec
      relations:
        - target: pfsense
          type: providesApi
          strength: required
          description: CrowdSec provides the central LAPI consumed by the pfSense firewall bouncer in Small/remediation-only mode.
          evidence:
            - apps/crowdsec/compose.yml:CROWDSEC_LAPI_PORT
            - apps/crowdsec/compose.yml:CROWDSEC_PFSENSE_BOUNCER_KEY
        - target: suricata
          type: dependsOn
          strength: optional
          description: CrowdSec can enrich decisions from Suricata event logs.
          evidence:
            - apps/crowdsec/compose.yml:SURICATA_LOG_DIR
            - apps/crowdsec/acquis.d/security.yaml
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes CrowdSec metrics.
          evidence:
            - apps/crowdsec/compose.yml:CROWDSEC_METRICS_PORT
            - apps/prometheus/prometheus.yml:job_name=crowdsec
    environment:
      BOUNCER_KEY_pfsense_firewall: ${CROWDSEC_PFSENSE_BOUNCER_KEY}
      COLLECTIONS: crowdsecurity/pfsense crowdsecurity/suricata
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "${CROWDSEC_LAPI_BIND_ADDRESS:-172.17.0.24}:${CROWDSEC_LAPI_PORT:-8080}:8080"
      - "${CROWDSEC_METRICS_PORT:-6060}:6060"
    volumes:
      - crowdsec_config:/etc/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - ./acquis.d:/etc/crowdsec/acquis.d:ro
      - ./config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - type: bind
        source: ${PFSENSE_LOG_DIR:-/mnt/cpool/logs/pfsense}
        target: /logs/pfsense
        read_only: true
      - type: bind
        source: ${SURICATA_LOG_DIR:-/mnt/cpool/suricata/log}
        target: /logs/suricata
        read_only: true

volumes:
  crowdsec_config:
  crowdsec_data:
