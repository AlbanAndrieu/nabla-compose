user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  reset_timedout_connection on;
  keepalive_timeout 75s;
  gzip off;
  server_tokens off;
  client_max_body_size 100m;

  proxy_http_version 1.1;
  proxy_redirect off;
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 90s;
  proxy_send_timeout 5s;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }
  proxy_set_header X-Forwarded-Proto $forwarded_proto;

  upstream relay_upstream {
    server relay:3000;
    keepalive 2;
  }

  upstream sentry_upstream {
    server sentry-web:9000;
    keepalive 2;
  }

  server {
    listen 80;

    location /api/store/ {
      proxy_pass http://relay_upstream;
    }

    location ~ ^/api/[1-9]\d*/ {
      proxy_pass http://relay_upstream;
    }

    location ^~ /api/0/relays/ {
      proxy_pass http://relay_upstream;
    }

    location / {
      proxy_pass http://sentry_upstream;
    }

    location /_assets/ {
      proxy_pass http://sentry_upstream/_static/dist/sentry/;
      proxy_hide_header Content-Disposition;
    }

    location /_static/ {
      proxy_pass http://sentry_upstream;
      proxy_hide_header Content-Disposition;
    }
  }
}
