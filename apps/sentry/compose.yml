---
x-sentry-env: &sentry-env
  COMPOSE_PROFILES: errors-only
  SENTRY_CONF: /etc/sentry
  SENTRY_SYSTEM_URL_PREFIX: https://sentry.albandrieu.com
  SENTRY_EVENT_RETENTION_DAYS: "90"
  SENTRY_POSTGRES_HOST: 172.17.0.24
  SENTRY_POSTGRES_PORT: "5432"
  SENTRY_DB_USER: sentry
  SENTRY_DB_NAME: sentry
  SENTRY_REDIS_HOST: redis
  SENTRY_REDIS_PORT: "6379"
  SENTRY_REDIS_DB: "3"
  SENTRY_MEMCACHED_HOST: memcached
  SENTRY_MEMCACHED_PORT: "11211"
  SNUBA: http://snuba-api:1218
  SENTRY_KAFKA_MAX_POLL_INTERVAL_MS: "300000"

x-snuba-env: &snuba-env
  SNUBA_SETTINGS: self_hosted
  CLICKHOUSE_HOST: sentry-clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_USER: sentry
  CLICKHOUSE_DATABASE: sentry
  CLICKHOUSE_READONLY_USER: sentry
  CLICKHOUSE_TRACE_USER: sentry
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "3"
  DEFAULT_BROKERS: kafka:9092
  SENTRY_EVENT_RETENTION_DAYS: "90"
  SENTRY_KAFKA_MAX_POLL_INTERVAL_MS: "300000"

x-sentry-service: &sentry-service
  image: ghcr.io/getsentry/sentry:26.8.0
  restart: unless-stopped
  env_file:
    - /mnt/cpool/sentry/.env.secrets
  environment:
    <<: *sentry-env
  volumes:
    - /mnt/cpool/sentry/data:/data
    - ./config/sentry.conf.py:/etc/sentry/sentry.conf.py:ro
    - ./config/config.yml:/etc/sentry/config.yml:ro
  networks:
    - sentry
    - intranet

x-snuba-service: &snuba-service
  image: ghcr.io/getsentry/snuba:26.8.0
  restart: unless-stopped
  env_file:
    - /mnt/cpool/sentry/.env.secrets
  environment:
    <<: *snuba-env
  networks:
    - sentry
    - intranet

x-consumer-health: &consumer-health
  test:
    - CMD
    - python3
    - -c
    - >-
      import os,sys;
      p="/tmp/health.txt";
      os.path.exists(p) and os.remove(p) is None or sys.exit(1)
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 600s

services:
  memcached:
    image: memcached:1.6.45-alpine
    restart: unless-stopped
    command: ["-I", "1M"]
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    networks:
      - sentry

  snuba-migrate:
    <<: *snuba-service
    restart: "no"
    env_file:
      - /mnt/cpool/sentry/.env.secrets
      - /mnt/cpool/sentry/.env.migrator.secrets
    environment:
      <<: *snuba-env
      CLICKHOUSE_USER: sentry_migrator
      CLICKHOUSE_READONLY_USER: sentry_migrator
      CLICKHOUSE_TRACE_USER: sentry_migrator
    command: ["bootstrap", "--force"]

  snuba-api:
    <<: *snuba-service
    x-nabla:
      id: sentry-snuba-api
      name: Sentry Snuba API
      kind: analytics-api
      category: observability
      presentationRole: support
      criticality: high
      description: Sentry query API backed by the dedicated temporary Sentry ClickHouse.
      runtime:
        provider: truenas-app
        containerService: snuba-api
      relations:
        - target: sentry-clickhouse
          type: dependsOn
          strength: required
          description: Snuba reads and writes Sentry analytical state in ClickHouse.
          evidence:
            - apps/sentry/compose.yml:CLICKHOUSE_HOST=sentry-clickhouse
        - target: kafka
          type: dependsOn
          strength: required
          description: Snuba consumes Sentry event streams from shared Kafka.
          evidence:
            - apps/sentry/compose.yml:DEFAULT_BROKERS=kafka:9092
        - target: redis
          type: dependsOn
          strength: required
          description: Snuba uses the shared Redis service for runtime state.
          evidence:
            - apps/sentry/compose.yml:REDIS_HOST=redis
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          body=urllib.request.urlopen("http://127.0.0.1:1218/health",timeout=3).read().decode();
          raise SystemExit(0 if "ok" in body else 1)
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  snuba-errors-consumer:
    <<: *snuba-service
    command:
      - rust-consumer
      - --storage
      - errors
      - --consumer-group
      - snuba-consumers
      - --auto-offset-reset=latest
      - --max-batch-time-ms
      - "750"
      - --no-strict-offset-reset
      - --health-check-file
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  snuba-outcomes-consumer:
    <<: *snuba-service
    command:
      - rust-consumer
      - --storage
      - outcomes_raw
      - --consumer-group
      - snuba-consumers
      - --auto-offset-reset=earliest
      - --max-batch-time-ms
      - "750"
      - --no-strict-offset-reset
      - --health-check-file
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  snuba-outcomes-billing-consumer:
    <<: *snuba-service
    command:
      - rust-consumer
      - --storage
      - outcomes_raw
      - --consumer-group
      - snuba-consumers
      - --auto-offset-reset=earliest
      - --max-batch-time-ms
      - "750"
      - --no-strict-offset-reset
      - --raw-events-topic
      - outcomes-billing
      - --health-check-file
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  snuba-group-attributes-consumer:
    <<: *snuba-service
    command:
      - rust-consumer
      - --storage
      - group_attributes
      - --consumer-group
      - snuba-group-attributes-consumers
      - --auto-offset-reset=latest
      - --max-batch-time-ms
      - "750"
      - --no-strict-offset-reset
      - --health-check-file
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  snuba-replacer:
    <<: *snuba-service
    command:
      - replacer
      - --storage
      - errors
      - --auto-offset-reset=latest
      - --no-strict-offset-reset
      - --health-check-file
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  snuba-subscription-consumer-events:
    <<: *snuba-service
    command:
      - subscriptions-scheduler-executor
      - --dataset
      - events
      - --entity
      - events
      - --auto-offset-reset=latest
      - --no-strict-offset-reset
      - --consumer-group=snuba-events-subscriptions-consumers
      - --followed-consumer-group=snuba-consumers
      - --schedule-ttl=60
      - --stale-threshold-seconds=900
      - --health-check-file
      - /tmp/health.txt
    depends_on:
      snuba-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  sentry-migrate:
    <<: *sentry-service
    restart: "no"
    command: ["upgrade", "--noinput", "--create-kafka-topics"]
    depends_on:
      memcached:
        condition: service_healthy
      snuba-api:
        condition: service_healthy

  sentry-web:
    <<: *sentry-service
    x-nabla:
      id: sentry
      name: Sentry
      kind: error-tracking
      category: observability
      presentationRole: service
      criticality: high
      url: https://sentry.albandrieu.com
      description: Self-hosted Sentry 26.8 errors-only application service.
      runtime:
        provider: truenas-app
        containerService: sentry-web
      monitoring:
        type: http
        target: http://172.17.0.24:9005/_health/
      relations:
        - target: sentry-snuba-api
          type: dependsOn
          strength: required
          description: Sentry queries event data through Snuba.
          evidence:
            - apps/sentry/compose.yml:SNUBA=http://snuba-api:1218
        - target: redis
          type: dependsOn
          strength: required
          description: Sentry uses the shared Redis database 3.
          evidence:
            - apps/sentry/compose.yml:SENTRY_REDIS_HOST=redis
        - target: kafka
          type: dependsOn
          strength: required
          description: Sentry publishes and consumes event streams through shared Kafka.
          evidence:
            - apps/sentry/compose.yml:SENTRY_EVENTSTREAM
        - target: postgresql
          type: dependsOn
          strength: required
          description: Sentry application metadata is stored in the dedicated sentry PostgreSQL database.
          evidence:
            - apps/sentry/compose.yml:SENTRY_POSTGRES_HOST=172.17.0.24
    command: ["run", "web"]
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
      snuba-api:
        condition: service_healthy
      memcached:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /_health/ HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q ok <&3
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  sentry-events-consumer:
    <<: *sentry-service
    command:
      - run
      - consumer
      - ingest-events
      - --consumer-group
      - ingest-consumer
      - --auto-offset-reset=earliest
      - --no-strict-offset-reset
      - --healthcheck-file-path
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  sentry-attachments-consumer:
    <<: *sentry-service
    command:
      - run
      - consumer
      - ingest-attachments
      - --consumer-group
      - ingest-consumer
      - --auto-offset-reset=earliest
      - --no-strict-offset-reset
      - --healthcheck-file-path
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  sentry-post-process-forwarder-errors:
    <<: *sentry-service
    command:
      - run
      - consumer
      - post-process-forwarder-errors
      - --auto-offset-reset=earliest
      - --no-strict-offset-reset
      - --consumer-group
      - post-process-forwarder
      - --synchronize-commit-log-topic=snuba-commit-log
      - --synchronize-commit-group=snuba-consumers
      - --healthcheck-file-path
      - /tmp/health.txt
      - --max-poll-interval-ms
      - "300000"
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
    healthcheck: *consumer-health

  taskbroker:
    image: ghcr.io/getsentry/taskbroker:26.8.0
    x-nabla:
      id: sentry-taskbroker
      name: Sentry Taskbroker
      kind: task-broker
      category: observability
      presentationRole: support
      criticality: high
      runtime:
        provider: truenas-app
        containerService: taskbroker
      relations:
        - target: kafka
          type: dependsOn
          strength: required
          description: Taskbroker persists task streams through shared Kafka.
          evidence:
            - apps/sentry/compose.yml:TASKBROKER_KAFKA_CLUSTERS__DEFAULT__ADDRESS=kafka:9092
    restart: unless-stopped
    environment:
      TASKBROKER_KAFKA_CLUSTERS__DEFAULT__ADDRESS: kafka:9092
      TASKBROKER_DB_PATH: /opt/sqlite/taskbroker-activations.sqlite
    command: ["/opt/taskbroker", "-c", "/etc/taskbroker/config.yml"]
    volumes:
      - /mnt/cpool/sentry/taskbroker:/opt/sqlite
      - ./config/taskbroker.yml:/etc/taskbroker/config.yml:ro
    networks:
      - sentry
      - intranet

  sentry-taskscheduler:
    <<: *sentry-service
    command: ["run", "taskworker-scheduler"]
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
      taskbroker:
        condition: service_started

  sentry-taskworker:
    <<: *sentry-service
    x-nabla:
      id: sentry-taskworker
      name: Sentry Taskworker
      kind: worker
      category: observability
      presentationRole: support
      criticality: high
      runtime:
        provider: truenas-app
        containerService: sentry-taskworker
      relations:
        - target: sentry-taskbroker
          type: dependsOn
          strength: required
          description: Taskworker receives RPC work from Taskbroker.
          evidence:
            - apps/sentry/compose.yml:--rpc-host=taskbroker:50051
    command:
      - run
      - taskworker
      - --concurrency=2
      - --rpc-host=taskbroker:50051
      - --health-check-file-path=/tmp/health.txt
      - --max-child-task-count=10000
    depends_on:
      sentry-migrate:
        condition: service_completed_successfully
      taskbroker:
        condition: service_started
    healthcheck: *consumer-health

  relay:
    image: ghcr.io/getsentry/relay:26.8.0
    x-nabla:
      id: sentry-relay
      name: Sentry Relay
      kind: ingestion-relay
      category: observability
      presentationRole: support
      criticality: high
      runtime:
        provider: truenas-app
        containerService: relay
      relations:
        - target: sentry
          type: routesTo
          strength: required
          description: Relay forwards accepted traffic to Sentry web.
          evidence:
            - apps/sentry/compose.yml:RELAY_UPSTREAM_URL=http://sentry-web:9000/
        - target: kafka
          type: dependsOn
          strength: required
          description: Relay publishes processing traffic to shared Kafka.
          evidence:
            - apps/sentry/compose.yml:RELAY_KAFKA_BROKER_URL=kafka:9092
        - target: redis
          type: dependsOn
          strength: required
          description: Relay uses the shared Redis service.
          evidence:
            - /mnt/cpool/sentry/.env.secrets:RELAY_REDIS_URL
    restart: unless-stopped
    env_file:
      - /mnt/cpool/sentry/.env.secrets
    environment:
      RELAY_UPSTREAM_URL: http://sentry-web:9000/
      RELAY_HOST: 0.0.0.0
      RELAY_PORT: "3000"
      RELAY_PROCESSING_ENABLED: "true"
      RELAY_KAFKA_BROKER_URL: kafka:9092
      RELAY_LOG_LEVEL: WARN
    depends_on:
      sentry-web:
        condition: service_healthy
    networks:
      - sentry
      - intranet

  nginx:
    image: nginx:1.31.3-alpine
    x-nabla:
      id: sentry-edge
      name: Sentry Edge
      kind: reverse-proxy
      category: network
      presentationRole: support
      criticality: high
      runtime:
        provider: truenas-app
        containerService: nginx
      monitoring:
        type: http
        target: http://172.17.0.24:9005/_health/
      relations:
        - target: sentry-relay
          type: routesTo
          strength: required
          description: The Sentry edge routes ingestion traffic through Relay.
          evidence:
            - apps/sentry/config/nginx.conf:relay_upstream
        - target: sentry
          type: routesTo
          strength: required
          description: The Sentry edge routes application traffic to Sentry web.
          evidence:
            - apps/sentry/config/nginx.conf:sentry_upstream
    restart: unless-stopped
    ports:
      - "172.17.0.24:9005:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sentry-web:
        condition: service_healthy
      relay:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/_health/ | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      intranet:
        gw_priority: 1
      sentry:

networks:
  sentry:
    internal: true
  intranet:
    external: true
    name: intranet
