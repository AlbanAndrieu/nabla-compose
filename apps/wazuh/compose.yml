---
x-nabla:
  nodes:
    - id: wazuh
      name: Wazuh
      kind: security-platform
      category: security
      description: Logical Wazuh security platform composed of manager, indexer, dashboard and forwarding workloads.

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    container_name: wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    x-nabla:
      id: wazuh-manager
      name: Wazuh Manager
      kind: security-manager
      category: security
      securityFunctions:
        - detect
      runtime:
        provider: truenas-app
        containerService: wazuh.manager
      relations:
        - target: wazuh
          type: partOf
          strength: required
          description: Wazuh Manager is a runtime workload of the Wazuh security platform.
        - target: wazuh-indexer
          type: dependsOn
          strength: required
          description: Wazuh Manager indexes security events in the Wazuh Indexer.
          evidence:
            - apps/wazuh/compose.yml:INDEXER_URL
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"
      - "${WAZUH_ENROLLMENT_PORT:-1515}:1515"
      - "${WAZUH_SYSLOG_PORT:-514}:514/udp"
      - "127.0.0.1:${WAZUH_API_PORT:-55000}:55000"
    env_file:
      - path: /mnt/cpool/wazuh/.env.secrets
        required: true
    environment:
      API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_KEY: /etc/ssl/filebeat.key
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - type: bind
        source: /mnt/cpool/wazuh/certs/root-ca-manager.pem
        target: /etc/ssl/root-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.manager.pem
        target: /etc/ssl/filebeat.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.manager-key.pem
        target: /etc/ssl/filebeat.key
        read_only: true
        bind:
          create_host_path: false

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    container_name: wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    x-nabla:
      id: wazuh-indexer
      name: Wazuh Indexer
      kind: search
      category: security
      runtime:
        provider: truenas-app
        containerService: wazuh.indexer
      relations:
        - target: wazuh
          type: partOf
          strength: required
          description: Wazuh Indexer is a runtime workload of the Wazuh security platform.
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${WAZUH_INDEXER_PORT:-9202}:9200"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - type: bind
        source: /mnt/cpool/wazuh/certs/root-ca.pem
        target: /usr/share/wazuh-indexer/config/certs/root-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.indexer-key.pem
        target: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.indexer.pem
        target: /usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/admin.pem
        target: /usr/share/wazuh-indexer/config/certs/admin.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/admin-key.pem
        target: /usr/share/wazuh-indexer/config/certs/admin-key.pem
        read_only: true
        bind:
          create_host_path: false
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    container_name: wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    x-nabla:
      id: wazuh-dashboard
      name: Wazuh Dashboard
      kind: application
      category: security
      runtime:
        provider: truenas-app
        containerService: wazuh.dashboard
      relations:
        - target: wazuh
          type: partOf
          strength: required
          description: Wazuh Dashboard is a runtime workload of the Wazuh security platform.
        - target: wazuh-manager
          type: consumesApi
          strength: required
          description: Wazuh Dashboard consumes the Wazuh Manager API.
          evidence:
            - apps/wazuh/compose.yml:WAZUH_API_URL
        - target: wazuh-indexer
          type: dependsOn
          strength: required
          description: Wazuh Dashboard queries security data from Wazuh Indexer.
          evidence:
            - apps/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "127.0.0.1:${WAZUH_DASHBOARD_PORT:-8444}:5601"
    env_file:
      - path: /mnt/cpool/wazuh/.env.secrets
        required: true
    environment:
      API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:-kibanaserver}
      DASHBOARD_USERNAME: kibanaserver
      INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-SecretPassword}
      INDEXER_USERNAME: admin
      WAZUH_API_URL: https://wazuh.manager
    volumes:
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.dashboard.pem
        target: /usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/wazuh.dashboard-key.pem
        target: /usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/wazuh/certs/root-ca.pem
        target: /usr/share/wazuh-dashboard/certs/root-ca.pem
        read_only: true
        bind:
          create_host_path: false
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh_dashboard_config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom

  wazuh-forwarder:
    profiles:
      - forwarding
    build:
      context: .
      dockerfile: Dockerfile.logstash
    image: nabla/wazuh-logstash:8.19.20
    container_name: wazuh-forwarder
    restart: unless-stopped
    x-nabla:
      id: wazuh-forwarder
      name: Wazuh OpenSearch Forwarder
      kind: telemetry-forwarder
      category: security
      runtime:
        provider: truenas-app
        containerService: wazuh-forwarder
      relations:
        - target: wazuh
          type: partOf
          strength: optional
          description: The forwarder is an optional integration workload of the Wazuh security platform.
        - target: wazuh-manager
          type: dependsOn
          strength: required
          description: The forwarder reads Wazuh alert files produced by Wazuh Manager.
          evidence:
            - apps/wazuh/compose.yml:wazuh_logs
        - target: opensearch-security
          type: storesIn
          strength: required
          description: The forwarder replicates Wazuh alerts into the shared OpenSearch 2.x security cluster.
          evidence:
            - apps/wazuh/config/logstash/wazuh-opensearch.conf
    user: "0:0"
    volumes:
      - wazuh_logs:/var/ossec/logs:ro
      - ./config/logstash/wazuh-opensearch.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - default
      - security

volumes:
  filebeat_etc:
  filebeat_var:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_api_configuration:
  wazuh_dashboard_config:
  wazuh_dashboard_custom:
  wazuh_etc:
  wazuh_indexer_data:
  wazuh_integrations:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_wodles:

networks:
  security:
    external: true
    name: nabla-security
