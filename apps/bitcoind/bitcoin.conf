# Bitcoin Core 31.x homelab node (mainnet). Non-secret configuration,
# mounted read-only by apps/bitcoind/compose.yml.
#
# The node is disposable: no wallet, pruned blockchain re-synchronised from the
# network, no ZFS snapshot (config/truenas/snapshot-tasks.json noSnapshot).

# RPC only for bitcoin-cli inside the container, authenticated by the cookie
# file in the datadir. No rpcuser/rpcpassword/rpcauth and no published port.
server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# No wallet: nothing on the dataset needs a backup.
disablewallet=1

# Outbound peers only; inbound P2P would need a pfSense port forward.
listen=0
blocksonly=1
maxconnections=16

# Bounded footprint: ~25 GB of blocks, small caches (see mem_limit).
prune=25000
dbcache=300
maxmempool=100

# Logs go to Docker (rotated by the Compose logging options).
printtoconsole=1
nodebuglogfile=1
