---
services:
  sonarqube:
    image: sonarqube:26.8.0.126808-community
    container_name: sonarqube
    restart: unless-stopped
    x-nabla:
      id: sonarqube
      name: SonarQube
      kind: code-quality
      category: development
      runtime:
        provider: truenas-app
        containerService: sonarqube
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: SonarQube persists application state in the existing PostgreSQL service.
          evidence:
            - apps/sonarqube/compose.yml:SONAR_JDBC_URL
    environment:
      SONAR_JDBC_PASSWORD: ${SONAR_JDBC_PASSWORD}
      SONAR_JDBC_URL: ${SONAR_JDBC_URL:-jdbc:postgresql://172.17.0.24:5432/sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_JDBC_USERNAME:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9001}:9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 4096
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
