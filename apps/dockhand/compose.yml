---
name: dockhand
services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    x-nabla:
      id: dockhand
      name: Dockhand
      kind: container-management
      category: operations
      presentationRole: service
      criticality: medium
      description: Docker container management UI.
      runtime:
        provider: truenas-app
        containerService: dockhand
      monitoring:
        type: port
        host: 172.17.0.24
        port: 3050
    restart: unless-stopped
    labels:
      com.albandrieu.nabla.entity-ref: component:default/dockhand
    ports:
      - name: web
        target: 3000
        published: "3050"
        protocol: tcp
        app_protocol: http
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/cpool/dockhand:/app/data
