# OpenRAG provider catalogue override for the homelab.
#
# Keep the upstream provider set visible and add the workstation LiteLLM proxy
# as an OpenAI-compatible provider. Credentials are runtime-only environment
# variables; never store LITELLM_IDE_API_KEY in this file.
providers:
  - name: openai
    display_name: OpenAI
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: ollama
    display_name: Ollama
    modes:
      oss: true
      on_prem: true
      saas: false

  - name: watsonx
    display_name: IBM watsonx.ai
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: anthropic
    display_name: Anthropic
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: azure_ai
    display_name: Azure AI Foundry
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: azure
    display_name: Azure OpenAI
    modes:
      oss: true
      on_prem: true
      saas: true

  - name: openai_like
    display_name: LiteLLM Workstation GPU
    modes:
      oss: true
      on_prem: true
      saas: false
    models:
      - qwen
    embedding_models:
      - embedding
