---
services:
  openrag-backend:
    image: docker.io/langflowai/openrag-backend:latest
    container_name: openrag-backend
    restart: unless-stopped
    x-nabla:
      id: openrag-backend
      name: OpenRAG Backend
      kind: service
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-backend
      relations:
        - target: langflow
          type: dependsOn
          strength: required
          description: OpenRAG backend invokes the shared Langflow service.
          evidence:
            - apps/openrag/compose.yml:LANGFLOW_URL
        - target: opensearch
          type: dependsOn
          strength: required
          description: OpenRAG backend stores and retrieves indexed content through OpenSearch.
          evidence:
            - apps/openrag/compose.yml:OPENSEARCH_HOST
    env_file:
      - /mnt/cpool/openrag/.env.secrets
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-admin}"
      LANGFLOW_URL: http://langflow:7860
      ENVIRONMENT: production
    volumes:
      - ./openrag-documents:/app/openrag-documents:U,z
      - ./keys:/app/keys:U,z
      - ./flows:/app/flows:U,z
      - ./flows/backup:/app/flows/backup:U,z
      - ./config:/app/config:U,z
      - ./data:/app/data:U,z
    networks:
      - intranet
      - traefik_network

  openrag-frontend:
    image: docker.io/langflowai/openrag-frontend:latest
    container_name: openrag-frontend
    restart: unless-stopped
    x-nabla:
      id: openrag-frontend
      name: OpenRAG Frontend
      kind: application
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-frontend
      relations:
        - target: openrag-backend
          type: consumesApi
          strength: required
          description: The OpenRAG frontend talks to the OpenRAG backend.
          evidence:
            - apps/openrag/compose.yml:OPENRAG_BACKEND_HOST
    environment:
      OPENRAG_BACKEND_HOST: openrag-backend
    depends_on:
      - openrag-backend
    ports:
      - "3000:3000"
    networks:
      - intranet
      - traefik_network

networks:
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
