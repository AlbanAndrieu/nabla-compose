version: '3.8'

services:
  openrag-backend:
    image: docker.io/langflowai/openrag-backend:latest
    container_name: openrag-backend
    x-nabla:
      id: openrag-backend
      name: OpenRAG Backend
      kind: service
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-backend
      relations:
        - target: langflow
          type: dependsOn
          strength: required
          description: OpenRAG backend invokes the Langflow service.
          evidence:
            - apps/openrag/compose.yml:LANGFLOW_URL
        - target: elasticsearch
          type: dependsOn
          strength: required
          description: OpenRAG backend stores and retrieves indexed content through Elasticsearch.
          evidence:
            - apps/openrag/compose.yml:ES_HOST
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASS=${ELASTIC_PASSWORD:-changeme}
      - LANGFLOW_URL=http://langflow:7860
      # Add any other required envs from the openrag reference compose here
      - ENVIRONMENT=production
    depends_on:
      - elasticsearch
      - langflow
    volumes:
      - ./openrag-documents:/app/openrag-documents:U,z
      - ./keys:/app/keys:U,z
      - ./flows:/app/flows:U,z
      - ./flows/backup:/app/flows/backup:U,z
      - ./config:/app/config:U,z
      - ./data:/app/data:U,z
    networks:
      - traefik_network
    restart: unless-stopped

  openrag-frontend:
    image: docker.io/langflowai/openrag-frontend:latest
    container_name: openrag-frontend
    x-nabla:
      id: openrag-frontend
      name: OpenRAG Frontend
      kind: application
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-frontend
      relations:
        - target: openrag-backend
          type: consumesApi
          strength: required
          description: The OpenRAG frontend talks to the OpenRAG backend.
          evidence:
            - apps/openrag/compose.yml:OPENRAG_BACKEND_HOST
    environment:
      - OPENRAG_BACKEND_HOST=openrag-backend
    depends_on:
      - openrag-backend
    ports:
      - "3000:3000"
    networks:
      - traefik_network
    restart: unless-stopped

networks:
  traefik_network:
    external: true
