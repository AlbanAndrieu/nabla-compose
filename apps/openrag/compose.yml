---
services:
  openrag-backend:
    image: docker.io/langflowai/openrag-backend:${OPENRAG_VERSION:-0.7.1}
    container_name: openrag-backend
    restart: unless-stopped
    x-nabla:
      id: openrag-backend
      name: OpenRAG Backend
      kind: service
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-backend
      relations:
        - target: langflow
          type: dependsOn
          strength: required
          description: OpenRAG backend invokes the shared Langflow service.
          evidence:
            - apps/openrag/compose.yml:LANGFLOW_URL
        - target: opensearch
          type: dependsOn
          strength: required
          description: OpenRAG backend stores and retrieves indexed content through OpenSearch.
          evidence:
            - apps/openrag/compose.yml:OPENSEARCH_HOST
    env_file:
      - /mnt/cpool/openrag/.env.secrets
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-admin}"
      OPENSEARCH_NODE_COUNT_CHECK_ENABLED: "false"
      LANGFLOW_URL: http://langflow:7860
      OPENRAG_BACKEND_INTERNAL_URL: http://openrag-backend:8000
      DOCLING_SERVE_URL: ${DOCLING_SERVE_URL:-http://host.docker.internal:5001}
      # OpenRAG 0.7.1 has no generic openai_like provider. Route its built-in
      # OpenAI-compatible client to the GPU workstation LiteLLM instead.
      # LITELLM_IDE_API_KEY remains in /mnt/cpool/openrag/.env.secrets.
      OPENRAG_LITELLM_API_BASE: ${OPENRAG_LITELLM_API_BASE:-http://172.17.0.57:4000/v1}
      OPENAI_BASE_URL: ${OPENRAG_LITELLM_API_BASE:-http://172.17.0.57:4000/v1}
      OPENRAG_LITELLM_CHAT_MODEL: ${OPENRAG_LITELLM_CHAT_MODEL:-qwen}
      OPENRAG_LITELLM_EMBEDDING_MODEL: ${OPENRAG_LITELLM_EMBEDDING_MODEL:-embedding}
      ENVIRONMENT: production
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8000/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./openrag-documents:/app/openrag-documents:U,z
      - ./keys:/app/keys:U,z
      # Keep the image-bundled OpenRAG 0.7.1 flows visible. Only the mutable
      # backup path is bind-mounted; an empty parent /app/flows bind would hide
      # the compatible built-in flow definitions.
      - ./flows/backup:/app/flows/backup:U,z
      - ./config:/app/config:U,z
      - ./data:/app/data:U,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intranet
      - traefik_network

  openrag-frontend:
    image: docker.io/langflowai/openrag-frontend:${OPENRAG_VERSION:-0.7.1}
    container_name: openrag-frontend
    restart: unless-stopped
    x-nabla:
      id: openrag-frontend
      name: OpenRAG Frontend
      kind: application
      category: ai
      runtime:
        provider: truenas-app
        containerService: openrag-frontend
      relations:
        - target: openrag-backend
          type: consumesApi
          strength: required
          description: The OpenRAG frontend talks to the OpenRAG backend.
          evidence:
            - apps/openrag/compose.yml:OPENRAG_BACKEND_HOST
        - target: langflow
          type: dependsOn
          strength: required
          description: Frontend collective health checks the shared global Langflow service.
          evidence:
            - apps/openrag/compose.yml:LANGFLOW_HOST
    environment:
      OPENRAG_BACKEND_HOST: openrag-backend
      OPENRAG_BACKEND_PORT: "8000"
      LANGFLOW_HOST: langflow
      LANGFLOW_PORT: "7860"
      LANGFLOW_HEALTH_PATH: /health_check
    depends_on:
      openrag-backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/collective_health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    ports:
      - "${OPENRAG_FRONTEND_PORT:-31060}:3000"
    networks:
      - intranet
      - traefik_network

networks:
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
