---
name: redis
x-nabla:
  deploymentUnit:
    probePolicy:
      rank: 4
      primaryEndpoint: resource:default/redis
# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  redis:
    logging: *nabla-logging
    image: docker.io/redis:8.8.0
    # image: redis:7-alpine
    # image: registry.community.greenbone.net/community/redis-server
    container_name: redis
    labels:
      com.albandrieu.nabla.entity-ref: resource:default/redis
    x-nabla:
      id: redis
      name: Redis
      kind: cache
      category: data
      runtime:
        provider: truenas-app
        appId: redis
        containerService: redis
      lifecycle:
        phase: primary-data
        priority: 20
      exposure:
        - name: lan
          protocol: TCP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: redis
    restart: unless-stopped
    # REDIS_AUTH comes from the container env, not Compose interpolation of a
    # project .env (Q18). Re-entering the entrypoint keeps the drop to the redis
    # user. Fail closed: an empty REDIS_AUTH must not start Redis without a password.
    env_file:
      - /mnt/cpool/secrets/runtime/redis/.env.secrets
    command:
      - sh
      - -c
      - >-
        : "$${REDIS_AUTH:?REDIS_AUTH is required}";
        exec docker-entrypoint.sh redis-server
        --requirepass "$$REDIS_AUTH"
        --maxmemory-policy noeviction
    ports:
      - name: redis
        target: 6379
        published: "30059"
        # Publish only on the TrueNAS LAN address; intranet clients use redis:6379.
        host_ip: 172.17.0.24
        protocol: tcp
    volumes:
      - /mnt/cpool/redis:/data
    healthcheck:
      # Authenticated PING: REDISCLI_AUTH keeps the password off argv, grep hides the reply.
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_AUTH" redis-cli ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      intranet:
        aliases:
          - redis

  redis_exporter:
    logging: *nabla-logging
    labels:
      com.albandrieu.nabla.entity-ref: component:default/redis-redis-exporter
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    restart: unless-stopped
    # REDIS_PASSWORD is rendered from the same Vaultwarden field as REDIS_AUTH.
    env_file:
      - /mnt/cpool/secrets/runtime/redis/.env.secrets
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - 9121:9121
    depends_on:
      - redis
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
