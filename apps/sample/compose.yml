---
services:
  fastapi-sample:
    image: ${FASTAPI_SAMPLE_IMAGE:-fastapi-sample:local}
    build:
      context: ../../fastapi-sample
      dockerfile: Dockerfile
      target: production
    container_name: fastapi-sample
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    x-nabla:
      id: fastapi-sample
      name: FastAPI Sample
      kind: api
      category: development
      description: FastAPI Sample service with FastAPI Cloud production and TrueNAS staging environments.
      presentationRole: service
      environments:
        - name: production
          url: https://fastapi-sample.fastapicloud.dev/api
          external: false
          cloudflareTunnel: false
        - name: staging
          url: https://sample.albandrieu.com/api
          external: false
          cloudflareTunnel: false
      runtime:
        provider: truenas-app
        containerService: fastapi-sample
      relations:
        - target: redis
          type: dependsOn
          strength: optional
          description: FastAPI Sample uses the shared Redis service for L2 probe caches and runtime heartbeat aggregation.
          evidence:
            - apps/sample/compose.yml:/mnt/cpool/sample/.env.secrets:REDIS_URL
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik exposes the local FastAPI Sample endpoint on the trusted internal hostname.
          evidence:
            - apps/sample/compose.yml:traefik.http.routers.fastapi-sample
      monitoring:
        type: http
        target: http://172.17.0.24:8091/health
        conditions:
          - "[STATUS] == 200"

    # Runtime secrets/configuration stay on TrueNAS, outside Git. In particular,
    # define REDIS_URL=redis://:<REDIS_AUTH>@redis:6379/0 in .env.secrets.
    # PostgreSQL/Supabase, pfSense, TrueNAS and other optional provider settings
    # can be supplied through the same files without duplicating secrets here.
    env_file:
      - /mnt/cpool/sample/.env
      - /mnt/cpool/sample/.env.secrets

    environment:
      FASTAPI_ENV: production
      FASTAPI_RUNTIME_MODE: homelab
      FASTAPI_CLOUD: ""
      FASTAPI_CLOUD_APP_ID: ""
      EXPOSE_PORT: "8080"
      SICKZ_INTERNAL_NETWORK: "true"
      HOMELAB_INTERNAL_PROBES_ENABLED: "true"
      # home.albandrieu.com is pinned below to pfSense LAN 172.17.0.1.
      # This control path is independent from the public WAN listener.
      PFSENSE_SECURITY_PATH_MODE: out_of_band
      PYROSCOPE_SERVER_ADDRESS: http://172.17.0.24:4040
      SICKZ_NETWORK_LABEL: nabla
      APP_DOMAIN: sample.int.albandrieu.com
      SENTRY_ENABLED: "true"
      SENTRY_ENVIRONMENT: homelab
      SENTRY_AI_INTEGRATIONS_ENABLED: "true"

    # Keep appliance probes on the trusted LAN while preserving public DNS
    # names for TLS hostname verification.
    #
    # TrueNAS 26 also applies system.general.ui_allowlist to /api/current
    # WebSocket source addresses before API-key authentication. The source
    # observed by TrueNAS is this container's sample-observer IP, not
    # 172.17.0.24 and not its shared-intranet address.
    # Validate the current /32 with:
    # scripts/security/verify-truenas-observer-access.sh
    extra_hosts:
      - "truenas.albandrieu.com:172.17.0.24"
      - "home.albandrieu.com:172.17.0.1"

    ports:
      - "${FASTAPI_SAMPLE_PORT:-8091}:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    labels:
      # Internal DNS is synchronized from Traefik routers into Pi-hole.
      # Staging sample.albandrieu.com is explicitly not a Cloudflare Tunnel endpoint.
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.fastapi-sample.rule=Host(`sample.int.albandrieu.com`)"
      - "traefik.http.routers.fastapi-sample.entrypoints=websecure"
      - "traefik.http.routers.fastapi-sample.tls.certresolver=letsencrypt"
      - "traefik.http.routers.fastapi-sample.service=fastapi-sample"
      - "traefik.http.services.fastapi-sample.loadbalancer.server.port=8080"
    networks:
      # Dedicated observer network: do not reserve the TrueNAS allowlisted
      # source address inside the shared intranet pool. Docker may legitimately
      # hand an unused intranet address to another application (as happened
      # with Langflow taking 172.16.55.9).
      sample_observer:
        # The external sample-observer network is prepared so only one
        # container address is allocatable. No static IP is hard-coded here.
        gw_priority: 1
      intranet: {}
      traefik_network: {}

networks:
  sample_observer:
    # Prepared by scripts/truenas/prepare-sample-observer-network.sh. Keeping
    # the network external prevents Compose from guessing a subnet that may
    # overlap a broader TrueNAS/Docker pool.
    external: true
    name: sample-observer
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
    name: traefik_network
