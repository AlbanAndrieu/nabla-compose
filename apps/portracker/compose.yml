---
name: portracker
services:
  portracker:
    image: mostafawahied/portracker:latest
    container_name: portracker
    x-nabla:
      id: portracker
      name: Portracker
      kind: port-inventory
      category: operations
      presentationRole: support
      criticality: medium
      description: Host and Docker port inventory used to detect exposure and allocation drift.
      runtime:
        provider: truenas-app
        containerService: portracker
      monitoring:
        type: port
        host: 172.17.0.24
        port: 4999
    restart: unless-stopped
    labels:
      com.albandrieu.nabla.entity-ref: component:default/portracker
    pid: "host" # Required for port detection
    # Required permissions for system ports service namespace access
    cap_add:
      - SYS_PTRACE # Linux hosts: read other PIDs' /proc entries
      - SYS_ADMIN # Docker Desktop: allow namespace access for host ports (required for MacOS)
    security_opt:
      - apparmor:unconfined # Required for system ports
    volumes:
      # Required for data persistence
      - /mnt/cpool/portracker:/data
      # Required for discovering services running in Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - name: web
        target: 4999
        published: "4999"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    environment:
      # Optional: For enhanced TrueNAS features
      - TRUENAS_API_KEY=${TRUENAS_API_KEY}
      # - ENABLE_AUTH=true
      # - SESSION_SECRET=your-random-secret-here-change-this
