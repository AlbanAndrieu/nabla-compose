---
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Keep the single-node filesystem deployment bounded. Loki does not reclaim
# filesystem storage based on free disk space; retention is compactor-driven.
limits_config:
  retention_period: 720h
  max_query_lookback: 720h
  # disabled made every query log "deletion is not available for this tenant"; operator chose filter-only (2026-11-11).
  deletion_mode: filter-only

compactor:
  working_directory: /loki/compactor
  compaction_interval: 15m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem
