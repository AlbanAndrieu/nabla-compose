---
services:
  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana-stack
    restart: unless-stopped
    x-nabla:
      id: grafana
      name: Grafana
      kind: observability-ui
      category: observability
      runtime:
        provider: truenas-app
        containerService: grafana
      relations:
        - target: loki
          type: consumesApi
          strength: optional
          description: Grafana queries Loki for logs.
          evidence:
            - apps/grafana/config/grafana-datasources.yml
        - target: mimir
          type: consumesApi
          strength: optional
          description: Grafana queries Mimir for metrics.
          evidence:
            - apps/grafana/config/grafana-datasources.yml
        - target: tempo
          type: consumesApi
          strength: optional
          description: Grafana queries Tempo for distributed traces.
          evidence:
            - apps/grafana/config/grafana-datasources.yml
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    volumes:
      - /mnt/cpool/grafana:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/nabla.yml:ro
    depends_on:
      - loki
      - mimir
      - tempo

  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    x-nabla:
      id: loki
      name: Loki
      kind: log-store
      category: observability
      runtime:
        provider: truenas-app
        containerService: loki
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/config.yml:ro
      - /mnt/cpool/loki:/loki

  mimir:
    image: grafana/mimir:3.2.0
    container_name: mimir
    restart: unless-stopped
    x-nabla:
      id: mimir
      name: Mimir
      kind: metrics-store
      category: observability
      runtime:
        provider: truenas-app
        containerService: mimir
    command:
      - -config.file=/etc/mimir/config.yml
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    volumes:
      - ./config/mimir.yml:/etc/mimir/config.yml:ro
      - /mnt/cpool/mimir:/data

  tempo:
    image: grafana/tempo:2.10.7
    container_name: tempo
    restart: unless-stopped
    x-nabla:
      id: tempo
      name: Tempo
      kind: trace-store
      category: observability
      runtime:
        provider: truenas-app
        containerService: tempo
    command:
      - -config.file=/etc/tempo/config.yml
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
      - ./config/tempo.yml:/etc/tempo/config.yml:ro
      - /mnt/cpool/tempo:/var/tempo

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    x-nabla:
      id: alloy
      name: Grafana Alloy
      kind: telemetry-collector
      category: observability
      runtime:
        provider: truenas-app
        containerService: alloy
      relations:
        - target: loki
          type: storesIn
          strength: required
          description: Alloy forwards collected security logs to Loki.
          evidence:
            - apps/grafana/config/alloy.alloy:loki.write
        - target: mimir
          type: storesIn
          strength: required
          description: Alloy remote-writes collected OTLP metrics to Mimir.
          evidence:
            - apps/grafana/config/alloy.alloy:prometheus.remote_write
        - target: tempo
          type: storesIn
          strength: required
          description: Alloy forwards collected OTLP traces to Tempo.
          evidence:
            - apps/grafana/config/alloy.alloy:otelcol.exporter.otlp
        - target: pfsense
          type: dependsOn
          strength: optional
          description: Alloy tails pfSense log files when they are mounted on the TrueNAS host.
          evidence:
            - apps/grafana/compose.yml:PFSENSE_LOG_DIR
        - target: suricata
          type: dependsOn
          strength: optional
          description: Alloy tails Suricata JSON logs when available.
          evidence:
            - apps/grafana/compose.yml:SURICATA_LOG_DIR
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_HTTP_PORT:-12345}:12345"
      - "${ALLOY_OTLP_GRPC_PORT:-4319}:4319"
      - "${ALLOY_OTLP_HTTP_PORT:-4320}:4320"
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - /mnt/cpool/alloy:/var/lib/alloy/data
      - type: bind
        source: ${PFSENSE_LOG_DIR:-/mnt/cpool/logs/pfsense}
        target: /var/log/pfsense
        read_only: true
      - type: bind
        source: ${SURICATA_LOG_DIR:-/mnt/cpool/suricata/log}
        target: /var/log/suricata
        read_only: true
    depends_on:
      - loki
      - mimir
      - tempo
