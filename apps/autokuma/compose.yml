---
x-nabla:
  nodes:
    - id: uptime-kuma
      name: Uptime Kuma
      kind: native-truenas-uptime-monitor
      category: observability
      url: http://172.17.0.24:31050
      description: Intended native TrueNAS Uptime Kuma target on host port 31050, reconciled by AutoKuma until the service is migrated to repository-owned Compose. Confirm the native App still exists before enabling AutoKuma.
      runtime:
        provider: truenas-app
        appId: uptime-kuma
      lifecycle:
        phase: platform-services
        priority: 40

services:
  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    container_name: autokuma
    x-nabla:
      id: autokuma
      name: AutoKuma
      kind: monitoring-controller
      category: observability
      description: Declarative monitor reconciler for the existing Uptime Kuma instance.
      runtime:
        provider: truenas-app
        appId: autokuma
        containerService: autokuma
      lifecycle:
        phase: platform-services
        priority: 40
      relations:
        - target: uptime-kuma
          type: consumesApi
          strength: required
          description: AutoKuma reconciles generated monitors into Uptime Kuma.
          evidence:
            - apps/autokuma/compose.yml:AUTOKUMA__KUMA__URL
    restart: unless-stopped
    env_file:
      - path: /mnt/cpool/secrets/runtime/autokuma/.env.secrets
        required: false
    environment:
      # AutoKuma 2.x requires kuma.url at startup. Uptime Kuma is still a
      # native TrueNAS target for now and is intended on the host at :31050.
      AUTOKUMA__KUMA__URL: ${UPTIME_KUMA_URL:-http://172.17.0.24:31050}
      AUTOKUMA__STATIC_MONITORS: /config/static
      AUTOKUMA__FILES__ENABLED: "true"
      AUTOKUMA__DOCKER__ENABLED: "false"
      AUTOKUMA__ON_DELETE: keep
      AUTOKUMA__TAG_NAME: Nabla
    volumes:
      - /mnt/cpool/autokuma:/data
      - ./static:/config/static:ro
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
