---
name: wordpress

# WordPress uses the shared PostgreSQL service through the external `intranet`
# network. Cross-project dependencies are not modeled with Compose depends_on:
# the init container performs a bounded PostgreSQL readiness loop and Backstage
# owns the required dependency on resource:default/postgresql.
#
# Standard wordpress:* images only support MySQL/MariaDB; this stack uses
# ntninja/wordpress-postgresql (PG4WP). That image is community-maintained and
# based on an older WordPress line — not suitable for untrusted production.
services:
  wordpress-initdb:
    image: postgres:18-bookworm
    container_name: wordpress-initdb
    restart: "no"
    environment:
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${WORDPRESS_DB_SUPERUSER:-postgres}
      PGPASSWORD: ${WORDPRESS_DB_SUPERUSER_PASSWORD:-}
    networks:
      - intranet
    entrypoint: ["/bin/bash", "-eu", "-c"]
    command:
      - |
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER"; do sleep 2; done
        exists=$$(psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname = '$$WORDPRESS_DB_NAME'" || true)
        if [ "$$exists" = "1" ]; then
          echo "database $$WORDPRESS_DB_NAME already exists"
          exit 0
        fi
        psql -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" -d postgres -v ON_ERROR_STOP=1 \
          -c "CREATE DATABASE \"$$WORDPRESS_DB_NAME\";"

  wordpress:
    image: ntninja/wordpress-postgresql:latest
    container_name: wordpress
    x-nabla:
      id: wordpress
      name: WordPress
      kind: cms
      category: development
      presentationRole: service
      criticality: low
      description: Lab WordPress deployment backed by PostgreSQL through PG4WP.
      runtime:
        provider: truenas-app
        containerService: wordpress
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: WordPress stores application state in PostgreSQL through PG4WP.
          evidence:
            - apps/wordpress/compose.yml:WORDPRESS_DB_HOST=postgres:5432
    labels:
      com.albandrieu.nabla.entity-ref: component:default/wordpress
    restart: unless-stopped
    depends_on:
      wordpress-initdb:
        condition: service_completed_successfully
    ports:
      - name: web
        target: 80
        published: "${WORDPRESS_HTTP_PORT:-8088}"
        protocol: tcp
        app_protocol: http
    environment:
      WORDPRESS_DB_HOST: postgres:5432
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-postgres}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
    volumes:
      - wordpress_html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - intranet

volumes:
  wordpress_html:

networks:
  intranet:
    external: true
    name: intranet
