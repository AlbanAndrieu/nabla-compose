---
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.6
    x-nabla:
      id: kafka
      name: Apache Kafka
      kind: message-broker
      category: data
      runtime:
        provider: truenas-app
        containerService: kafka
      lifecycle:
        phase: primary-data
        priority: 20
      monitoring:
        type: port
        host: kafka
        port: 9092
    restart: unless-stopped
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1001@127.0.0.1:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NODE_ID: "1001"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_MESSAGE_MAX_BYTES: "50000000"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "50000000"
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_LOG4J_LOGGERS: kafka.cluster=WARN,kafka.controller=WARN,kafka.coordinator=WARN,kafka.log=WARN,kafka.server=WARN,state.change.logger=WARN
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - /mnt/cpool/kafka:/var/lib/kafka/data
    healthcheck:
      # A listening TCP socket is not enough: Sentry observed coordinator and
      # ApiVersion timeouts while 9092 was still open. Require a real broker
      # metadata request before Kafka is considered ready by dependent Apps.
      test:
        - CMD-SHELL
        - >-
          kafka-topics --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      intranet:
        aliases:
          - kafka

  kafka-exporter:
    image: danielqsj/kafka-exporter:${KAFKA_EXPORTER_IMG:-v1.9.0}
    restart: unless-stopped
    x-nabla:
      id: kafka-exporter
      name: Kafka Exporter
      kind: metrics-exporter
      category: observability
      runtime:
        provider: truenas-app
        containerService: kafka-exporter
      monitoring:
        type: http
        target: http://172.17.0.24:9308/metrics
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: kafka
          type: observes
          strength: required
          description: Exporter queries broker/topic and consumer-group state from Kafka.
          evidence:
            - apps/kafka/compose.yml:--kafka.server=kafka:9092
        - target: prometheus
          type: observedBy
          strength: required
          description: Prometheus scrapes Kafka topic/group lag and membership metrics.
          evidence:
            - apps/prometheus/prometheus.yml:job_name=kafka_exporter
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
      - --verbosity=0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "172.17.0.24:9308:9308"
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
