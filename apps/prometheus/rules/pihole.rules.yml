# Pi-hole Exporter alert rules (awesome-prometheus-alerts)
groups:
  - name: PiHole
    rules:
      - alert: PiHoleDown
        expr: pihole_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Pi-hole exporter unreachable
          description: Your Pi-hole is not reporting to Prometheus.
      - alert: PiHoleNoBlocklists
        expr: pihole_gravity_count == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Pi-hole blocklists empty
          description: Your Pi-hole does not appear to be using any blocklists and will not block any ads/malware.
      # *_today are daily gauges reset at midnight, not counters: rate() made the first rule always fire and the second never.
      - alert: PiHoleAdsBlockedTooLow
        expr: sum(pihole_dns_queries_today) > 1000 and sum(pihole_ads_blocked_today) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: Pi-hole blocks nothing
          description: Pi-hole answered more than 1000 queries today without blocking any.
      - alert: PiHoleQueryCountHigh
        expr: sum(delta(pihole_dns_queries_today[5m])) > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pi-hole DNS queries very high
          description: Pi-hole answered more than 10000 queries in 5 minutes (about 40 times the usual rate). This could indicate malware or a misconfiguration.
