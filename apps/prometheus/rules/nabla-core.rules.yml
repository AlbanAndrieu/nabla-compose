---
groups:
  - name: NablaCoreSignals
    interval: 30s
    rules:
      - record: nabla:telemetry:pfsense_metrics_up
        expr: max(up{job="pfsense_exporter"})

      - record: nabla:core:pfsense_memory_available_ratio
        expr: 1 - max(pfsense_system_memory_usage_ratio{job="pfsense_exporter"})

      - record: nabla:telemetry:truenas_node_up
        expr: max(up{job="truenas_node"})

      - record: nabla:core:truenas_memory_available_ratio
        expr: |
          max(
            node_memory_MemAvailable_bytes{job="truenas_node"}
            /
            node_memory_MemTotal_bytes{job="truenas_node"}
          )

      - record: nabla:core:truenas_cpu_busy_ratio
        expr: |
          1 - avg(
            rate(node_cpu_seconds_total{job="truenas_node",mode="idle"}[5m])
          )

  - name: NablaObservabilitySignals
    interval: 30s
    rules:
      - record: nabla:observability:prometheus_up
        expr: max(up{job="prometheus"})

      # Scrape success is evidence about telemetry collection, not service health.
      # Missing/nonexistent targets intentionally remain absent, not healthy.
      - record: nabla:telemetry:service_exporter_up
        expr: |
          max by (job) (
            up{job=~"gatus|fastapi_sample|postgres_exporter|redis_exporter|pfsense_exporter|crowdsec|cloudflare_exporter|truenas_node|kafka_exporter|clickhouse|opensearch|opensearch-security|grafana|alloy|loki|mimir|tempo|alertmanager|pyroscope|keycloak|pihole_exporter|haproxy|n8n|docling"}
          )

      - record: nabla:telemetry:postgres_functional_up
        expr: max(pg_up{job="postgres_exporter"})

      - record: nabla:telemetry:redis_functional_up
        expr: max(redis_up{job="redis_exporter"})

      - alert: NablaObservabilityTargetDown
        expr: >-
          up{job=~"prometheus|grafana|alloy|loki|mimir|tempo|alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          scope: observability
          impact: degraded
        annotations:
          summary: Core observability target is unavailable
          description: >-
            The {{ $labels.job }} observability target has been unreachable by
            Prometheus for at least two minutes.

      - alert: NablaExporterTargetDown
        expr: >-
          up{job=~"pihole_exporter|postgres_exporter|redis_exporter|pfsense_exporter|haproxy|opensearch|opensearch-security|crowdsec|truenas_node"} == 0
        for: 2m
        labels:
          severity: warning
          scope: observability
          impact: blind_spot
        annotations:
          summary: Metrics exporter is unavailable
          description: >-
            Prometheus has been unable to scrape exporter job {{ $labels.job }}
            for at least two minutes.
