---
# Not loaded: Prometheus only reads rules/*.rules.yml. pfSense is disabled in the
# catalog since 19/11/2026 (Netgate 1100 removed). Re-enable: docs/pfsense/README.md.
groups:
  - name: pfSense
    rules:
      - record: nabla:telemetry:pfsense_metrics_up
        expr: max(up{job="pfsense_exporter"})

      - record: nabla:core:pfsense_memory_available_ratio
        expr: 1 - max(pfsense_system_memory_usage_ratio{job="pfsense_exporter"})

      - alert: pfSenseExporterDown
        expr: up{job="pfsense_exporter"} == 0
        for: 2m
        labels:
          severity: warning
          scope: telemetry
          impact: blind_spot
        annotations:
          summary: pfSense metrics path is unavailable
          description: >-
            Prometheus cannot successfully scrape the pfSense exporter target
            for at least two minutes.

      - alert: pfSenseMetricsMissing
        expr: absent(pfsense_system_cpu_usage_ratio{job="pfsense_exporter"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: pfSense system metrics are missing
          description: >-
            The expected pfSense system metric has been absent for five
            minutes even though the exporter service may still be reachable.
      - alert: pfSenseMemoryHeadroomLow
        expr: pfsense_system_memory_usage_ratio{job="pfsense_exporter"} > 0.87
        for: 5m
        labels:
          severity: warning
          scope: platform
          impact: pressure
        annotations:
          summary: pfSense memory headroom is low
          description: >-
            pfSense memory usage has remained above 87% for five minutes,
            approximately the 128 MiB free-memory guardrail on the current
            Netgate 1100. Avoid heavy reloads or adding local analytics.

      - alert: pfSenseMemoryHeadroomCritical
        expr: pfsense_system_memory_usage_ratio{job="pfsense_exporter"} > 0.94
        for: 2m
        labels:
          severity: critical
          scope: platform
          impact: pressure
        annotations:
          summary: pfSense memory headroom is critical
          description: >-
            pfSense memory usage has remained above 94% for two minutes,
            approximately the 64 MiB critical free-memory guardrail on the
            current Netgate 1100. OOM/reclaim failures are likely if pressure grows.

  - name: AkvoradoPfSenseFlow
    rules:
      - alert: AkvoradoPfSenseExporterMissing
        expr: >-
          absent(akvorado_inlet_flow_input_udp_packets_total{job="akvorado_inlet",exporter="172.17.0.1"})
        for: 5m
        labels:
          severity: warning
          scope: network-flow
          impact: degraded
        annotations:
          summary: pfSense exporter is missing from Akvorado
          description: >-
            Akvorado has exposed no UDP packet counter for exporter 172.17.0.1
            for five minutes. Verify pflow and the 172.17.0.24:2055/udp path.

      - alert: AkvoradoPfSenseFlowSilent
        expr: >-
          sum(increase(akvorado_inlet_flow_input_udp_packets_total{job="akvorado_inlet",exporter="172.17.0.1"}[10m])) == 0
        for: 10m
        labels:
          severity: warning
          scope: network-flow
          impact: degraded
        annotations:
          summary: pfSense IPFIX flow stream is silent
          description: >-
            The expected pfSense exporter is known to Akvorado but its UDP
            packet counter has not increased for ten minutes.
