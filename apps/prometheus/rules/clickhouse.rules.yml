# ClickHouse alert rules. Prometheus scrapes the native endpoint (:9363), which
# has no clickhouse_up series (that came from the retired standalone exporter).
groups:
  - name: ClickHouseExporter
    rules:
      - alert: ClickHouseDown
        expr: up{job="clickhouse"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: ClickHouse down
          description: ClickHouse instance is not responding to metrics scrape.
