---
groups:
  - name: TrueNASNodeExporter
    rules:
      - alert: TrueNASNodeExporterDown
        expr: up{job="truenas_node"} == 0
        for: 2m
        labels:
          severity: warning
          scope: telemetry
          impact: blind_spot
        annotations:
          summary: TrueNAS node-exporter telemetry is unavailable
          description: "Prometheus cannot scrape TrueNAS host metrics for more than 2 minutes."

      # MemAvailable excludes the ZFS ARC, which the kernel reclaims down to c_min; without ZFS metrics, fall back to MemAvailable.
      - alert: TrueNASHostOutOfMemory
        expr: |
          (
            node_memory_MemAvailable_bytes{job="truenas_node"}
            + (clamp_min(node_zfs_arc_size{job="truenas_node"} - node_zfs_arc_c_min{job="truenas_node"}, 0)
               or node_memory_MemAvailable_bytes{job="truenas_node"} * 0)
          ) / node_memory_MemTotal_bytes{job="truenas_node"} < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TrueNAS host memory is low
          description: "Less than 10% of host memory, counting reclaimable ZFS ARC, has remained available for 5 minutes."

      - alert: TrueNASHostMemoryCritical
        expr: |
          (
            node_memory_MemAvailable_bytes{job="truenas_node"}
            + (clamp_min(node_zfs_arc_size{job="truenas_node"} - node_zfs_arc_c_min{job="truenas_node"}, 0)
               or node_memory_MemAvailable_bytes{job="truenas_node"} * 0)
          ) / node_memory_MemTotal_bytes{job="truenas_node"} < 0.05
        for: 2m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: TrueNAS host memory is critically low
          description: "Less than 5% of host memory, counting reclaimable ZFS ARC, has remained available for 2 minutes."

      - alert: TrueNASHostIOPressureHigh
        expr: rate(node_pressure_io_stalled_seconds_total{job="truenas_node"}[15m]) > 0.30
        for: 30m
        labels:
          severity: warning
          scope: platform
        annotations:
          summary: TrueNAS disks are saturated
          description: "Every runnable task waited on IO more than 30% of the time for 30 minutes (PSI io full); App starts and probes slow down."

      - alert: TrueNASZpoolNotOnline
        expr: node_zfs_zpool_state{job="truenas_node",state!="online"} == 1
        for: 5m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "TrueNAS pool {{ $labels.zpool }} is {{ $labels.state }}"
          description: "ZFS pool {{ $labels.zpool }} has been {{ $labels.state }} for 5 minutes: check zpool status and the disks."

      - alert: TrueNASFilesystemSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{job="truenas_node",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|nsfs|tracefs|fusectl|autofs"}
            /
            node_filesystem_size_bytes{job="truenas_node",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|nsfs|tracefs|fusectl|autofs"}
          ) < 0.15
          and on(instance, device, mountpoint)
          node_filesystem_readonly{job="truenas_node"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: TrueNAS filesystem free space is low
          description: "Filesystem {{ $labels.mountpoint }} has less than 15% available space."

      - alert: TrueNASFilesystemSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{job="truenas_node",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|nsfs|tracefs|fusectl|autofs"}
            /
            node_filesystem_size_bytes{job="truenas_node",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|nsfs|tracefs|fusectl|autofs"}
          ) < 0.05
          and on(instance, device, mountpoint)
          node_filesystem_readonly{job="truenas_node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: TrueNAS filesystem free space is critical
          description: "Filesystem {{ $labels.mountpoint }} has less than 5% available space."

  # smartmon.prom and nvme.prom come from the workstation textfile collector (ansible-workstation).
  - name: WorkstationDisks
    rules:
      - alert: WorkstationSsdWearHigh
        expr: smartmon_wear_leveling_count_value{job="workstation_node"} < 20
        for: 1h
        labels:
          severity: warning
          scope: platform
        annotations:
          summary: "Worn SATA SSD {{ $labels.disk }} on the workstation"
          description: "Wear_Leveling_Count normalized value is {{ $value }} (33 on 13 Nov 2026): plan its replacement."

      - alert: WorkstationDiskSectorsFailing
        expr: |
          max by (disk) (
            smartmon_reallocated_sector_ct_raw_value{job="workstation_node"}
            or smartmon_current_pending_sector_raw_value{job="workstation_node"}
            or smartmon_offline_uncorrectable_raw_value{job="workstation_node"}
          ) > 0
        for: 5m
        labels:
          severity: warning
          scope: platform
        annotations:
          summary: "Failing sectors on workstation disk {{ $labels.disk }}"
          description: "Reallocated, pending or uncorrectable sectors: back up and replace the disk (lvconvert --repair for the RAID1)."

      - alert: WorkstationNvmeDegraded
        expr: nvme_critical_warning{job="workstation_node"} > 0 or nvme_media_errors_total{job="workstation_node"} > 0
        for: 5m
        labels:
          severity: critical
          scope: platform
        annotations:
          summary: "NVMe {{ $labels.device }} on the workstation reports a critical warning or media errors"
          description: "The NVMe holds /home, /workspace, /docker and the ollama models: back up now and check smartctl -a."
