---
x-nabla:
  deploymentUnit:
    probePolicy:
      rank: 8
      primaryEndpoint: component:default/prometheus
services:
  prometheus:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/prometheus
    image: prom/prometheus:${PROMETHEUS_IMG:-v3.13.2}
    container_name: prometheus
    restart: unless-stopped
    x-nabla:
      id: prometheus
      name: Prometheus
      kind: observability
      category: observability
      runtime:
        provider: truenas-app
        containerService: prometheus
      monitoring:
        type: http
        target: http://172.17.0.24:9090/-/ready
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: mimir
          type: storesIn
          strength: required
          description: Prometheus remote-writes collected metrics to Mimir for durable storage.
          evidence:
            - apps/prometheus/prometheus.yml:remote_write
      exposure:
        - name: public
          hostnames:
            - prometheus.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          probePath: "/-/ready"
          access:
            required: true
    user: "568:568" # TrueNAS apps user
    environment:
      - TZ=Europe/Paris
      - RETENTION_TIME=1d
      - RETENTION_SIZE=10G
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=${PROMETHEUS_LOG_LEVEL:-warn}"
    ports:
      - name: web # 30104
        target: 9090
        published: "${PROMETHEUS_PORT:-9090}"
        protocol: tcp
        app_protocol: http
    volumes:
      # Mount the config directory, not prometheus.yml as a single file. Git can
      # replace a tracked file inode during pull/rebase; a file bind would keep
      # the old inode inside the running container and make SIGHUP reload stale
      # configuration. The directory bind keeps replacements visible in place.
      - type: bind
        source: .
        target: /etc/prometheus
        read_only: true
      - /mnt/cpool/prometheus/data:/prometheus
      # Fail closed if the dedicated secret has not been provisioned.
      # Never create a directory at this file path.
      - type: bind
        source: /mnt/cpool/prometheus/secrets/fastapi-sample-metrics.key
        target: /run/secrets/fastapi-sample-metrics.key
        read_only: true
        bind:
          create_host_path: false
      # Provisioned by `just litellm-metrics-key-apply` before any redeploy.
      - type: bind
        source: /mnt/cpool/prometheus/secrets/litellm-metrics.key
        target: /run/secrets/litellm-metrics.key
        read_only: true
        bind:
          create_host_path: false
    # Prometheus joins the shared private Docker network so database metrics
    # such as InfluxDB can be scraped without publishing their full API on the
    # LAN. Host/LAN targets remain reachable through the Docker bridge route.
    networks:
      - intranet
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.prometheus-svc.rule=Host(`prometheus.int.albandrieu.com`)"
    #   - "traefik.http.routers.prometheus-svc.entrypoints=websecure"
    #   - "traefik.http.routers.prometheus-svc.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.prometheus-svc.service=prometheus"

  node-exporter:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/prometheus-node-exporter
    network_mode: bridge
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - --collector.filesystem.mount-points-exclude
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - 9100:9100
    # networks: ["traefik_network"]

  alertmanager:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/prometheus-alertmanager
    network_mode: bridge
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    restart: unless-stopped
    x-nabla:
      id: prometheus-alertmanager
      name: Alertmanager
      kind: alerting
      category: observability
      runtime:
        provider: truenas-app
        containerService: alertmanager
      monitoring:
        type: http
        target: http://172.17.0.24:9093/-/ready
        conditions:
          - "[STATUS] == 200"
    ports:
      - "172.17.0.24:9093:9093"
    volumes:
      - type: bind
        source: ./alertmanager.yml
        target: /etc/alertmanager/config.yml
        read_only: true
    # networks: ["traefik_network"]
    # Optional so a missing webhook never blocks the Prometheus redeploy.
    env_file:
      - path: /mnt/cpool/secrets/runtime/prometheus/.env.secrets
        required: false
    # Alertmanager reads secrets only from files: the wrapper writes the webhook to /tmp, mode 600.
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        printf '%s' "$$ALERTMANAGER_SLACK_WEBHOOK_URL" > /tmp/slack-webhook.url
        unset ALERTMANAGER_SLACK_WEBHOOK_URL
        [ -s /tmp/slack-webhook.url ] || echo "ALERTMANAGER_SLACK_WEBHOOK_URL is empty: Slack notifications will fail" >&2
        exec /bin/alertmanager "$$@"
      - alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      # Slack links otherwise point at the container hostname.
      - "--web.external-url=http://172.17.0.24:9093"

  # cAdvisor is intentionally not part of this TrueNAS Custom App. Its retained
  # manual definition lives in apps/cadvisor/disabled.yml. Historical
  # ix-prometheus-cadvisor-1 containers must become orphans so app.update can
  # remove them instead of marking Prometheus CRASHED for optional telemetry.

  pfsense-exporter:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/pfsense-exporter
    network_mode: bridge
    image: ghcr.io/pfrest/pfsense_exporter:${PFSENSE_EXPORTER_IMG:-v0.0.10}
    container_name: pfsense-exporter
    restart: unless-stopped
    x-nabla:
      id: pfsense-exporter
      name: pfSense Exporter
      kind: metrics-exporter
      category: observability
      runtime:
        provider: truenas-app
        containerService: pfsense-exporter
      monitoring:
        # Gatus/AutoKuma only verify the exporter listener. They must not call
        # /metrics because each health check would trigger another full pfREST
        # collector fan-out on the resource-constrained firewall.
        type: port
        target: tcp://172.17.0.24:9945
        conditions:
          - "[CONNECTED] == true"
      relations:
        - target: pfsense
          type: consumesApi
          strength: required
          description: The exporter queries pfSense for firewall and system metrics.
          evidence:
            - apps/prometheus/compose.yml:/mnt/cpool/prometheus/secrets/pfsense-exporter.yml
        - target: prometheus
          type: observedBy
          strength: required
          description: Prometheus scrapes the pfSense exporter.
          evidence:
            - apps/prometheus/prometheus.yml:job_name=pfsense_exporter
    volumes:
      - type: bind
        source: /mnt/cpool/prometheus/secrets/pfsense-exporter.yml
        target: /pfsense_exporter/config.yml
        read_only: true
        bind:
          # Fail closed: short bind syntax creates a directory when the source
          # file is absent, which makes pfSense Exporter restart forever with
          # "config.yml: is a directory".
          create_host_path: false
    ports:
      - "9945:9945"

networks:
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
