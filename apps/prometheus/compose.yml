---
secrets:
  litellm_api_key:
    file: ./secrets/litellm_api_key

services:
  prometheus:
    network_mode: bridge
    image: prom/prometheus:${PROMETHEUS_IMG:-latest}
    container_name: prometheus
    restart: unless-stopped
    x-nabla:
      id: prometheus
      name: Prometheus
      kind: observability
      category: observability
      runtime:
        provider: truenas-app
        containerService: prometheus
      relations:
        - target: mimir
          type: storesIn
          strength: required
          description: Prometheus remote-writes collected metrics to Mimir for durable storage.
          evidence:
            - apps/prometheus/prometheus.yml:remote_write
    user: "568:568" # TrueNAS apps user
    environment:
      - TZ=Europe/Paris
      - RETENTION_TIME=1d
      - RETENTION_SIZE=10G
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=${PROMETHEUS_LOG_LEVEL:-warn}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090" # 30104
    secrets:
      - source: litellm_api_key
        target: litellm_api_key
        mode: "0444"
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./rules
        target: /etc/prometheus/rules
        read_only: true
      - /mnt/cpool/prometheus/data:/prometheus
    # networks: ["traefik_network"]
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.prometheus-svc.rule=Host(`prometheus.int.albandrieu.com`)"
    #   - "traefik.http.routers.prometheus-svc.entrypoints=websecure"
    #   - "traefik.http.routers.prometheus-svc.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.prometheus-svc.service=prometheus"

  node-exporter:
    network_mode: bridge
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - 9100:9100
    # networks: ["traefik_network"]

  alertmanager:
    network_mode: bridge
    image: prom/alertmanager
    restart: unless-stopped
    ports:
      - "172.17.0.24:9093:9093"
    volumes:
      - type: bind
        source: ./alertmanager.yml
        target: /etc/alertmanager/config.yml
        read_only: true
    # networks: ["traefik_network"]
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"

  cadvisor:
    network_mode: bridge
    image: gcr.io/cadvisor/cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8089:8080
    # networks: ["traefik_network"]

  pfsense-exporter:
    network_mode: bridge
    image: ghcr.io/pfrest/pfsense_exporter:latest
    container_name: pfsense-exporter
    restart: unless-stopped
    x-nabla:
      id: pfsense-exporter
      name: pfSense Exporter
      kind: metrics-exporter
      category: observability
      runtime:
        provider: truenas-app
        containerService: pfsense-exporter
      relations:
        - target: pfsense
          type: consumesApi
          strength: required
          description: The exporter queries pfSense for firewall and system metrics.
          evidence:
            - apps/prometheus/compose.yml:exporter.config.yml
        - target: prometheus
          type: observedBy
          strength: required
          description: Prometheus scrapes the pfSense exporter.
          evidence:
            - apps/prometheus/prometheus.yml:job_name=pfsense_exporter
    volumes:
      - ./secrets/exporter.config.yml:/pfsense_exporter/config.yml:ro
    ports:
      - "9945:9945"

networks:
  traefik_network:
    external: true
