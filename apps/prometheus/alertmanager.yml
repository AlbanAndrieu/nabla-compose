---
route:
  receiver: slack
  group_by:
    - alertname
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Incoming webhook rather than a bot token: it can only post to its own channel.
  - name: slack
    slack_configs:
      # Written from ALERTMANAGER_SLACK_WEBHOOK_URL by the compose entrypoint.
      - api_url_file: /tmp/slack-webhook.url
        send_resolved: true
