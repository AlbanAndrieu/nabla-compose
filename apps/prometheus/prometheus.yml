# ------------ EXPORTERS & SERVICES - À AJOUTER pour observabilité complète -----------------
# scrutiny - metrics HTTP natif sur port web (ex :8080)
- job_name: 'scrutiny'
  static_configs:
    - targets: ['172.17.0.24:8080']
  metrics_path: /metrics

# telegraf - nécessite activations outputs.prometheus_client sur port 9273
- job_name: 'telegraf'
  static_configs:
    - targets: ['172.17.0.24:9273']

# nginx - nécessite activation stub_status + exporter officiel (port 9113)
- job_name: 'nginx'
  static_configs:
    - targets: ['172.17.0.24:9113']

# vaultwarden - nécessite déployer vaultwarden_exporter (port 9586, exporter non-officiel)
- job_name: 'vaultwarden'
  static_configs:
    - targets: ['172.17.0.24:9586']

# netalertx, ollama, langflow - pas de metrics exploitable à date
# Ajouter ici si une version ultérieure permet l'exposition Prometheus ou exporter.
