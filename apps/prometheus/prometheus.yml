---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: http://172.17.0.24:9009/api/v1/push

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 172.17.0.24:9093

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: grafana
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:30037

  - job_name: alloy
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:12345

  - job_name: loki
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:3100

  - job_name: mimir
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:9009

  - job_name: tempo
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:3200

  - job_name: alertmanager
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:9093

  - job_name: truenas_node
    static_configs:
      - targets:
          - 172.17.0.24:9100
        labels:
          platform: truenas
          role: storage-host

  # Workstation node_exporter (ansible-workstation playbooks/restic-backup.yml):
  # host metrics (CPU, memory, filesystems, ZFS, systemd units) for the OpenClaw
  # heartbeat plus the Restic last-success textfile. ufw admits only TrueNAS.
  - job_name: workstation_node
    static_configs:
      - targets:
          - 172.17.0.57:9100
        labels:
          platform: workstation
          role: workstation

  - job_name: kafka_exporter
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - 172.17.0.24:9308
        labels:
          platform: truenas
          role: message-broker-metrics

  - job_name: fastapi_sample
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    # Dedicated FastAPI identity. The credential is provisioned on TrueNAS
    # outside Git; never reuse DIAGNOSTICS_ACCESS_KEY.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fastapi-sample-metrics.key
    static_configs:
      - targets:
          - 172.17.0.24:8091
        labels:
          platform: truenas
          role: homelab-observer
          service: fastapi-sample

  - job_name: pyroscope
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 172.17.0.24:4040
        labels:
          platform: truenas
          role: continuous-profiler
          service: pyroscope

  - job_name: docling
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 172.17.0.24:5001
        labels:
          platform: truenas
          role: document-processing
          service: docling

  - job_name: n8n
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 172.17.0.24:30109
        labels:
          platform: truenas
          role: workflow-automation
          service: n8n

  - job_name: pihole_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:9617
        labels:
          platform: truenas
          role: dns-filter

  # operational_state=planned mirrors the Backstage label
  # albandrieu.com/operational-state of exporters not deployed yet. The
  # target stays scraped (visible as down) but NablaExporterTargetDown
  # ignores it; remove the label in the same change that deploys it.
  # Canonical homelab data-plane telemetry. Sybase is intentionally excluded:
  # the shared databases are PostgreSQL, Redis, ClickHouse, InfluxDB and
  # OpenSearch. Prefer private Docker-network endpoints where a database API
  # should not be exposed on the LAN solely for Prometheus.
  - job_name: postgres_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:9187
        labels:
          platform: truenas
          operational_state: planned
          role: database
          database: postgresql

  - job_name: redis_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis_exporter:9121
        labels:
          platform: truenas
          role: database
          database: redis

  - job_name: influxdb
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - influxdb:8086
        labels:
          platform: truenas
          role: database
          database: influxdb

  - job_name: pfsense_exporter
    metrics_path: /metrics
    # Netgate 1100 has a tight CPU/RAM budget. Each exporter scrape fans out
    # into multiple pfREST calls, so keep this intentionally much slower than
    # local exporters.
    scrape_interval: 300s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 172.17.0.1
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: __address__
        replacement: 172.17.0.24:9945
      - source_labels:
          - __param_target
        target_label: instance

  - job_name: akvorado_inlet
    metrics_path: /api/v0/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:31057
        labels:
          platform: truenas
          role: network-flow-inlet

  - job_name: akvorado_outlet
    metrics_path: /api/v0/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:31058
        labels:
          platform: truenas
          role: network-flow-outlet

  # Hermes LiteLLM cost + usage: scrape ONLY its key alias, drop personal
  # identity/IP labels before remote_write to Mimir. No prompt or response content.
  # Validate LiteLLM /metrics endpoint and alias before runtime acceptance.
  - job_name: litellm_hermes
    scrape_interval: 60s
    scrape_timeout: 10s
    metrics_path: /metrics
    # LiteLLM requires a proxy admin or a key allowed on /metrics: this one is
    # limited to that route (scripts/truenas/ensure-litellm-metrics-key.py).
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm-metrics.key
    static_configs:
      - targets:
          - 172.17.0.24:4000
        labels:
          platform: truenas
          service: hermes
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "litellm_(spend_metric|total_tokens_metric|input_tokens_metric|output_tokens_metric|api_key_max_budget_metric)"
        action: keep
      - source_labels: [api_key_alias]
        regex: hermes
        action: keep
      - action: labeldrop
        regex: "hashed_api_key|user_email|client_ip|user|end_user|user_agent|team|team_alias"

  - job_name: gatus
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:8085

  - job_name: keycloak
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:30239
        labels:
          platform: truenas
          role: identity-provider

  # Dependency-Track API server (ALPINE_METRICS_ENABLED) on its LAN port.
  - job_name: dependency_track
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets:
          - 172.17.0.24:31083
        labels:
          platform: truenas
          role: software-supply-chain

  # NetBox (METRICS_ENABLED) on its LAN web port.
  - job_name: netbox
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets:
          - 172.17.0.24:31082
        labels:
          platform: truenas
          role: network-source-of-truth

  # *arr media stack (docs/arr-media-library-roadmap.md). Exporters join the
  # intranet network; Jellyfin exposes native /metrics (EnableMetrics) on its
  # LAN port. operational_state=planned until each App is deployed and active.
  - job_name: exportarr_prowlarr
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - prowlarr-exporter:9707
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: prowlarr

  - job_name: exportarr_radarr
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - radarr-exporter:9707
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: radarr

  - job_name: exportarr_sonarr
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - sonarr-exporter:9707
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: sonarr

  - job_name: exportarr_lidarr
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - lidarr-exporter:9707
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: lidarr

  - job_name: exportarr_bazarr
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets:
          - bazarr-exporter:9707
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: bazarr

  - job_name: qbittorrent
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - qbittorrent-exporter:8090
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: qbittorrent

  - job_name: jellyfin
    metrics_path: /metrics
    scrape_interval: 60s
    static_configs:
      - targets:
          - 172.17.0.24:30013
        labels:
          platform: truenas
          operational_state: planned
          role: media
          app: jellyfin

  - job_name: crowdsec
    static_configs:
      - targets:
          - 172.17.0.24:6060

  # --metrics.prometheus without its own entrypoint serves /metrics on the API
  # entrypoint (:8080); traefik.rules.yml needs traefik_service_server_up from here.
  - job_name: traefik
    static_configs:
      - targets:
          - 172.17.0.24:8080
        labels:
          platform: truenas

  # This exporter is intentionally a pfSense HAProxy observer. Its scrape input
  # is configured by PFSENSE_HAPROXY_SCRAPE_URI in apps/haproxy-exporter.
  - job_name: haproxy
    static_configs:
      - targets:
          - 172.17.0.24:9101
        labels:
          platform: truenas
          operational_state: planned

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.17.0.24:9363
        labels:
          platform: truenas
          role: database
          database: clickhouse

  - job_name: opensearch
    static_configs:
      - targets:
          - 172.17.0.24:9114
        labels:
          platform: truenas
          operational_state: planned
          role: database
          database: opensearch

  - job_name: opensearch-security
    static_configs:
      - targets:
          - 172.17.0.24:9115
        labels:
          platform: truenas
          operational_state: planned
          role: database
          database: opensearch-security
