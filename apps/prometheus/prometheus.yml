---
global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: http://172.17.0.24:9009/api/v1/push

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 172.17.0.24:9093

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: grafana
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:30037

  - job_name: alloy
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:12345

  - job_name: loki
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:3100

  - job_name: mimir
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:9009

  - job_name: tempo
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:3200

  - job_name: alertmanager
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:9093

  - job_name: truenas_node
    static_configs:
      - targets:
          - 172.17.0.24:9100
        labels:
          platform: truenas
          role: storage-host

  - job_name: kafka_exporter
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - 172.17.0.24:9308
        labels:
          platform: truenas
          role: message-broker-metrics

  - job_name: fastapi_sample
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 172.17.0.24:8091
        labels:
          platform: truenas
          role: homelab-observer
          service: fastapi-sample

  - job_name: pyroscope
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 172.17.0.24:4040
        labels:
          platform: truenas
          role: continuous-profiler
          service: pyroscope

  - job_name: docling
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 172.17.0.24:5001
        labels:
          platform: truenas
          role: document-processing
          service: docling

  - job_name: n8n
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 172.17.0.24:30109
        labels:
          platform: truenas
          role: workflow-automation
          service: n8n

  - job_name: pihole_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:9617
        labels:
          platform: truenas
          role: dns-filter

  # Canonical homelab data-plane telemetry. Sybase is intentionally excluded:
  # the shared databases are PostgreSQL, Redis, ClickHouse, InfluxDB and
  # OpenSearch. Prefer private Docker-network endpoints where a database API
  # should not be exposed on the LAN solely for Prometheus.
  - job_name: postgres_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:9187
        labels:
          platform: truenas
          role: database
          database: postgresql

  - job_name: redis_exporter
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis_exporter:9121
        labels:
          platform: truenas
          role: database
          database: redis

  - job_name: influxdb
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - influxdb:8086
        labels:
          platform: truenas
          role: database
          database: influxdb

  - job_name: pfsense_exporter
    metrics_path: /metrics
    # Netgate 1100 has a tight CPU/RAM budget. Each exporter scrape fans out
    # into multiple pfREST calls, so keep this intentionally much slower than
    # local exporters.
    scrape_interval: 300s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 172.17.0.1
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: __address__
        replacement: 172.17.0.24:9945
      - source_labels:
          - __param_target
        target_label: instance

  - job_name: akvorado_inlet
    metrics_path: /api/v0/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:31057
        labels:
          platform: truenas
          role: network-flow-inlet

  - job_name: akvorado_outlet
    metrics_path: /api/v0/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 172.17.0.24:31058
        labels:
          platform: truenas
          role: network-flow-outlet

  - job_name: gatus
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:8085

  - job_name: keycloak
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - 172.17.0.24:30239
        labels:
          platform: truenas
          role: identity-provider

  - job_name: crowdsec
    static_configs:
      - targets:
          - 172.17.0.24:6060

  # This exporter is intentionally a pfSense HAProxy observer. Its scrape input
  # is configured by PFSENSE_HAPROXY_SCRAPE_URI in apps/haproxy-exporter.
  - job_name: haproxy
    static_configs:
      - targets:
          - 172.17.0.24:9101

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.17.0.24:9363
        labels:
          platform: truenas
          role: database
          database: clickhouse

  - job_name: opensearch
    static_configs:
      - targets:
          - 172.17.0.24:9114
        labels:
          platform: truenas
          role: database
          database: opensearch

  - job_name: opensearch-security
    static_configs:
      - targets:
          - 172.17.0.24:9115
        labels:
          platform: truenas
          role: database
          database: opensearch-security
