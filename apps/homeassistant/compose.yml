---
name: homeassistant
services:
  homeassistant:
    container_name: homeassistant
    # Same release and digest as the native TrueNAS App it replaces, so the
    # cutover changes the runtime owner, not the Home Assistant version.
    image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
    x-nabla:
      id: homeassistant
      name: Home Assistant UI
      kind: home-automation
      category: automation
      presentationRole: service
      criticality: medium
      description: Home automation control plane exposed through the dedicated IoT network.
      runtime:
        provider: truenas-app
        containerService: homeassistant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Bridge networking (owner decision 2026-11-06): the container reaches the
    # shared PostgreSQL on 172.17.0.24:5432, which a macvlan container cannot
    # (it was bound to the TrueNAS host address itself). Multicast discovery of
    # IoT devices is not available on a bridge: integrations must use explicit
    # host addresses.
    networks:
      intranet:
      traefik:
    ports:
      - target: 8123
        published: 8123
        host_ip: 172.17.0.24
        protocol: tcp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /mnt/storage0/home-assistant/config:/config
    labels:
      - "com.albandrieu.nabla.entity-ref=component:default/homeassistant"
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.albanandrieu.com`)"
      - "traefik.http.routers.homeassistant.entrypoints=https"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.routers.homeassistant.tls.certresolver=cloudflare"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"

networks:
  intranet:
    external: true
    name: intranet
  traefik:
    external: true
