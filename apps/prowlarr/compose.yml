---
# Prowlarr of the *arr media stack (status planned).
# Design and acceptance: docs/arr-media-library-roadmap.md
name: prowlarr

services:
  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:2.7.0@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    restart: unless-stopped
    x-nabla:
      id: prowlarr
      name: Prowlarr
      kind: indexer-manager
      category: media
      status: planned
      presentationRole: service
      criticality: low
      description: >-
        Indexer manager of the media stack. Every outbound indexer request goes through the authenticated Gluetun HTTP proxy, so searches fail closed when the VPN is down.
      url: https://prowlarr.int.albandrieu.com
      internalUrl: http://prowlarr:9696
      runtime:
        provider: truenas-app
        containerService: prowlarr
      lifecycle:
        phase: applications
        priority: 72
      monitoring:
        type: http
        target: http://172.17.0.24:30050/ping
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: gluetun
          type: dependsOn
          strength: required
          description: Prowlarr sends indexer traffic only through the Gluetun HTTP proxy (Settings > General > Proxy).
          evidence:
            - docs/arr-media-library-roadmap.md:P3 proxy gluetun:8888
        - target: radarr
          type: consumesApi
          strength: optional
          description: Prowlarr pushes synchronized indexers to Radarr (Full Sync).
          evidence:
            - docs/arr-media-library-roadmap.md:P3 Full Sync
        - target: sonarr
          type: consumesApi
          strength: optional
          description: Prowlarr pushes synchronized indexers to Sonarr (Full Sync).
          evidence:
            - docs/arr-media-library-roadmap.md:P3 Full Sync
        - target: lidarr
          type: consumesApi
          strength: optional
          description: Prowlarr pushes synchronized indexers to Lidarr (Full Sync).
          evidence:
            - docs/arr-media-library-roadmap.md:P3 Full Sync
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik exposes the UI only through prowlarr.int.albandrieu.com.
          evidence:
            - apps/prowlarr/compose.yml:traefik.http.routers.prowlarr
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web
    security_opt:
      - no-new-privileges:true
    env_file:
      # PROWLARR__AUTH__APIKEY from Vaultwarden item nabla/prod/prowlarr; never committed.
      - /mnt/cpool/secrets/runtime/prowlarr/.env.secrets
    environment:
      PUID: "568"
      PGID: "568"
      UMASK: "002"
      TZ: Europe/Paris
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: Enabled
      PROWLARR__LOG__ANALYTICSENABLED: "False"
    ports:
      - name: web
        target: 9696
        published: "30050"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/prowlarr/config:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:9696/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      com.albandrieu.nabla.entity-ref: component:default/prowlarr
      com.albandrieu.nabla.logs: media
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.prowlarr.rule: Host(`prowlarr.int.albandrieu.com`)
      traefik.http.routers.prowlarr.entrypoints: websecure
      traefik.http.routers.prowlarr.tls.certresolver: letsencrypt
      traefik.http.routers.prowlarr.service: prowlarr
      traefik.http.services.prowlarr.loadbalancer.server.port: "9696"
    networks:
      - media
      - traefik_network

  prowlarr-exporter:
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: prowlarr-exporter
    restart: unless-stopped
    command:
      - prowlarr
    x-nabla:
      id: prowlarr-exporter
      name: Prowlarr exporter
      kind: metrics-exporter
      category: observability
      status: planned
      presentationRole: support
      criticality: low
      description: >-
        Exportarr metrics for Prowlarr (library, queue, health issues) scraped
        by Prometheus over the intranet network.
      runtime:
        provider: truenas-app
        containerService: prowlarr-exporter
      lifecycle:
        phase: applications
        priority: 90
      relations:
        - target: prowlarr
          type: consumesApi
          strength: required
          description: The exporter reads the Prowlarr API with the instance API key.
          evidence:
            - apps/prowlarr/compose.yml:URL=http://prowlarr:9696
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes prowlarr-exporter:9707 (job exportarr_prowlarr).
          evidence:
            - apps/prometheus/prometheus.yml:job_name=exportarr_prowlarr
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      # API_KEY: same Vaultwarden field as the Prowlarr instance key.
      - /mnt/cpool/secrets/runtime/prowlarr/.env.secrets
    environment:
      PORT: "9707"
      URL: http://prowlarr:9696
      LOG_LEVEL: info
    labels:
      com.albandrieu.nabla.entity-ref: component:default/prowlarr-exporter
      com.albandrieu.nabla.logs: media
      com.albandrieu.nabla.healthcheck: prometheus-up
    networks:
      - media
      - intranet

networks:
  media:
    external: true
    name: media
  traefik_network:
    external: true
    name: traefik_network
  intranet:
    external: true
    name: intranet
