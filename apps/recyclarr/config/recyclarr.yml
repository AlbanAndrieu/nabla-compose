# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# Recyclarr configuration of the *arr media stack (status planned).
#
# Source: official recyclarr/config-templates (master, fetched 2026-11-08):
#   radarr/templates/french-multi-vf-hd-bluray-web.yml
#   sonarr/templates/french-multi-vf-bluray-web-1080p.yml
# Profiles: TRaSH [French MULTi.VF] HD (French audio preferred, original kept).
# Switch to the french-multi-vo-* or french-vostfr-* templates to prefer the
# original audio. Review every change in a PR: Recyclarr rewrites quality
# profiles and custom-format scores in Radarr and Sonarr.
#
# API keys come from the runtime env file (RADARR_API_KEY, SONARR_API_KEY);
# never write a key in this file.
################################################################################
## TRaSH Guides: [French MULTi.VF] HD Bluray + WEB
##
## https://trash-guides.info/Radarr/radarr-setup-quality-profiles-french-en/#hd-
## bluray-web-1080p
################################################################################

radarr:
  french-multi-vf-hd-bluray-web:
    base_url: !env_var RADARR_BASE_URL http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 500ecc23572575511fd81893777d1e06 # [French MULTi.VF] HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      ################################################################################
      ## Uncommented groups are synced by default. They are listed here so you can
      ## adjust which CFs they include. Commented groups are NOT synced; uncomment one
      ## to enable it.
      ##
      ## Within a group, uncomment a line under `select:` to turn an optional CF on,
      ## or under `exclude:` to turn a default CF off. Required CFs are always
      ## included and are not listed.
      ##
      ## To uncomment, remove `# ` (hash + space) so that indentation stays aligned.
      ## Most editors do this automatically with toggle-comment (Ctrl+/).
      ##
      ## https://recyclarr.dev/guide/cf-groups/
      ################################################################################
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
          # Mutually exclusive: enable only one of the following.
          exclude:
            # - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
          select:
            # - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
        - trash_id: 59f7ab9ff64d0026b011b985b1cc8670 # [Unwanted] Unwanted Formats French
          exclude:
            # - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            # - cae4ca30163749b891686f95532519bd  # AV1
