# Hermes gateway (read-only DevSecOps profile). Replaces the native TrueNAS
# App hermes-agent, which is to be removed: never run both with the same
# Telegram/Discord bot tokens.
# Run ONLY with --profile hermes after a runtime security preflight
# (scripts/hermes/preflight.py --check).
name: hermes
services:
  hermes:
    profiles: [hermes]
    image: ${HERMES_IMAGE_REF:-nousresearch/hermes-agent:stable}
    container_name: hermes
    x-nabla:
      id: hermes
      name: Hermes Agent
      kind: ai-agent-gateway
      category: ai
      presentationRole: service
      criticality: low
      status: planned
      description: Read-only DevSecOps agent gateway for Telegram/Discord, limited to the nabla_observe MCP.
      runtime:
        provider: truenas-app
        containerService: hermes
      relations:
        - target: litellm
          type: consumesApi
          strength: required
          description: Hermes sends model requests to LiteLLM with its dedicated hermes virtual key.
          evidence:
            - config/hermes/config.yaml:model.base_url
            - config/hermes/litellm-key-policy.json:key_alias
        - target: prometheus
          type: consumesApi
          strength: optional
          description: The read-only nabla_observe MCP queries allowlisted Prometheus aggregates and Hermes LiteLLM cost.
          evidence:
            - scripts/hermes/readonly_mcp.py:PROMETHEUS_URL
    labels:
      com.albandrieu.nabla.entity-ref: component:default/hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    # The official image starts an s6 supervisor and drops gateway execution to
    # UID 10000. Check /proc effective IDs, do not assume image USER=root means
    # the agent runs as root. Do not override entrypoint before smoke testing.
    # s6 starts as root and must drop privileges to UID 10000. Explicitly
    # keep only the bootstrap UID/GID/ownership capabilities; confirm the
    # gateway's effective UID/CapEff are zero/non-root respectively at runtime.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    environment:
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: "0"
      API_SERVER_ENABLED: "false"
      HERMES_SKIP_CONFIG_MIGRATION: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    env_file:
      - path: /mnt/cpool/secrets/runtime/hermes/.env.secrets
        required: true
    volumes:
      # Host state lives in /mnt/cpool/hermes/data (UID 10000, mode 0700),
      # mounted at the image's HERMES_HOME. Create it explicitly; never point
      # this at /mnt/cpool/hermes itself, which still holds legacy files.
      - type: bind
        source: /mnt/cpool/hermes/data
        target: /opt/data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/compose/nabla-compose/config/hermes/config.yaml
        target: /opt/data/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/cpool/compose/nabla-compose/scripts/hermes/readonly_mcp.py
        target: /opt/hermes-policy/readonly_mcp.py
        read_only: true
        bind:
          create_host_path: false
    # No host ports / dashboard / admin API. Outgoing Telegram/Discord and
    # LiteLLM/Prometheus need an explicit host firewall egress policy at cutover.
    # An ordinary Docker bridge does NOT enforce deny-by-default egress.
    networks: [hermes]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
networks:
  hermes:
    driver: bridge
