---
services:
  opensearch:
    image: docker.io/langflowai/openrag-opensearch:${OPENRAG_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: docker.io/langflowai/openrag-opensearch:${OPENRAG_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-openrag}-opensearch
    x-nabla:
      id: opensearch
      name: OpenSearch
      kind: search
      category: data
      runtime:
        provider: truenas-app
        containerService: opensearch
    env_file:
      - /mnt/cpool/compose/nabla-compose/apps/opensearch/.env
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENRAG_BACKEND_PORT=${OPENRAG_BACKEND_PORT:-8000}
      - OPENRAG_BACKEND_HOST=${OPENRAG_BACKEND_HOST:-openrag-backend}
      - OPENRAG_BACKEND_INTERNAL_URL=${OPENRAG_BACKEND_INTERNAL_URL:-http://${OPENRAG_BACKEND_HOST:-openrag-backend}:${OPENRAG_BACKEND_PORT:-8000}}
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    volumes:
      - /mnt/cpool/opensearch/data:/usr/share/opensearch/data
    stop_grace_period: 2m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --show-error --insecure --user "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" https://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"''',
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      intranet:
        aliases:
          - opensearch

  opensearch-security:
    image: docker.io/opensearchproject/opensearch:2.19.5
    container_name: opensearch-security
    hostname: opensearch-security
    restart: unless-stopped
    x-nabla:
      id: opensearch-security
      name: OpenSearch Security
      kind: search
      category: security
      runtime:
        provider: truenas-app
        containerService: opensearch-security
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      discovery.type: single-node
    ports:
      - "127.0.0.1:${OPENSEARCH_SECURITY_PORT:-9201}:9200"
    volumes:
      - /mnt/cpool/opensearch-security/data:/usr/share/opensearch/data
    networks:
      - security
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  dashboards:
    image: docker.io/opensearchproject/opensearch-dashboards:3.6.0
    container_name: ${COMPOSE_PROJECT_NAME:-openrag}-dashboards
    x-nabla:
      id: opensearch-dashboards
      name: OpenSearch Dashboards
      kind: application
      category: data
      runtime:
        provider: truenas-app
        containerService: dashboards
      relations:
        - target: opensearch
          type: dependsOn
          strength: required
          description: OpenSearch Dashboards queries the OpenRAG OpenSearch cluster.
          evidence:
            - apps/opensearch/compose.yml:OPENSEARCH_HOSTS
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_HOSTS: '["https://${OPENSEARCH_HOST:-opensearch}:${OPENSEARCH_INTERNAL_PORT:-9200}"]'
      OPENSEARCH_USERNAME: "${OPENSEARCH_USERNAME:-admin}"
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
  security:
    external: true
    name: nabla-security
