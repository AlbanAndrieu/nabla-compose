---
services:
  autoxpose:
    image: mostafawahied/autoxpose:0.4.2
    container_name: autoxpose
    restart: unless-stopped
    user: "568:568" # TrueNAS apps user
    ports:
      - "4949:3000" # host:container
    environment:
      - UID=568
      - GID=568
      - SERVER_IP=${SERVER_IP:-82.66.4.247} # public IP used for DNS A records
      - LAN_IP=${LAN_IP:-172.17.0.24} # private host IP used by optional proxy providers
      # Reuse the host-wide read-only proxy from the root compose project.
      # Do not publish a second unauthenticated Docker API on the LAN.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - /mnt/cpool/autoxpose:/app/packages/backend/data
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
