---
services:
  autoxpose:
    image: mostafawahied/autoxpose:0.4.2
    container_name: autoxpose
    restart: unless-stopped
    x-nabla:
      id: autoxpose
      name: AutoXpose
      kind: application
      category: networking
      description: Docker-aware public exposure reconciler for explicitly opted-in services.
      monitoring:
        type: http
        target: http://172.17.0.24:4949/api/settings/status
        conditions:
          - "[STATUS] == 200"
    user: "568:568" # TrueNAS apps user
    ports:
      - "4949:3000" # host:container
    environment:
      - UID=568
      - GID=568
      - SERVER_IP=${SERVER_IP:-82.66.4.247} # public IP used for DNS A records
      - LAN_IP=${LAN_IP:-172.17.0.24} # private host IP used by optional proxy providers
      # Reuse the host-wide read-only proxy from the root compose project.
      # Do not publish a second unauthenticated Docker API on the LAN.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - /mnt/cpool/autoxpose:/app/packages/backend/data
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/api/settings/status")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  intranet:
    external: true
    name: intranet
