---
x-nabla:
  deploymentUnit:
    probePolicy:
      rank: 10
      primaryEndpoint: component:default/n8n
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    x-nabla:
      id: n8n
      name: n8n
      kind: workflow
      category: automation
      status: active
      runtime:
        provider: truenas-app
        containerService: n8n
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: n8n is configured with PostgreSQL credentials for workflow persistence.
          evidence:
            - apps/n8n/compose.yml:DB_POSTGRESDB_USER
        - target: redis
          type: dependsOn
          strength: optional
          description: n8n is configured with Redis credentials for queue-backed execution.
          evidence:
            - apps/n8n/compose.yml:N8N_REDIS_PASSWORD
        - target: litellm
          type: consumesApi
          strength: required
          description: n8n AI workflows call LiteLLM through credentials stored in the n8n database.
          evidence:
            - operator:2026-11-12:n8n credentials target LiteLLM
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik routes HTTPS traffic to n8n.
          evidence:
            - apps/n8n/compose.yml:traefik.http.routers.n8n
        - target: prometheus
          type: observedBy
          strength: optional
          description: n8n exposes metrics for Prometheus scraping.
          evidence:
            - apps/n8n/compose.yml:prometheus.scrape
      exposure:
        - name: public
          hostnames:
            - n8n.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
          riskAcceptance:
            id: n8n-public-webhook
            status: accepted
            reason: "n8n currently needs a public webhook path for integrations such as Slack. A broad Cloudflare Access bypass/Everyone policy is intentionally treated as a red security exception; narrow it to the webhook path or replace it with Service Auth."
            control: narrow-access-bypass-to-webhook-path
            reviewAfter: null
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - com.albandrieu.nabla.entity-ref=component:default/n8n
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.int.albandrieu.com`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.services.n8n.loadbalancer.server.scheme=https"
      - prometheus.scrape=true
      - prometheus.port=5678
    ports:
      - name: web
        target: 5678
        published: "30109"
        protocol: tcp
        app_protocol: http
    environment:
      DOMAIN_NAME: albandrieu.com
      SUBDOMAIN: n8n
      WEBHOOK_TUNNEL_URL: "https://n8n.albandrieu.com"
      N8N_HOST: n8n.albandrieu.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_RUNNERS_ENABLED: true

      QUEUE_HEALTH_CHECK_ACTIVE: true
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true

      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: true
      N8N_PUBLIC_API_DISABLED: false
      # N8N_PUBLIC_API_SWAGGERUI_DISABLED: true
      N8N_DIAGNOSTICS_ENABLED: false
      N8N_VERSION_NOTIFICATIONS_ENABLED: false
      N8N_METRICS: true
      WEBHOOK_URL: https://n8n.albandrieu.com/
      N8N_PROXY_HOPS: 1

      N8N_INTERNAL_API_KEY: ${N8N_API_KEY}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
      N8N_REDIS_PASSWORD: ${REDIS_AUTH}
