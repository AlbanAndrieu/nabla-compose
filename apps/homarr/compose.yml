---
x-nabla:
  nodes:
    - id: docker
      name: Docker
      kind: container-runtime
      category: infrastructure
      presentationRole: core
      description: Docker engine hosting the TrueNAS Compose workloads.
    - id: truenas
      name: TrueNAS
      kind: storage-platform
      category: infrastructure
      presentationRole: core
      url: https://truenas.albandrieu.com:7000
      description: TrueNAS SCALE storage and application host.
  relations:
    - source: docker
      target: truenas
      type: hostedBy
      strength: required
      description: Docker runtime is hosted on the TrueNAS platform.

services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.76.2
    container_name: homarr
    x-nabla:
      id: homarr
      name: Homarr
      kind: dashboard
      category: operations
      url: http://172.17.0.24:30100
      description: Homelab application dashboard generated from the Nabla service inventory.
      runtime:
        provider: truenas-app
        containerService: homarr
      relations:
        - target: docker
          type: consumesApi
          strength: optional
          description: Homarr discovers and manages containers through the read-only Docker socket proxy.
          evidence:
            - apps/homarr/compose.yml:DOCKER_HOSTNAMES
    restart: unless-stopped
    env_file:
      - /mnt/cpool/homarr/.env.secrets
    environment:
      PUID: ${PUID:-568}
      PGID: ${PGID:-568}
      DOCKER_HOSTNAMES: docker-socket-proxy
      DOCKER_PORTS: "2375"
    ports:
      - "172.17.0.24:30100:7575"
    volumes:
      - /mnt/cpool/homarr:/appdata
      - ./generated:/config/nabla:ro
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  homarr-sync:
    image: docker.io/library/python:3.13-alpine
    container_name: homarr-sync
    x-nabla:
      id: homarr-sync
      name: Homarr Reconciler
      kind: configuration-reconciler
      category: operations
      description: Non-destructively reconciles generated Nabla applications through the Homarr API.
      runtime:
        provider: truenas-app
        containerService: homarr-sync
      relations:
        - target: homarr
          type: consumesApi
          strength: required
          description: Reconciles generated application desired state through the Homarr OpenAPI endpoints.
          evidence:
            - apps/homarr/sync.py:/api/apps
    restart: "no"
    depends_on:
      - homarr
    env_file:
      - /mnt/cpool/homarr/.env.secrets
    environment:
      HOMARR_BASE_URL: http://homarr:7575
      HOMARR_MANIFEST: /config/nabla/apps.json
      HOMARR_SYNC_STATE: /state/homarr-map.json
      HOMARR_SYNC_DRY_RUN: ${HOMARR_SYNC_DRY_RUN:-false}
      HOMARR_BOARD_ENABLED: ${HOMARR_BOARD_ENABLED:-true}
      HOMARR_BOARD_NAME: ${HOMARR_BOARD_NAME:-Nabla}
      HOMARR_BOARD_COLUMNS: ${HOMARR_BOARD_COLUMNS:-12}
      HOMARR_BOARD_PUBLIC: ${HOMARR_BOARD_PUBLIC:-false}
    command:
      - python
      - /opt/nabla/sync.py
    volumes:
      - ./generated:/config/nabla:ro
      - ./sync.py:/opt/nabla/sync.py:ro
      - /mnt/cpool/homarr/sync:/state
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
