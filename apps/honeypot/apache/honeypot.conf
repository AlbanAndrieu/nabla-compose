# Project Honey Pot reports REMOTE_ADDR. Direct cloudflared peers currently use
# 10.200.0.0/16. Through the reviewed Traefik ingress, the Apache peer is
# traefik_network 172.16.56.0/24; Traefik accepts CF-Connecting-IP only from
# its own cloudflared network 10.200.2.0/24 and only that peer reaches the
# honeypot router. Both runtime subnets must be revalidated before the cutover.
# Do not use these Apache logs alone as a trustworthy banning source: direct
# Docker-network peers may forge headers. Bans rely on Traefik/CrowdSec logs.
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 10.200.0.0/16
RemoteIPInternalProxy 172.16.56.0/24

ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
  DocumentRoot /var/www/html
  # / still runs the original Project Honey Pot script on real visits.
  # /login is a static decoy with NO submitted credential fields.
  # POST /login is denied by Apache before PHP can receive any request body.
  DirectoryIndex keywaspish.php
  Alias /honeypot/keywaspish.php /var/www/html/keywaspish.php
  Alias /login /opt/honeypot/static/login.html
  <Directory /opt/honeypot/static>
    Require all granted
    Options -Indexes -FollowSymLinks
    AllowOverride None
  </Directory>
  <Location "/login">
    LimitRequestBody 1024
    <LimitExcept GET HEAD>
      Require all denied
    </LimitExcept>
  </Location>
  ErrorLog ${APACHE_LOG_DIR}/error.log
  # Do not log query strings, cookies, forms or User-Agent. IP, method, PATH
  # and status are enough for a bounded security signal and retention window.
  LogFormat "%a %t %m %U %H %>s %b" honeypot_metadata
  # Keep /healthz probes visible to Docker/Gatus health, but not in access logs.
  # They are neither visitors nor attacks (30-second Docker healthcheck).
  SetEnvIf Request_URI "^/healthz$" honeypot_skip_health_log
  CustomLog ${APACHE_LOG_DIR}/access.log honeypot_metadata env=!honeypot_skip_health_log
</VirtualHost>
