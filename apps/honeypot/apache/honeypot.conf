# The script reports REMOTE_ADDR to Project Honey Pot. Public visitors arrive through the
# cloudflared catalog App (TrueNAS Docker pool 10.200.0.0/16, never the LAN 172.17.0.0/24),
# so only that pool may set the client address; direct LAN clients keep their own.
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
RemoteIPHeader CF-Connecting-IP
RemoteIPInternalProxy 10.200.0.0/16

ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
  DocumentRoot /var/www/html
  # Only / and the workstation-era URL run the script (each run reports to Project Honey Pot);
  # scanner paths stay 404.
  DirectoryIndex keywaspish.php
  Alias /honeypot/keywaspish.php /var/www/html/keywaspish.php
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
