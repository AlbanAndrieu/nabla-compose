<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
  <title>Espace réservé · Contrôle d'accès</title>
  <style>
    :root {color-scheme: light dark; font-family: system-ui, sans-serif}
    body {margin: 0; min-height: 100vh; display: grid; place-items: center;
          background: #111827; color: #f9fafb}
    main {max-width: 25rem; width: 88%; padding: 2rem; background: #1f2937;
          border: 1px solid #374151; border-radius: 1rem}
    h1 {font-size: 1.4rem}
    label {display: block; margin-top: 1rem}
    input {width: 100%; box-sizing: border-box; margin-top: .35rem;
           padding: .75rem; border: 1px solid #6b7280; border-radius: .4rem;
           background: #111827; color: #f9fafb}
    button {margin-top: 1.5rem; padding: .7rem 1.25rem; cursor: pointer;
            border: 0; border-radius: .4rem; color: #fff; background: #2563eb}
    small {display: block; margin-top: 1.4rem; line-height: 1.5; color: #d1d5db}
  </style>
</head>
<body>
  <main>
    <h1>Accès réservé</h1>
    <p>Veuillez confirmer votre accès.</p>
    <!-- Deliberately NO name= attributes: the browser submits zero credentials. -->
    <form method="post" action="/login" autocomplete="off">
      <label>Identifiant <input type="text" autocomplete="off" placeholder="Identifiant"></label>
      <label>Mot de passe <input type="password" autocomplete="off" placeholder="Mot de passe"></label>
      <button type="submit">Connexion</button>
    </form>
    <small>Environnement de simulation de sécurité, sans authentification réelle.
      N'utilisez pas d'identifiants personnels ou professionnels.</small>
  </main>
</body>
</html>
