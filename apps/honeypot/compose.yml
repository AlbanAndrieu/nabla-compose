---
name: honeypot

# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  honeypot:
    logging: *nabla-logging
    image: php:8.4.27-apache@sha256:884f64b47174de2c0e813270fe7b24a18605729fcebe201302d98c38805530d0
    container_name: honeypot
    x-nabla:
      id: honeypot
      name: Project Honey Pot
      kind: security-agent
      category: security
      presentationRole: support
      criticality: low
      status: active
      securityFunctions:
        - detect
      description: Project Honey Pot address distribution script, moved from the workstation Apache.
      runtime:
        provider: truenas-app
        containerService: honeypot
      monitoring:
        type: port
        host: 172.17.0.24
        port: 31090
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web
        - name: public
          hostnames:
            - login.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          # Every hit on / is reported to Project Honey Pot: outside-in probes read the static page.
          probePath: /healthz
          access:
            # Address harvesters must reach the page: an Access login would hide it from them.
            required: false
          riskAcceptance:
            id: honeypot-login-public-trap
            status: accepted
            reason: "login.albandrieu.com publishes the Project Honey Pot trap page through the Cloudflare tunnel without Access, so address harvesters reach it (owner decision 20/11/2026). The container holds no data and runs read-only as www-data, without capabilities, on its own network; only the trap script, /healthz and credential-free /login decoy answer; POST /login returns 403 without PHP processing; other paths remain 404."
            control: isolated-read-only-trap-no-data
            reviewAfter: null
    labels:
      com.albandrieu.nabla.entity-ref: component:default/honeypot
      # Prepared public hostname, INACTIVE until the Cloudflare Tunnel opt-in.
      # Socket-peer allowlist intentionally denies direct LAN/WAN and spoofed
      # Cf-Connecting-Ip forwarded headers; cloudflared currently sits on this /24.
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.honeypot-public.rule: "Host(`login.albandrieu.com`)"
      traefik.http.routers.honeypot-public.entrypoints: websecure
      traefik.http.routers.honeypot-public.tls: "true"
      traefik.http.routers.honeypot-public.service: honeypot
      traefik.http.routers.honeypot-public.middlewares: honeypot-tunnel-peer,crowdsec-appsec@file,honeypot-public-rate
      traefik.http.services.honeypot.loadbalancer.server.port: "8080"
      traefik.http.middlewares.honeypot-tunnel-peer.ipallowlist.sourcerange: 10.200.2.0/24
      traefik.http.middlewares.honeypot-public-rate.ratelimit.average: "10"
      traefik.http.middlewares.honeypot-public-rate.ratelimit.period: 1s
      traefik.http.middlewares.honeypot-public-rate.ratelimit.burst: "20"
      traefik.http.middlewares.honeypot-public-rate.ratelimit.sourcecriterion.ipstrategy.depth: "1"
      # Distinct POST budget; no credentials are accepted or retained by Apache.
      traefik.http.routers.honeypot-login-attempt.rule: "Host(`login.albandrieu.com`) && Path(`/login`) && Method(`POST`)"
      traefik.http.routers.honeypot-login-attempt.entrypoints: websecure
      traefik.http.routers.honeypot-login-attempt.tls: "true"
      traefik.http.routers.honeypot-login-attempt.priority: "1000"
      traefik.http.routers.honeypot-login-attempt.service: honeypot
      traefik.http.routers.honeypot-login-attempt.middlewares: honeypot-tunnel-peer,crowdsec-appsec@file,honeypot-login-rate
      traefik.http.middlewares.honeypot-login-rate.ratelimit.average: "2"
      traefik.http.middlewares.honeypot-login-rate.ratelimit.period: 1s
      traefik.http.middlewares.honeypot-login-rate.ratelimit.burst: "10"
      traefik.http.middlewares.honeypot-login-rate.ratelimit.sourcecriterion.ipstrategy.depth: "1"
    restart: unless-stopped
    # Pinned minimum memory budget; reevaluate only after runtime evidence.
    mem_limit: 256m
    user: "33:33"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/www/html:uid=33,gid=33,mode=0755,size=1m
      - /run:mode=1777,size=1m
      - /tmp:size=8m
    # Project Honey Pot checks the script's md5 (tag4): fetch it unmodified, pinned and verified.
    # /healthz is static so health checks never trigger a report to Project Honey Pot.
    command:
      - sh
      - -ec
      - |
        curl -fsS --max-time 30 -o /var/www/html/keywaspish.php https://raw.githubusercontent.com/AlbanAndrieu/nabla-site-apache/f62d1f313cd751f5ee899ae70089d5432a6b2035/api/honeypot/keywaspish.php
        echo "93427a8138a0dac14ae6b6a8001247369032e319d9831750567ed797b9e4debc  /var/www/html/keywaspish.php" | sha256sum -c -
        echo ok > /var/www/html/healthz
        exec apache2-foreground
    volumes:
      - ./apache/ports.conf:/etc/apache2/ports.conf:ro
      - ./apache/honeypot.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./apache/static:/opt/honeypot/static:ro
    ports:
      - name: web
        target: 8080
        published: "31090"
        protocol: tcp
        app_protocol: http
    networks:
      - default
      - traefik_network
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default: {}
  traefik_network:
    external: true
    name: traefik_network
