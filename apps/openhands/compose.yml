---
services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:1.8
    pull_policy: missing
    container_name: openhands-app
    x-nabla:
      id: openhands
      name: OpenHands
      kind: ai-coding-agent
      category: ai
      presentationRole: service
      criticality: medium
      description: Self-hosted coding-agent environment with Docker-backed sandboxes.
      runtime:
        provider: truenas-app
        containerService: openhands
      monitoring:
        type: port
        host: 172.17.0.24
        port: 3010
    ports:
      - "172.17.0.24:3010:3000"
    environment:
      AGENT_SERVER_IMAGE_REPOSITORY: ghcr.io/openhands/agent-server
      AGENT_SERVER_IMAGE_TAG: 1.26.0-python
      LOG_ALL_EVENTS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/cpool/openhands/state:/.openhands
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
