---
services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:0.23
    container_name: openhands-app
    x-nabla:
      id: openhands
      name: OpenHands
      kind: ai-coding-agent
      category: ai
      presentationRole: service
      criticality: medium
      description: Self-hosted coding-agent environment with Docker-backed sandboxes.
      runtime:
        provider: truenas-app
        containerService: openhands
      monitoring:
        type: port
        host: 172.17.0.24
        port: 3010
    ports:
      - "3010:3000"
    environment:
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.all-hands.dev/all-hands-ai/runtime:0.24-nikolaik
      WORKSPACE_MOUNT_PATH: ${HOME}/OH
      LOG_ALL_EVENTS: "true"
    volumes:
      - ${HOME}/OH:/opt/worspace_base
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.openhands-state:/.openhands-state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - intranet

networks:
  intranet:
    external: true
    name: intranet
