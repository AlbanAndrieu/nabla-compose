---
name: ollama
# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  ollama:
    logging: *nabla-logging
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    # qwen3.5:4b (~3.4 GB) + nomic-embed-text (~0.3 GB) + 8k KV cache: about 4.5 GB.
    # TrueNAS had 5.5 GiB available on 17/11: raise only after freeing RAM (roadmap).
    mem_limit: 6g
    restart: unless-stopped
    # Reap orphaned ollama children; the app PID 1 left zombies (diagnostic 2026-11-04).
    init: true
    x-nabla:
      id: ollama
      name: Ollama
      kind: model-runtime
      category: ai
      runtime:
        provider: truenas-app
        containerService: ollama
      relations:
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik routes the internal Ollama endpoint.
          evidence:
            - apps/ollama/compose.yml:traefik.http.routers.ollama
        - target: prometheus
          type: observedBy
          strength: optional
          description: Ollama is marked for Prometheus scraping.
          evidence:
            - apps/ollama/compose.yml:prometheus.scrape
      exposure:
        - name: public
          hostnames:
            - ollama.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
    env_file:
      - /mnt/cpool/secrets/runtime/ollama/.env
    #  - /mnt/cpool/secrets/runtime/ollama/.env.secrets
    environment:
      - TZ=Europe/Paris
      - OLLAMA_HOST=0.0.0.0:30068
      # CPU-only (no GPU is passed to this container): LiteLLM sends qwen-cpu here when the
      # workstation GPU is off. Idle models unload after 30 min to give the RAM back to ZFS ARC.
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
      # qwen3.5:4b (qwen-cpu) and nomic-embed-text (embedding-local) stay loaded together.
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_MAX_QUEUE=4
      # Same num_ctx as the qwen-cpu route: another value reloads the model.
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MODELS=/mnt/cpool/model/ollama/
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # - OLLAMA_API_KEY=${OLLAMA_API_KEY} # <-- Place your API key in .env or .env.secrets.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "OLLAMA_HOST=http://127.0.0.1:30068 ollama list >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - /mnt/cpool/ollama/:/root/.ollama
      - /mnt/cpool/model/ollama/:/mnt/cpool/model/ollama/
    ports:
      - name: web
        target: 30068
        published: "30068"
        protocol: tcp
        app_protocol: http
    #  --- Internal Traefik labels
    labels:
      - com.albandrieu.nabla.entity-ref=component:default/ollama
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.int.albandrieu.com`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ollama.service=ollama"
      - "traefik.http.services.ollama.loadbalancer.server.scheme=http"
      #  --- Prometheus metrics
      - prometheus.scrape=true
      - prometheus.port=30068
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
    #   (Uncomment to enable logging rotation)
    #  security_opt:
    #    - apparmor=unconfined
# with CPU 8
# memory 32768
# GPU Passthrough available (non-NVIDIA) GPUs on truenas
