---
name: dependency-track
# Docker keeps json-file logs without rotation on TrueNAS (16/11 performance plan).
x-logging: &nabla-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  dependency-track-api:
    logging: *nabla-logging
    image: ${DEPENDENCY_TRACK_API_IMAGE:-ghcr.io/dependencytrack/apiserver:5.2.0}
    container_name: dependency-track-api
    restart: unless-stopped
    env_file:
      - /mnt/cpool/secrets/runtime/dependency-track/.env.secrets
    environment:
      # v5 uses DT_DATASOURCE_*, not the legacy v4 ALPINE_DATABASE_* names.
      # The shared PostgreSQL App is reached by LAN, with CA + SAN verification.
      DT_DATASOURCE_URL: jdbc:postgresql://${DEPENDENCY_TRACK_DATABASE_HOST:-172.17.0.24}:5432/dependencytrack?sslmode=verify-full&sslrootcert=/etc/nabla/pki/postgres-ca.crt
      DT_DATASOURCE_USERNAME: dependencytrack
      DT_DATASOURCE_POOL_ENABLED: "true"
      # Prometheus metrics on the LAN API port (/metrics); scraped by apps/prometheus.
      ALPINE_METRICS_ENABLED: "true"
      REPO_META_ANALYZER_CACHESTAMPEDEBLOCKER_LOCK_BUCKETS: "1000"
      REPO_META_ANALYZER_CACHESTAMPEDEBLOCKER_MAX_ATTEMPTS: "10"
    ports:
      - name: api
        target: 8080
        published: "31083"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/dependency-track/data:/data
      - /mnt/cpool/secrets/runtime/postgres/tls/ca.crt:/etc/nabla/pki/postgres-ca.crt:ro
    networks:
      - intranet
    labels:
      com.albandrieu.nabla.entity-ref: component:default/dependency-track-api
    x-nabla:
      id: dependency-track-api
      name: Dependency-Track API
      kind: software-supply-chain-api
      category: security
      presentationRole: support
      criticality: medium
      status: planned
      securityFunctions:
        - identify
        - detect
      runtime:
        provider: truenas-app
        containerService: dependency-track-api
      relations:
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes the Dependency-Track API server metrics endpoint.
          evidence:
            - apps/dependency-track/compose.yml:ALPINE_METRICS_ENABLED
        - target: postgresql
          type: storesIn
          strength: required
          evidence:
            - apps/dependency-track/compose.yml:ALPINE_DATABASE_URL

  dependency-track:
    logging: *nabla-logging
    image: ${DEPENDENCY_TRACK_FRONTEND_IMAGE:-ghcr.io/dependencytrack/frontend:5.2.0}
    container_name: dependency-track
    restart: unless-stopped
    depends_on:
      - dependency-track-api
    environment:
      API_BASE_URL: ${DEPENDENCY_TRACK_API_BASE_URL:-http://172.17.0.24:31083}
    ports:
      - name: web
        target: 8080
        published: "31084"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    networks:
      - intranet
    labels:
      com.albandrieu.nabla.entity-ref: component:default/dependency-track
    x-nabla:
      id: dependency-track
      name: Dependency-Track
      kind: software-supply-chain-platform
      category: security
      presentationRole: service
      criticality: medium
      status: planned
      securityFunctions:
        - identify
        - detect
      url: http://172.17.0.24:31084
      description: CycloneDX SBOM component inventory and software supply-chain vulnerability analysis platform.
      runtime:
        provider: truenas-app
        containerService: dependency-track
      monitoring:
        type: port
        host: 172.17.0.24
        port: 31084
      relations:
        - target: dependency-track-api
          type: consumesApi
          strength: required
          evidence:
            - apps/dependency-track/compose.yml:API_BASE_URL
      exposure:
        - name: lan
          protocol: HTTP
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web

networks:
  intranet:
    external: true
    name: intranet
