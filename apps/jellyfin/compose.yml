---
# Jellyfin media server of the *arr media stack (status planned, decision D2).
# LAN only: no Cloudflare route (decision D5). The library is mounted read-only.
# Design and acceptance: docs/arr-media-library-roadmap.md
name: jellyfin

services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    user: "568:568"
    # Render group of /dev/dri/renderD128 on TrueNAS for hardware transcoding;
    # deploy-media-stack.sh --check prints the observed GID.
    group_add:
      - "${JELLYFIN_RENDER_GID:-107}"
    x-nabla:
      id: jellyfin
      name: Jellyfin
      kind: media-server
      category: media
      status: planned
      presentationRole: service
      criticality: low
      description: >-
        LAN media server for the library (Samsung Frame and browsers), with
        Intel/AMD iGPU hardware transcoding and a read-only library mount.
      url: https://jellyfin.int.albandrieu.com
      internalUrl: http://jellyfin:8096
      runtime:
        provider: truenas-app
        containerService: jellyfin
      lifecycle:
        phase: applications
        priority: 78
      monitoring:
        type: http
        target: http://172.17.0.24:30013/health
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik exposes Jellyfin only through jellyfin.int.albandrieu.com.
          evidence:
            - apps/jellyfin/compose.yml:traefik.http.routers.jellyfin
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes the native Jellyfin /metrics endpoint (job jellyfin).
          evidence:
            - apps/prometheus/prometheus.yml:job_name=jellyfin
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Europe/Paris
      JELLYFIN_PublishedServerUrl: https://jellyfin.int.albandrieu.com
    ports:
      - name: web
        target: 8096
        published: "30013"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/jellyfin/config:/config
      - /mnt/cpool/jellyfin-cache:/cache
      - /mnt/cpool/media/library:/data/library:ro
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - http://127.0.0.1:8096/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      com.albandrieu.nabla.entity-ref: component:default/jellyfin
      com.albandrieu.nabla.logs: media
      traefik.enable: "true"
      traefik.docker.network: traefik_network
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.int.albandrieu.com`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.routers.jellyfin.service: jellyfin
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
    networks:
      - media
      - traefik_network

networks:
  media:
    external: true
    name: media
  traefik_network:
    external: true
    name: traefik_network
