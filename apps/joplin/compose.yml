---
name: joplin
services:
  joplin:
    image: joplin/server:3.7.3@sha256:d951ce50b6d3d542393ebc4d08bd62d9a4fb0a6f6827abb861726c83560ecf97
    container_name: joplin
    restart: unless-stopped
    x-nabla:
      id: joplin
      name: Joplin Server
      kind: notes-sync
      category: productivity
      presentationRole: service
      criticality: medium
      status: planned
      description: Private Joplin synchronization server backed by the shared PostgreSQL service.
      url: https://joplin.albandrieu.com
      internalUrl: http://joplin:22300
      runtime:
        provider: truenas-app
        containerService: joplin
      lifecycle:
        phase: applications
        priority: 60
      exposure:
        - name: public
          hostnames:
            - joplin.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            # Joplin desktop/mobile sync cannot pass an interactive Access login;
            # Joplin Server authentication protects the route (owner decision 10/11).
            required: false
      monitoring:
        type: http
        target: http://172.17.0.24:22300/api/ping
        conditions:
          - "[STATUS] == 200"
      relations:
        - target: postgresql
          type: dependsOn
          strength: required
          description: Joplin persists notes, users and synchronization state in the shared PostgreSQL service.
          evidence:
            - apps/joplin/compose.yml:POSTGRES_HOST
        - target: cloudflared
          type: exposedBy
          strength: required
          description: The shared Cloudflare Tunnel publishes Joplin at joplin.albandrieu.com for remote sync clients.
          evidence:
            - terraform/cloudflare/tunnel.tofu:joplin.albandrieu.com
        - target: traefik
          type: exposedBy
          strength: optional
          description: Traefik also serves Joplin on the private joplin.int.albandrieu.com hostname.
          evidence:
            - apps/joplin/compose.yml:traefik.http.routers.joplin
    env_file:
      - /mnt/cpool/secrets/runtime/joplin/.env.secrets
    environment:
      APP_PORT: "22300"
      APP_BASE_URL: https://joplin.albandrieu.com
      DB_CLIENT: pg
      POSTGRES_HOST: 172.17.0.24
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
    ports:
      - name: web
        target: 22300
        published: "22300"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:22300/api/ping')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    labels:
      - "com.albandrieu.nabla.entity-ref=component:default/joplin"
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.joplin.rule=Host(`joplin.int.albandrieu.com`)"
      - "traefik.http.routers.joplin.entrypoints=websecure"
      - "traefik.http.routers.joplin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.joplin.service=joplin"
      - "traefik.http.services.joplin.loadbalancer.server.port=22300"
    networks:
      - intranet
      - traefik_network

networks:
  intranet:
    external: true
    name: intranet
  traefik_network:
    external: true
    name: traefik_network
