---
services:
  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0
    container_name: opensearch-exporter
    restart: unless-stopped
    x-nabla:
      id: opensearch-exporter
      name: OpenSearch Exporter
      kind: metrics-exporter
      category: observability
      runtime:
        provider: truenas-app
        containerService: opensearch-exporter
      relations:
        - target: opensearch
          type: consumesApi
          strength: required
          description: The exporter collects metrics from the OpenRAG OpenSearch service.
          evidence:
            - apps/opensearch-exporter/compose.yml:OPENSEARCH_EXPORTER_URI
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes metrics from the OpenSearch exporter.
          evidence:
            - apps/prometheus/prometheus.yml:job_name=opensearch
    command:
      - --es.uri=${OPENSEARCH_EXPORTER_URI}
      - --es.ssl-skip-verify
      - --es.all
      - --es.indices
    ports:
      - "${OPENSEARCH_EXPORTER_PORT:-9114}:9114"

  opensearch-security-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0
    container_name: opensearch-security-exporter
    restart: unless-stopped
    x-nabla:
      id: opensearch-security-exporter
      name: OpenSearch Security Exporter
      kind: metrics-exporter
      category: observability
      runtime:
        provider: truenas-app
        containerService: opensearch-security-exporter
      relations:
        - target: opensearch-security
          type: consumesApi
          strength: required
          description: The exporter collects metrics from the shared OpenSearch 2.x security cluster.
          evidence:
            - apps/opensearch-exporter/compose.yml:opensearch-security:9200
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes metrics from the OpenSearch Security exporter.
          evidence:
            - apps/prometheus/prometheus.yml:job_name=opensearch-security
    command:
      - --es.uri=http://opensearch-security:9200
      - --es.all
      - --es.indices
    ports:
      - "${OPENSEARCH_SECURITY_EXPORTER_PORT:-9115}:9114"
    networks:
      - security

networks:
  security:
    external: true
    name: nabla-security
