---
services:
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus
    labels:
      com.albandrieu.nabla.entity-ref: component:default/gatus
    x-nabla:
      id: gatus
      name: Gatus UI
      kind: status-monitor
      category: observability
      url: http://172.17.0.24:8085
      description: Declarative status monitoring generated from Nabla Compose services.
      runtime:
        provider: truenas-app
        containerService: gatus
      exposure:
        - name: public
          hostnames:
            - gatus.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
    restart: unless-stopped
    ports:
      - name: web
        target: 8080
        published: "8085"
        protocol: tcp
        app_protocol: http
    volumes:
      - ./config:/config:ro
      - /mnt/cpool/gatus:/data
    networks:
      - docker-proxy
      - intranet
    # The generated /config/config.yml is 0640, owned by host group apps.
    # Grant supplemental GID 568 rather than weakening it to world-readable.
    # Verify `getent group apps` on TrueNAS before deployment.
    group_add:
      - "${GATUS_CONFIG_GID:-568}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Dedicated Docker API network shared only with docker-socket-proxy.
  docker-proxy:
    external: true
    name: docker-proxy
  intranet:
    external: true
    name: intranet
