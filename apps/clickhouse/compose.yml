---
services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.8 # clickhouse 26.x has issue with langfuse keep using 25.8
    x-nabla:
      id: clickhouse
      name: ClickHouse
      kind: database
      category: data
      runtime:
        provider: truenas-app
        containerService: clickhouse
      relations:
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes the native ClickHouse Prometheus endpoint.
          evidence:
            - apps/clickhouse/config/prometheus.xml
            - apps/prometheus/prometheus.yml:job_name=clickhouse
    restart: unless-stopped
    user: "568:568" # TrueNAS apps user
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse} # CHANGEME
    volumes:
      - /mnt/cpool/clickhouse/:/var/lib/clickhouse
      # - /mnt/cpool/clickhouse/logs:/var/log/clickhouse-server
      - /mnt/cpool/logs/clickhouse-server/:/var/log/clickhouse-server
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ports:
      - 8123:8123
      - 9000:9000
      - 9363:9363
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
