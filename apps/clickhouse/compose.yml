---
services:
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.2.7
    x-nabla:
      id: clickhouse
      name: ClickHouse
      kind: database
      category: data
      runtime:
        provider: truenas-app
        containerService: clickhouse
      relations:
        - target: prometheus
          type: observedBy
          strength: optional
          description: Prometheus scrapes the native ClickHouse Prometheus endpoint.
          evidence:
            - apps/clickhouse/config/prometheus.xml
            - apps/prometheus/prometheus.yml:job_name=clickhouse
    restart: unless-stopped
    user: "101:101"
    env_file:
      - /mnt/cpool/clickhouse/.env.secrets
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
    volumes:
      - /mnt/cpool/clickhouse:/var/lib/clickhouse
      - /mnt/cpool/logs/clickhouse-server:/var/log/clickhouse-server
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ports:
      - "172.17.0.24:8123:8123"
      - "172.17.0.24:9000:9000"
      - "172.17.0.24:9363:9363"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      intranet:
        aliases:
          - clickhouse

networks:
  intranet:
    external: true
    name: intranet
