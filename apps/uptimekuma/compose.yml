---
name: uptimekuma

services:
  uptimekuma:
    image: louislam/uptime-kuma:2.5.10-rootless
    container_name: uptimekuma
    labels:
      com.albandrieu.nabla.entity-ref: component:default/uptimekuma
    x-nabla:
      id: uptimekuma
      name: Uptime Kuma
      kind: uptime-monitor
      category: observability
      url: http://172.17.0.24:31050
      description: Repository-owned Uptime Kuma monitoring engine and UI, reconciled by AutoKuma.
      runtime:
        provider: truenas-app
        appId: uptimekuma
        containerService: uptimekuma
      lifecycle:
        phase: platform-services
        priority: 40
      exposure:
        - name: public
          hostnames:
            - uptime-kuma.albandrieu.com
          protocol: HTTPS
          visibility: public
          gatewayRef: resource:default/cloudflare-tunnel
          backendPort: web
          access:
            required: true
    restart: unless-stopped
    # LAN-bound host port; the Cloudflare tunnel route to it sits behind Access (README).
    ports:
      - name: web
        target: 3001
        published: "31050"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/uptimekuma:/app/data
    user: "568:568"
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  intranet:
    external: true
    name: intranet
