---
services:
  mongo:
    image: docker.io/mongo:6.0.5-jammy
    container_name: mongodb
    restart: unless-stopped
    x-nabla:
      id: graylog-mongodb
      name: Graylog MongoDB
      kind: database
      category: data
      runtime:
        provider: truenas-app
        containerService: mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - graynet

  graylog:
    image: docker.io/graylog/graylog:6.3.15
    container_name: graylog
    restart: unless-stopped
    x-nabla:
      id: graylog
      name: Graylog
      kind: log-management
      category: observability
      runtime:
        provider: truenas-app
        containerService: graylog
      relations:
        - target: graylog-mongodb
          type: dependsOn
          strength: required
          description: Graylog stores application configuration and metadata in MongoDB.
          evidence:
            - apps/graylog/compose.yml:GRAYLOG_MONGODB_URI
        - target: opensearch-security
          type: storesIn
          strength: required
          description: Graylog stores log indices in the shared OpenSearch 2.x security cluster.
          evidence:
            - apps/graylog/compose.yml:GRAYLOG_ELASTICSEARCH_HOSTS
    env_file:
      - /mnt/cpool/graylog/.env.secrets
    environment:
      GRAYLOG_PASSWORD_SECRET: "${GRAYLOG_PASSWORD_SECRET}"
      GRAYLOG_ROOT_PASSWORD_SHA2: "${GRAYLOG_ROOT_PASSWORD_SHA2}"
      GRAYLOG_HTTP_BIND_ADDRESS: "0.0.0.0:9000"
      GRAYLOG_HTTP_EXTERNAL_URI: "${GRAYLOG_HTTP_EXTERNAL_URI:-http://172.17.0.24:9000/}"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch-security:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
      GRAYLOG_TIMEZONE: "Europe/Paris"
      TZ: "Europe/Paris"
      GRAYLOG_TRANSPORT_EMAIL_PROTOCOL: "smtp"
      GRAYLOG_TRANSPORT_EMAIL_WEB_INTERFACE_URL: "${GRAYLOG_TRANSPORT_EMAIL_WEB_INTERFACE_URL:-http://172.17.0.24:9000/}"
      GRAYLOG_TRANSPORT_EMAIL_HOSTNAME: "${GRAYLOG_TRANSPORT_EMAIL_HOSTNAME:-outbound.mailhop.org}"
      GRAYLOG_TRANSPORT_EMAIL_ENABLED: "${GRAYLOG_TRANSPORT_EMAIL_ENABLED:-true}"
      GRAYLOG_TRANSPORT_EMAIL_PORT: "${GRAYLOG_TRANSPORT_EMAIL_PORT:-587}"
      GRAYLOG_TRANSPORT_EMAIL_USE_AUTH: "${GRAYLOG_TRANSPORT_EMAIL_USE_AUTH:-true}"
      GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME: "${GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME:-}"
      GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD: "${GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD:-}"
      GRAYLOG_TRANSPORT_EMAIL_USE_TLS: "${GRAYLOG_TRANSPORT_EMAIL_USE_TLS:-true}"
      GRAYLOG_TRANSPORT_EMAIL_USE_SSL: "${GRAYLOG_TRANSPORT_EMAIL_USE_SSL:-false}"
      GRAYLOG_TRANSPORT_FROM_EMAIL: "${GRAYLOG_TRANSPORT_FROM_EMAIL:-graylog@albandrieu.com}"
      GRAYLOG_TRANSPORT_SUBJECT_PREFIX: "${GRAYLOG_TRANSPORT_SUBJECT_PREFIX:-[graylog]}"
    entrypoint: /usr/bin/tini -- wait-for-it opensearch-security:9200 -- /docker-entrypoint.sh
    volumes:
      - "${PWD}/config/graylog/graylog.conf:/usr/share/graylog/config/graylog.conf"
      - graylog_data:/usr/share/graylog/data
    networks:
      - graynet
      - security
    depends_on:
      mongo:
        condition: service_started
    ports:
      - "${GRAYLOG_HTTP_PORT:-9000}:9000/tcp"
      - "${GRAYLOG_SYSLOG_TCP_PORT:-15140}:1514/tcp"
      - "${GRAYLOG_SYSLOG_UDP_PORT:-15140}:1514/udp"
      - "${GRAYLOG_GELF_TCP_PORT:-12201}:12201/tcp"
      - "${GRAYLOG_GELF_UDP_PORT:-12201}:12201/udp"

networks:
  graynet:
    driver: bridge
  security:
    external: true
    name: nabla-security

volumes:
  mongo_data:
    driver: local
  graylog_data:
    driver: local
