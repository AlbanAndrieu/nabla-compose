---
services:
  bichon:
    image: rustmailer/bichon:2.0.3
    container_name: bichon
    restart: unless-stopped
    x-nabla:
      id: bichon
      name: Bichon
      kind: application
      category: productivity
      runtime:
        provider: truenas-app
        containerService: bichon
      monitoring:
        type: port
        target: tcp://172.17.0.24:15630
        conditions:
          - "[CONNECTED] == true"
    ports:
      - "172.17.0.24:15630:15630"
    volumes:
      - /mnt/cpool/bichon:/data
    user: "568:568"
    env_file:
      - /mnt/cpool/bichon/.env.secrets
    environment:
      BICHON_ROOT_DIR: /data
      BICHON_LOG_LEVEL: info
    networks:
      - traefik_network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  traefik_network:
    external: true
