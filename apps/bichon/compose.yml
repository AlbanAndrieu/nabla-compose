---
name: bichon
services:
  bichon:
    labels:
      com.albandrieu.nabla.entity-ref: component:default/bichon
    image: rustmailer/bichon:2.0.3
    container_name: bichon
    restart: unless-stopped
    # Reap orphaned curl children; the app PID 1 left zombies (diagnostic 2026-11-04).
    init: true
    x-nabla:
      id: bichon
      name: Bichon UI
      kind: application
      category: productivity
      runtime:
        provider: truenas-app
        containerService: bichon
      monitoring:
        type: port
        target: tcp://172.17.0.24:15630
        conditions:
          - "[CONNECTED] == true"
      exposure:
        - name: lan
          hostnames:
            - bichon.albandrieu.com
          protocol: HTTPS
          visibility: lan
          gatewayRef: resource:default/truenas
          backendPort: web
          riskAcceptance:
            id: bichon-private
            status: rejected
            reason: "Bichon must stay private. Any public DNS or Cloudflare Tunnel entry is configuration drift and must be reported by sickz."
            control: lan-only-drift-reported-by-sickz
            reviewAfter: null
    ports:
      - name: web
        target: 15630
        published: "15630"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    volumes:
      - /mnt/cpool/bichon:/data
    user: "568:568"
    env_file:
      - /mnt/cpool/secrets/runtime/bichon/.env.secrets
    environment:
      BICHON_ROOT_DIR: /data
      BICHON_LOG_LEVEL: info
    networks:
      - traefik_network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  traefik_network:
    external: true
