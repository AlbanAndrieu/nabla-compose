---
services:
  pihole:
    image: docker.io/pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped
    x-nabla:
      id: pihole
      name: Pi-hole
      kind: dns
      category: network
      presentationRole: core
      description: LAN DNS filtering and private *.int.albandrieu.com record consumer.
      runtime:
        provider: truenas-app
        containerService: pihole
      monitoring:
        type: http
        target: http://172.17.0.24:20720/admin/
    env_file:
      - /mnt/cpool/pihole/.env.secrets
    environment:
      TZ: Europe/Paris
      # Docker bridge clients must be accepted by FTL. Keep the API session
      # limit at the Pi-hole default; fix clients that crash/re-authenticate in
      # a loop instead of masking the fault with an ever-larger session pool.
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_webserver_api_max_sessions: "16"
      # Standardize the container-side web ports. TrueNAS/LAN compatibility is
      # kept through the host mappings below.
      FTLCONF_webserver_port: "80o,443os,[::]:80o,[::]:443os"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "20720:80/tcp"
      - "30132:443/tcp"
    volumes:
      - /mnt/cpool/pihole/config:/etc/pihole
      # Keep during migration when legacy/custom dnsmasq snippets exist.
      - /mnt/cpool/pihole/dnsmasq:/etc/dnsmasq.d
    networks:
      - intranet
    healthcheck:
      test: ["CMD", "pihole", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pihole-dns-sync:
    image: ghcr.io/cajuclc/traefik-pihole-sync:v0.0.1
    container_name: pihole-dns-sync
    x-nabla:
      id: pihole-dns-sync
      name: Pi-hole DNS Sync
      kind: configuration-reconciler
      category: network
      presentationRole: support
      criticality: high
      description: Synchronizes repository-managed Docker/Traefik service names into Pi-hole private DNS.
      runtime:
        provider: truenas-app
        containerService: pihole-dns-sync
      relations:
        - target: pihole
          type: automates
          strength: required
          description: DNS Sync reconciles private service records through the Pi-hole API.
          evidence:
            - apps/pihole/compose.yml:PIHOLE_URL=http://pihole
        - target: docker-socket-proxy
          type: consumesApi
          strength: required
          description: DNS Sync discovers services through the restricted Docker socket proxy.
          evidence:
            - apps/pihole/compose.yml:DOCKER_HOST=tcp://docker-socket-proxy:2375
    restart: unless-stopped
    depends_on:
      pihole:
        condition: service_healthy
    env_file:
      # Preserve the currently working Pi-hole API credential during cutover.
      # Consolidate it into /mnt/cpool/pihole/.env.secrets after validation.
      - /mnt/cpool/traefik/.env.secrets
    environment:
      # docker-socket-proxy is intentionally reachable only on the shared
      # intranet network. Missing this network caused the 2026-09-07 restart
      # loop and repeated Pi-hole API session allocation.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PIHOLE_URL: http://pihole
      SKIP_TLS_VERIFY: "false"
      TARGET_IP: 172.17.0.24
      DOMAIN_SUFFIX: int.albandrieu.com
      EXTERNAL_SERVICES_FILE: /etc/traefik/external-services.yml
      OUTPUT_FILE: /etc/traefik/routes.yml
    volumes:
      - /mnt/cpool/traefik:/etc/traefik
    networks:
      - intranet

  pihole-exporter:
    image: docker.io/ekofr/pihole-exporter:latest
    container_name: pihole-exporter
    x-nabla:
      id: pihole-exporter
      name: Pi-hole Exporter
      kind: metrics-exporter
      category: observability
      presentationRole: support
      criticality: medium
      description: Prometheus-compatible metrics exporter for Pi-hole.
      runtime:
        provider: truenas-app
        containerService: pihole-exporter
      monitoring:
        type: port
        host: 172.17.0.24
        port: 9617
      relations:
        - target: pihole
          type: dependsOn
          strength: required
          description: The exporter reads Pi-hole runtime statistics.
          evidence:
            - apps/pihole/compose.yml:PIHOLE_HOSTNAME=pihole
    restart: unless-stopped
    env_file:
      - /mnt/cpool/pihole/.env.secrets
    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PORT: "80"
    ports:
      - "9617:9617"
    networks:
      - intranet
    depends_on:
      pihole:
        condition: service_healthy

networks:
  intranet:
    external: true
    name: intranet
