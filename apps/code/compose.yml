---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    env_file:
      - /mnt/cpool/code/.env
      - /mnt/cpool/code/.env.secrets
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-568}
      - TZ=Europe/Paris
      - PASSWORD=${CODE_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=build-essential|git|curl|jq|openssh-client|python3|python3-venv
    volumes:
      - /mnt/cpool/nginx/:/nginx
      - /mnt/cpool/code/:/code-server
      - /mnt/cpool/drawio/:/drawio
      - /mnt/cpool/compose/:/compose
      - /mnt/cpool/traefik/:/traefik
      - /mnt/cpool/prometheus/:/prometheus
      - /mnt/cpool/grafana/:/grafana
      - /mnt/cpool/litellm/:/litellm
      - /mnt/cpool/code/config:/config
      - /mnt/cpool/compose/nabla-compose/:/config/workspace
      - ./custom-cont-init.d/50-install-extensions:/custom-cont-init.d/50-install-extensions:ro
    ports:
      - 8443:8443
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code.rule=Host(`code.int.albandrieu.com`)"
      - "traefik.http.routers.code.entrypoints=websecure"
      - "traefik.http.routers.code.tls.certresolver=letsencrypt"
      - "traefik.http.routers.code.service=code"
      - "traefik.http.services.code.loadbalancer.server.scheme=http"
      - prometheus.scrape=true
      - prometheus.port=8443
      - apparmor=unconfined
