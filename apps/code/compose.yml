---
name: code
services:
  code-server:
    image: ghcr.io/linuxserver/code-server:4.140.0@sha256:fc6cc21ba06ab0ad02e3695235626bddbef1943f4b8cb874c994cf78619323cd
    platform: linux/amd64
    container_name: code
    x-nabla:
      id: code-server
      name: Code Server
      kind: development-environment
      category: development
      presentationRole: service
      criticality: medium
      description: Browser-based development environment for homelab repositories.
      runtime:
        provider: truenas-app
        containerService: code-server
      monitoring:
        type: http
        target: http://172.17.0.24:8443/healthz
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8443/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    env_file:
      - /mnt/cpool/secrets/runtime/code/.env
      - /mnt/cpool/secrets/runtime/code/.env.secrets
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-568}
      - TZ=Europe/Paris
      - DEFAULT_WORKSPACE=/config/workspace
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=build-essential|git|curl|jq|openssh-client|python3|python3-venv
    volumes:
      - /mnt/cpool/nginx/:/nginx
      - /mnt/cpool/code/:/code-server
      - /mnt/cpool/drawio/:/drawio
      - /mnt/cpool/compose/:/compose
      - /mnt/cpool/traefik/:/traefik
      - /mnt/cpool/prometheus/:/prometheus
      - /mnt/cpool/grafana/:/grafana
      - /mnt/cpool/litellm/:/litellm
      - /mnt/cpool/code/config:/config
      - /mnt/cpool/compose/nabla-compose/:/config/workspace
      - ./custom-cont-init.d/50-install-extensions:/custom-cont-init.d/50-install-extensions:ro
    ports:
      - name: web
        target: 8443
        published: "8443"
        host_ip: 172.17.0.24
        protocol: tcp
        app_protocol: http
    labels:
      - "com.albandrieu.nabla.entity-ref=component:default/code-server"
      - "traefik.enable=true"
      - "traefik.http.routers.code.rule=Host(`code.int.albandrieu.com`)"
      - "traefik.http.routers.code.entrypoints=websecure"
      - "traefik.http.routers.code.tls.certresolver=letsencrypt"
      - "traefik.http.routers.code.service=code"
      - "traefik.http.services.code.loadbalancer.server.scheme=http"
      - prometheus.scrape=true
      - prometheus.port=8443
      - apparmor=unconfined
