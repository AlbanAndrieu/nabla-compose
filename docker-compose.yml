configs:
  poll-config.yml:
    content: |
      - url: https://github.com/albanandrieu/nabla-compose.git
        reference: master
        interval: 3600

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    x-nabla:
      id: docker-socket-proxy
      name: Docker Socket Proxy
      kind: security-proxy
      category: infrastructure
      presentationRole: support
      criticality: high
      securityFunctions:
        - protect
      description: Restricted read-only Docker Engine API boundary for repository automation.
      runtime:
        provider: truenas-app
        containerService: docker-socket-proxy
      relations:
        - target: docker
          type: providesApi
          strength: required
          description: The proxy exposes an allowlisted subset of the local Docker Engine API.
          evidence:
            - docker-compose.yml:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      SERVICES: 1
      TASKS: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - intranet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.85.1
    container_name: doco-cd
    x-nabla:
      id: doco-cd
      name: Doco-CD
      kind: deployment-automation
      category: operations
      presentationRole: support
      criticality: medium
      description: Git-driven Compose deployment automation for the TrueNAS Docker runtime.
      runtime:
        provider: truenas-app
        containerService: doco-cd
      monitoring:
        type: port
        host: 172.17.0.24
        port: 9120
      relations:
        - target: docker-socket-proxy
          type: consumesApi
          strength: required
          description: Doco-CD performs Docker discovery and deployments through the restricted proxy.
          evidence:
            - docker-compose.yml:DOCKER_HOST=tcp://docker-socket-proxy:2375
    restart: unless-stopped
    ports:
      - "30080:80"
      - "9120:9120"
    configs:
      - source: poll-config.yml
        target: /poll-config.yml
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      GIT_ACCESS_TOKEN: "${GITHUB_ACCESS_TOKEN_READ_ONLY}"
      SECRET_PROVIDER: webhook
      SECRET_PROVIDER_WEBHOOK_STORES_FILE: /secret-store.yml
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    volumes:
      - /mnt/cpool/dococd/:/data
      - ./secret-store.yml:/secret-store.yml:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, /doco-cd, healthcheck]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

include:
  - path: compose.redis.yml
  - path: compose.monitoring.yml
  - path: compose.helper.yml
  - path: compose.security.yml
  - path: docker-compose.override.yml

networks:
  intranet:
    external: true
    name: intranet
