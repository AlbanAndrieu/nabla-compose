---
name: Temporary code-scanning alert 19 inspection

on:
  push:
    branches:
      - feat/scanopy-homelab

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read alert 19 metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts/19" \
            --jq '{
              number,
              state,
              created_at,
              updated_at,
              fixed_at,
              rule: {
                id: .rule.id,
                description: .rule.description,
                security_severity_level: .rule.security_severity_level,
                severity: .rule.severity
              },
              tool: {
                name: .tool.name,
                version: .tool.version
              },
              most_recent_instance: {
                state: .most_recent_instance.state,
                ref: .most_recent_instance.ref,
                location: .most_recent_instance.location
              }
            }' > alert-19.json
          cat alert-19.json

      - name: Archive sanitized alert metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-scanning-alert-19
          path: alert-19.json
          if-no-files-found: error
          retention-days: 1
