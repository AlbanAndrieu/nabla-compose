name: Temporary catalog generation

on:
  push:
    branches:
      - feat/plumber-security-tooling-compose

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/plumber-security-tooling-compose
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
      - name: Generate canonical catalog
        run: python scripts/generate-service-topology.py
      - name: Commit generated catalog
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/services.json catalog/service-topology.json; then
            echo 'Catalog already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/services.json catalog/service-topology.json
          git commit -m 'chore(catalog): regenerate security tooling topology'
          git push origin HEAD:feat/plumber-security-tooling-compose
