---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Terragrunt CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["master"]
    paths:
      - root.hcl
      - infrastructure/**
      - terraform/**
      - .github/workflows/terragrunt-ci.yaml
  workflow_dispatch:

concurrency:
  group: terragrunt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: OpenTofu / Terragrunt static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TERRAGRUNT_VERSION: "0.97.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check OpenTofu formatting
        shell: bash
        run: tofu fmt -check -recursive terraform

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}"
          curl --fail --location --silent --show-error \
            "${base_url}/terragrunt_linux_amd64" \
            --output "${RUNNER_TEMP}/terragrunt_linux_amd64"
          curl --fail --location --silent --show-error \
            "${base_url}/SHA256SUMS" \
            --output "${RUNNER_TEMP}/terragrunt_SHA256SUMS"
          grep ' terragrunt_linux_amd64$' "${RUNNER_TEMP}/terragrunt_SHA256SUMS" \
            > "${RUNNER_TEMP}/terragrunt_SHA256SUMS_linux_amd64"
          (
            cd "${RUNNER_TEMP}"
            sha256sum --check terragrunt_SHA256SUMS_linux_amd64
          )

          install_dir="${RUNNER_TEMP}/bin"
          mkdir -p "${install_dir}"
          install -m 0755 "${RUNNER_TEMP}/terragrunt_linux_amd64" "${install_dir}/terragrunt"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Tool versions
        shell: bash
        run: |
          tofu version
          terragrunt --version

      - name: Check Terragrunt HCL formatting
        shell: bash
        run: terragrunt hcl fmt --check --diff

      - name: Initialize Garage module with committed provider lock
        working-directory: terraform/garage
        shell: bash
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate Garage OpenTofu module
        working-directory: terraform/garage
        shell: bash
        run: tofu validate -no-color

      - name: Initialize TrueNAS module with committed provider lock
        working-directory: terraform/truenas
        shell: bash
        run: tofu init -backend=false -input=false -lockfile=readonly

      - name: Validate TrueNAS OpenTofu module
        working-directory: terraform/truenas
        shell: bash
        run: tofu validate -no-color

      - name: Publish static-check summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🏗️ Infrastructure static checks"
            echo
            echo "PR validation intentionally runs on a GitHub-hosted runner."
            echo "It does **not** load homelab credentials, contact the internal state backend, or run a real Terragrunt plan."
            echo
            echo "- OpenTofu: \`fmt -check\`"
            echo "- Terragrunt: \`hcl fmt --check --diff\`"
            echo "- Garage provider: committed dependency lock enforced read-only"
            echo "- Garage module: \`init -backend=false -lockfile=readonly\` + \`validate\`"
            echo "- TrueNAS provider: committed dependency lock enforced read-only"
            echo "- TrueNAS module: \`init -backend=false -lockfile=readonly\` + \`validate\`"
            echo "- Real plans/applies remain trusted manual operations on the private runner."
          } >> "${GITHUB_STEP_SUMMARY}"
