---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Terragrunt CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["master"]
    paths:
      - root.hcl
      - infrastructure/**
      - terraform/**
      - .github/workflows/terragrunt-ci.yaml
  workflow_dispatch:

concurrency:
  group: terragrunt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: OpenTofu / Terragrunt static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TERRAGRUNT_VERSION: "0.97.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}"
          curl --fail --location --silent --show-error \
            "${base_url}/terragrunt_linux_amd64" \
            --output /tmp/terragrunt_linux_amd64
          curl --fail --location --silent --show-error \
            "${base_url}/SHA256SUMS" \
            --output /tmp/terragrunt_SHA256SUMS
          grep ' terragrunt_linux_amd64$' /tmp/terragrunt_SHA256SUMS \
            > /tmp/terragrunt_SHA256SUMS_linux_amd64
          (
            cd /tmp
            sha256sum --check terragrunt_SHA256SUMS_linux_amd64
          )
          sudo install -m 0755 /tmp/terragrunt_linux_amd64 /usr/local/bin/terragrunt

      - name: Tool versions
        shell: bash
        run: |
          tofu version
          terragrunt --version

      - name: Check OpenTofu formatting
        shell: bash
        run: tofu fmt -check -recursive terraform

      - name: Check Terragrunt HCL formatting
        shell: bash
        run: terragrunt hcl fmt --check --diff

      - name: Publish static-check summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 🏗️ Infrastructure static checks"
            echo
            echo "PR validation intentionally runs on a GitHub-hosted runner."
            echo "It does **not** load homelab credentials, contact the internal state backend, or run a real Terragrunt plan."
            echo
            echo "- OpenTofu: \`fmt -check\`"
            echo "- Terragrunt: \`hcl fmt --check --diff\`"
            echo "- Real plans remain a trusted/manual operation until a private isolated runner is explicitly enabled."
          } >> "${GITHUB_STEP_SUMMARY}"
