---
name: Pre-commit

on:
  pull_request:
    branches: [master]
    paths:
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - "AGENTS.md"
      - "mise.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.json5"
      - "**/*.sh"
      - "**/*.hcl"
      - "**/*.tofu"
      - "**/Dockerfile*"
      - "Makefile"
      - "Taskfile.yml"
  workflow_dispatch:

# TEMPORARY branch-local write permission used only to commit canonical generated
# catalog contracts during repair. Restore to `contents: read` before merge.
permissions:
  contents: write

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run repository quality gate on PR changes
        id: quality
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/quality-gate.sh

      - name: Commit canonical generated catalog repair
        if: github.event_name == 'pull_request' && steps.quality.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git add catalog/services.json catalog/service-topology.json
          if git diff --cached --quiet; then
            echo "No generated catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(catalog): restore canonical generated contracts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Archive generated catalog repair output
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-catalog-repair
          path: |
            catalog/services.json
            catalog/service-topology.json
          retention-days: 1
          if-no-files-found: error

      - name: Fail when quality gate failed without a generated fix
        if: github.event_name == 'pull_request' && steps.quality.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Run pre-commit on all files
        if: github.event_name != 'pull_request'
        run: pre-commit run --all-files --show-diff-on-failure
