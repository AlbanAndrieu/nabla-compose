name: Temporary service catalog regeneration

on:
  push:
    branches:
      - refactor/canonical-service-presentation

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Regenerate canonical topology and consumers
        run: |
          python scripts/generate-service-topology.py
          python scripts/generate-service-consumers.py

      - name: Commit deterministic generated artifacts
        run: |
          if git diff --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(catalog): regenerate service topology"
          git push
