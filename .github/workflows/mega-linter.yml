---
name: MegaLinter

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - ".mega-linter.yml"
      - ".github/workflows/**"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.json5"
      - "**/*.sh"
      - "**/Dockerfile*"
      - "Makefile"
      - "Taskfile.yml"
  workflow_dispatch:

concurrency:
  group: mega-linter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-mega-linter:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        continue-on-error: true
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          APPLY_FIXES: none
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render MegaLinter errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="megalinter-reports/megalinter-report.md"
          sarif="megalinter-reports/megalinter-report.sarif"

          if [[ -f "$report" ]]; then
            {
              echo "## 🔎 MegaLinter report"
              echo
              cat "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f "$sarif" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif = Path("megalinter-reports/megalinter-report.sarif")
          data = json.loads(sarif.read_text(encoding="utf-8"))
          count = 0
          for run in data.get("runs", []):
              tool = run.get("tool", {}).get("driver", {}).get("name", "MegaLinter")
              rules = {r.get("id"): r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
              for result in run.get("results", []):
                  level = result.get("level", "error")
                  if level not in {"error", "warning"}:
                      continue
                  message = result.get("message", {}).get("text", "Lint issue").replace("\n", " ")
                  rule_id = result.get("ruleId", "")
                  rule = rules.get(rule_id, {})
                  locations = result.get("locations", [])
                  location = locations[0].get("physicalLocation", {}) if locations else {}
                  artifact = location.get("artifactLocation", {}).get("uri", "")
                  region = location.get("region", {})
                  line = region.get("startLine")
                  column = region.get("startColumn")
                  command = "warning" if level == "warning" else "error"
                  props = []
                  if artifact:
                      props.append(f"file={artifact}")
                  if line:
                      props.append(f"line={line}")
                  if column:
                      props.append(f"col={column}")
                  title = f"{tool}: {rule_id}" if rule_id else tool
                  title = title.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  text = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  meta = ",".join(props + [f"title={title}"])
                  print(f"::{command} {meta}::{text}")
                  count += 1
          print(f"Rendered {count} MegaLinter annotation(s)")
          PY
          fi

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Fail when MegaLinter found errors
        if: steps.ml.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=MegaLinter failed::Open the job summary and annotations for actionable lint errors."
          exit 1
