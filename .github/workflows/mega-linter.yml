---
name: MegaLinter

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - ".mega-linter.yml"
      - ".github/workflows/**"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.json5"
      - "**/*.sh"
      - "**/Dockerfile*"
      - "Makefile"
      - "Taskfile.yml"
  workflow_dispatch:

concurrency:
  group: mega-linter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-mega-linter:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        continue-on-error: true
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          APPLY_FIXES: none
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish MegaLinter job summary
        if: always()
        shell: bash
        env:
          MEGALINTER_OUTCOME: ${{ steps.ml.outcome }}
        run: |
          set -euo pipefail
          report="megalinter-reports/megalinter-report.md"

          {
            echo "## 🧹 MegaLinter"
            echo
            if [[ "${MEGALINTER_OUTCOME}" == "success" ]]; then
              echo "> ✅ All enabled MegaLinter checks passed."
            else
              echo "> ❌ MegaLinter found issues. See the table below, PR report, and Code Scanning annotations."
            fi
            echo

            if [[ -f "${report}" ]]; then
              cat "${report}"
            else
              echo "MegaLinter did not produce its Markdown report."
            fi

            echo
            echo "### GitHub reporting"
            echo "- SARIF findings are uploaded to **Code Scanning** when available."
            echo "- The full raw MegaLinter output is attached as a workflow artifact."
            echo "- MegaLinter also maintains a summary comment on pull requests."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload MegaLinter SARIF to GitHub Code Scanning
        if: always() && hashFiles('megalinter-reports/megalinter-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter
          wait-for-processing: true

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Fail when MegaLinter found errors
        if: steps.ml.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=MegaLinter failed::See the PR summary, Code Scanning findings, and MegaLinter artifact for details."
          exit 1
