name: ClickHouse 2FAuth sync (temporary)

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/clickhouse-2fauth-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generator dependencies
        run: python -m pip install PyYAML
      - name: Regenerate service consumers and catalog
        run: |
          python scripts/generate-service-consumers.py
          python scripts/generate-service-topology.py
      - name: Commit generated contracts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/homarr/generated/apps.json apps/gatus/config/config.yml apps/autokuma/static/generated-monitors.json catalog/services.json catalog/service-topology.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(catalog): sync renamed 2FAuth contracts'
          git push
