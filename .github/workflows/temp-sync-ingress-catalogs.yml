---
name: Temporary ingress catalog sync

on:
  push:
    branches:
      - fix/garage-traefik-authoritative-topology

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(catalog): regenerate ingress contracts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/garage-traefik-authoritative-topology
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Generate authoritative contracts
        run: |
          python scripts/generate-service-topology.py
          python scripts/generate-service-consumers.py

      - name: Commit generated contracts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            catalog/services.json \
            catalog/service-topology.json \
            apps/homarr/generated/apps.json \
            apps/gatus/config/config.yml \
            apps/autokuma/static/generated-monitors.json
          if git diff --cached --quiet; then
            echo "Generated contracts already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): regenerate ingress contracts"
          git push origin HEAD:fix/garage-traefik-authoritative-topology
