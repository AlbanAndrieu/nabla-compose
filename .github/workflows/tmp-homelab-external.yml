---
name: Temporary homelab external catalog reconciliation

on:
  push:
    branches:
      - feat/scanopy-homelab
    paths:
      - .github/workflows/tmp-homelab-external.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set selected services external
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("catalog/homelab-services.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          services = payload["services"]
          targets = {
              "AdGuard Home",
              "Prometheus",
              "Grafana",
              "Gatus",
              "Uptime Kuma",
              "Affine",
              "FreshRSS",
              "Clickhouse",
          }

          by_name = {item["name"]: item for item in services}
          missing = sorted(targets - by_name.keys())
          if missing:
              raise SystemExit(f"missing services: {missing}")

          for name in sorted(targets):
              by_name[name]["external"] = True

          joplin = by_name.get("Joplin")
          if joplin is None:
              services.append(
                  {
                      "id": "joplin",
                      "name": "Joplin",
                      "icons": ["fas fa-note-sticky"],
                      "description": "Private Joplin synchronization server",
                      "internalHost": "172.17.0.24",
                      "internalPort": 22300,
                      "internalSecure": False,
                      "tunnelUrl": "https://joplin.int.albandrieu.com",
                      "tunnelSecure": True,
                      "iconSrc": "assets/selfh-icons/joplin.png",
                      "external": True,
                  }
              )
          else:
              joplin.update(
                  {
                      "id": "joplin",
                      "internalHost": "172.17.0.24",
                      "internalPort": 22300,
                      "internalSecure": False,
                      "tunnelUrl": "https://joplin.int.albandrieu.com",
                      "tunnelSecure": True,
                      "external": True,
                  }
              )

          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m json.tool catalog/homelab-services.json >/dev/null
          python3 -m pytest -q tests/test_homelab_external_services_contract.py

      - name: Commit catalog update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/homelab-services.json; then
            echo "Catalog already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/homelab-services.json
          git commit -m "fix(catalog): expose selected homelab services"
          git push origin HEAD:feat/scanopy-homelab
