---
name: PR192 regenerate service catalog

on:
  push:
    paths:
      - ".github/workflows/pr192-regenerate-catalog.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/sentry-kafka-suricata-post191'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/sentry-kafka-suricata-post191
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"

      - name: Regenerate catalog and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
          python scripts/generate-service-topology.py
          git diff --check
          git status --short
          git rm .github/workflows/pr192-regenerate-catalog.yml
          git add catalog/service-topology.json catalog/services.json
          if git diff --cached --quiet; then
            echo "No catalog change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): regenerate service topology"
          git push origin HEAD:fix/sentry-kafka-suricata-post191
