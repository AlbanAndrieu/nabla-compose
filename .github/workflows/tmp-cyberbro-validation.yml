name: Temporary Cyberbro validation

on:
  push:
    branches:
      - feat/cyberbro-mcp-observability-clean
    paths:
      - .github/workflows/tmp-cyberbro-validation.yml
      - apps/cyberbro/**
      - scripts/truenas/*cyberbro*.sh
      - scripts/secrets/import_env_to_bitwarden.py
      - tests/test_cyberbro*.py
      - tests/test_secrets_renderer.py

permissions:
  contents: read

jobs:
  cyberbro-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"

      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check --quiet pytest==8.4.2 PyYAML==6.0.3

      - name: Validate shell syntax
        run: |
          bash -n scripts/truenas/bootstrap-cyberbro-env.sh
          bash -n scripts/truenas/deploy-cyberbro.sh
          bash -n scripts/truenas/diagnose-cyberbro.sh

      - name: Validate Cyberbro Compose
        run: >-
          docker compose -f apps/cyberbro/compose.yml config --quiet
          --no-interpolate --no-env-resolution

      - name: Run targeted contracts
        run: >-
          python -m pytest -q
          tests/test_secrets_renderer.py
          tests/test_cyberbro_secret_update_contract.py
          tests/test_cyberbro_truenas_contract.py
