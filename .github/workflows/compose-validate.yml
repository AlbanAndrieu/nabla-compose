---
name: Compose Validate

on:
  pull_request:
    branches: [master]
    paths:
      - "**/compose*.yml"
      - "**/compose*.yaml"
      - "**/docker-compose*.yml"
      - "**/docker-compose*.yaml"
      - ".github/workflows/compose-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate standalone Compose files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            # The repository-root docker-compose.yml is an aggregate development
            # entrypoint that includes files from git submodules (for example
            # pgwatch/). CI intentionally validates repository-owned standalone
            # Compose files without cloning every optional submodule.
            if [[ "$file" == "./docker-compose.yml" ]]; then
              echo "Skipping ${file}: aggregate Compose requires initialized git submodules"
              continue
            fi

            echo "::group::Validating ${file}"
            docker compose --project-directory "$(dirname "$file")" -f "$file" config --quiet --no-interpolate --no-env-resolution
            echo "::endgroup::"
          done < <(find . -type f \
            \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'compose.*.yml' -o -name 'compose.*.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' -o -name 'docker-compose.*.yml' -o -name 'docker-compose.*.yaml' \) \
            -not -path './.github/workflows/*' \
            -print0)
