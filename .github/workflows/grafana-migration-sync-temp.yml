---
name: Grafana migration sync (temporary)

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/grafana-truenas-migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Regenerate service consumers and catalog
        run: |
          python scripts/generate-service-consumers.py
          python scripts/generate-service-topology.py

      - name: Commit generated contracts
        run: |
          if git diff --quiet -- apps/homarr/generated/apps.json apps/gatus/config/config.yml apps/autokuma/static/generated-monitors.json catalog/services.json catalog/service-topology.json; then
            echo 'Generated contracts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/homarr/generated/apps.json apps/gatus/config/config.yml apps/autokuma/static/generated-monitors.json catalog/services.json catalog/service-topology.json
          git commit -m 'chore(grafana): regenerate service contracts'
          git push origin HEAD:${{ github.head_ref }}
