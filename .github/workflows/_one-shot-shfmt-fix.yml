name: One-shot shell formatter repair
on:
  push:
    branches: [feat/catalog-v2-runtime-secrets-20261020]
    paths: [.github/workflows/_one-shot-shfmt-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
      - name: Apply pinned shfmt only to edited agent quality gate
        run: |
          set -euo pipefail
          python -m pip install --quiet pre-commit==4.6.2
          pre-commit run shfmt --files scripts/agent-quality-gate.sh || test -n "$(git diff --name-only -- scripts/agent-quality-gate.sh)"
          git diff --check
          git diff --stat -- scripts/agent-quality-gate.sh
      - name: Commit exact formatter output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- scripts/agent-quality-gate.sh
          if git diff --cached --quiet; then
            echo "No formatting drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ci): normalize agent quality gate shell formatting"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:refs/heads/feat/catalog-v2-runtime-secrets-20261020"
