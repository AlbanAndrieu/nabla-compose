---
name: Temporary lifecycle tests patch

on:
  push:
    branches:
      - feat/docling-joplin-codeql-101

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/docling-joplin-codeql-101
      - name: Patch stale assertions
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/self.assertIn("http:\/\/172.17.0.24:4040\/ready", compose)/c\        self.assertIn("target: http://172.17.0.24:4040/", compose)\
                  self.assertIn("url: http://172.17.0.24:4040/metrics", compose)' tests/test_truenas_app_lifecycle_contract.py
          sed -i '/self.assertIn("curl -fsS http:\/\/172.17.0.24:4040\/ready", readme)/c\        self.assertIn("curl -fsS http://172.17.0.24:4040/", readme)\
                  self.assertIn("curl -fsS http://172.17.0.24:4040/metrics", readme)' tests/test_truenas_app_lifecycle_contract.py
          sed -i '/self.assertNotIn("${UPTIME_KUMA_URL", compose)/c\        self.assertIn("AUTOKUMA__KUMA__URL: ${UPTIME_KUMA_URL:-http://172.17.0.24:31050}", compose)' tests/test_truenas_app_lifecycle_contract.py
          python3 -m unittest tests.test_truenas_app_lifecycle_contract
      - name: Commit patched contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_truenas_app_lifecycle_contract.py
          git commit -m "test(truenas): align stale lifecycle expectations"
          git push origin HEAD:feat/docling-joplin-codeql-101
