name: One-shot native AutoKuma aggregate regeneration
on:
  push:
    branches: [feat/catalog-v2-runtime-secrets-20261020]
    paths: [.github/workflows/_one-shot-autokuma-v2.yml]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'AlbanAndrieu/nabla-compose'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
      - name: Regenerate Gatus-native AutoKuma projection and validate renderer
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==9.1.1 PyYAML==6.0.3
          python scripts/generate-service-consumers.py
          python scripts/truenas/render-autokuma-monitors.py --validate-only
          python -m pytest -q --maxfail=1 --tb=short \
            tests/test_autokuma_materialization.py \
            tests/test_service_consumers_status_contract.py \
            tests/test_service_consumer_monitor_coverage.py \
            tests/test_observability_contract.py \
            tests/test_sentry_functional_observability_contract.py
          python scripts/generate-service-consumers.py --check
      - name: Commit generated output, never a credential or runtime directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- apps/homarr/generated/apps.json apps/gatus/config/config.yml apps/autokuma/static/generated-monitors.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(autokuma): carry stable monitor IDs in generated projection"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin "HEAD:refs/heads/feat/catalog-v2-runtime-secrets-20261020"
