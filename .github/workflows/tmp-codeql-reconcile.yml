---
name: Temporary CodeQL reconciliation

on:
  push:
    branches:
      - feat/docling-joplin-codeql-101

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/docling-joplin-codeql-101

      - name: Reconcile CodeQL findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "api/main.py",
              "environment = jinja2.Environment()",
              "environment = jinja2.Environment(autoescape=True)",
          )

          replace_once(
              "scripts/secrets/render_from_bitwarden.py",
              "import argparse\nimport json",
              "import argparse\nfrom contextlib import suppress\nimport json",
          )
          replace_once(
              "scripts/secrets/render_from_bitwarden.py",
              """    except Exception:\n        try:\n            os.unlink(tmp_name)\n        except FileNotFoundError:\n            pass\n        raise\n""",
              """    except Exception:\n        with suppress(FileNotFoundError):\n            os.unlink(tmp_name)\n        raise\n""",
          )

          replace_once(
              "tests/test_secrets_renderer.py",
              "import tempfile\nimport unittest\nfrom pathlib import Path\nfrom unittest import mock",
              "import tempfile\nfrom pathlib import Path\nfrom unittest import TestCase, main, mock",
          )
          replace_once(
              "tests/test_secrets_renderer.py",
              "class SecretsRendererTests(unittest.TestCase):",
              "class SecretsRendererTests(TestCase):",
          )
          replace_once(
              "tests/test_secrets_renderer.py",
              "    unittest.main()",
              "    main()",
          )

          replace_once(
              "apps/homarr/sync.py",
              "import os\nimport sys\nimport time",
              "import os\nimport time",
          )

          replace_once(
              "tests/test_cloudflare_dns_topology_followup.py",
              """    assert \"hello.int.albandrieu.com\" in exceptions\n""",
              """    exception_hosts = {\n        line.strip()\n        for line in exceptions.splitlines()\n        if line.strip() and not line.lstrip().startswith(\"#\")\n    }\n    assert \"hello.int.albandrieu.com\" in exception_hosts\n""",
          )

          replace_once(
              "tests/test_codeql_101_contract.py",
              '"""Regression contract for CodeQL alert #101."""',
              '"""Regression contracts for CodeQL URL-sanitization alerts #101/#102."""',
          )
          replace_once(
              "tests/test_codeql_101_contract.py",
              "    assert '\"cloudflareaccess.com\" in location' not in source\n",
              "    assert '\"cloudflareaccess.com\" in location' not in source\n    assert '\"/cdn-cgi/access/\" in location' not in source\n",
          )
          PY

      - name: Validate reconciled files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            api/main.py \
            apps/homarr/sync.py \
            scripts/secrets/render_from_bitwarden.py \
            tests/test_cloudflare_dns_topology_followup.py \
            tests/test_codeql_101_contract.py \
            tests/test_secrets_renderer.py
          python3 -m unittest tests.test_secrets_renderer
          python3 -m pytest -q \
            tests/test_cloudflare_dns_topology_followup.py \
            tests/test_codeql_101_contract.py

      - name: Commit reconciled findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/main.py \
            apps/homarr/sync.py \
            scripts/secrets/render_from_bitwarden.py \
            tests/test_cloudflare_dns_topology_followup.py \
            tests/test_codeql_101_contract.py \
            tests/test_secrets_renderer.py
          git commit -m "fix(codeql): resolve remaining Python findings"
          git push origin HEAD:feat/docling-joplin-codeql-101
