---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Terragrunt CD

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Confirm the trusted TrueNAS Terragrunt apply"
        required: true
        default: false
        type: boolean

concurrency:
  group: terragrunt-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  TG_NON_INTERACTIVE: "true"
  TRUENAS_ENABLED: "true"
  TRUENAS_READ_ONLY: "false"
  TRUENAS_DESTROY_PROTECTION: "true"
  TRUENAS_INSECURE_SKIP_VERIFY: "false"

jobs:
  apply:
    if: ${{ inputs.confirm_apply }}
    runs-on: infra-runners
    environment: TrueNAS
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup infrastructure tools
        shell: bash
        run: mise install opentofu terragrunt

      - name: Validate trusted runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in TRUENAS_URL TRUENAS_USERNAME TRUENAS_API_KEY TRUENAS_POOL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if ((${#missing[@]} > 0)); then
            printf 'Missing required runner environment variables: %s\n' "${missing[*]}" >&2
            echo "Inject them through the trusted runner/secret boundary; do not commit values to the repository." >&2
            exit 1
          fi

          mise exec -- opentofu version
          mise exec -- terragrunt --version

      - name: Terragrunt init
        shell: bash
        run: mise exec -- terragrunt run --all -- init -upgrade

      - name: Terragrunt apply
        shell: bash
        run: mise exec -- terragrunt run --all -- apply -auto-approve
