name: Temporary topology regeneration

on:
  push:
    branches:
      - fix/cloudflare-dns-topology-contract

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-dns-topology-contract
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Regenerate declared topology
        run: python scripts/generate-service-topology.py
      - name: Validate generated topology contracts
        run: |
          python scripts/generate-service-topology.py --check
          python -m unittest tests.test_fastapi_sample_topology_contract
      - name: Commit generated catalogs and remove temporary workflow
        run: |
          rm .github/workflows/temp-regenerate-topology-networks.yml
          git add catalog/service-topology.json catalog/services.json .github/workflows/temp-regenerate-topology-networks.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(topology): regenerate rebased catalog'
          git push origin HEAD:fix/cloudflare-dns-topology-contract
