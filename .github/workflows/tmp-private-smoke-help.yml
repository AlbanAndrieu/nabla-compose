---
name: Temporary private smoke help

on:
  push:
    branches: [feat/docling-joplin-codeql-101]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/docling-joplin-codeql-101
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
      - name: Normalize help text and validate contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/talos/smoke-fastapi-sample.sh")
          text = path.read_text(encoding="utf-8")
          old = "deploy/update the smoke workload and verify rollout + public endpoints"
          new = "deploy/update the smoke workload and verify rollout + private LAN endpoints"
          if old not in text:
              raise SystemExit("expected public-endpoint help text not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          bash -n scripts/talos/smoke-fastapi-sample.sh
          python -m unittest tests.test_kubernetes_fastapi_smoke_contract
      - name: Commit normalized help
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/talos/smoke-fastapi-sample.sh
          git commit -m "docs(kubernetes): describe smoke endpoints as private"
          git push origin HEAD:feat/docling-joplin-codeql-101
