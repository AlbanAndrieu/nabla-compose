---
name: Temporary lifecycle contract alignment

on:
  push:
    branches: [feat/docling-joplin-codeql-101]

permissions:
  contents: write

jobs:
  align:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/docling-joplin-codeql-101
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.13"
      - name: Align stale lifecycle tests with canonical runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_truenas_app_lifecycle_contract.py")
          text = tests.read_text(encoding="utf-8")
          old = '        self.assertIn("http://172.17.0.24:4040/ready", compose)\n'
          new = (
              '        self.assertIn("target: http://172.17.0.24:4040/", compose)\n'
              '        self.assertIn("url: http://172.17.0.24:4040/metrics", compose)\n'
          )
          if old not in text:
              raise SystemExit("stale Pyroscope compose assertion not found")
          text = text.replace(old, new, 1)
          old = '        self.assertNotIn("${UPTIME_KUMA_URL", compose)\n'
          new = '        self.assertIn("AUTOKUMA__KUMA__URL: ${UPTIME_KUMA_URL:-http://172.17.0.24:31050}", compose)\n'
          if old not in text:
              raise SystemExit("stale AutoKuma URL assertion not found")
          text = text.replace(old, new, 1)
          tests.write_text(text, encoding="utf-8")

          readme = Path("apps/pyroscope/README.md")
          text = readme.read_text(encoding="utf-8")
          old = '''Pyroscope is functional only when the readiness endpoint returns HTTP 200:

```bash
curl -fsS http://172.17.0.24:4040/ready
```
'''
          new = '''Pyroscope is functional only when its HTTP service responds successfully and its Prometheus exposition endpoint is readable:

```bash
curl -fsS http://172.17.0.24:4040/
curl -fsS http://172.17.0.24:4040/metrics | head
```

Do not use `/ready` as the canonical direct probe for this pinned runtime; the repository monitoring contract uses `/` for service health and `/metrics` independently for Prometheus.
'''
          if old not in text:
              raise SystemExit("stale Pyroscope README readiness block not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m unittest tests.test_truenas_app_lifecycle_contract
      - name: Commit contract alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_truenas_app_lifecycle_contract.py apps/pyroscope/README.md
          git commit -m "test(truenas): align AutoKuma and Pyroscope lifecycle contracts"
          git push origin HEAD:feat/docling-joplin-codeql-101
