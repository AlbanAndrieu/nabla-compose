---
name: Temporary catalog sync

on:
  push:
    branches:
      - feat/catalog-clickhouse-minio

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Generate catalog contracts
        run: |
          python scripts/generate-service-topology.py
          python scripts/generate-service-topology.py --check
      - name: Commit generated contracts
        run: |
          if git diff --quiet -- catalog/services.json catalog/service-topology.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/services.json catalog/service-topology.json
          git commit -m 'chore(catalog): regenerate service contracts'
          git push
