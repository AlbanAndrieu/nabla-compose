name: Temporary service consumer generation

on:
  push:
    branches:
      - feat/plumber-security-tooling-compose

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/plumber-security-tooling-compose
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3
      - name: Generate canonical service consumers
        run: python scripts/generate-service-consumers.py
      - name: Commit generated consumers
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            apps/homarr/generated/apps.json
            apps/gatus/config/config.yml
            apps/autokuma/static/generated-monitors.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Service consumers already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'chore(catalog): regenerate service consumers'
          git push origin HEAD:feat/plumber-security-tooling-compose
