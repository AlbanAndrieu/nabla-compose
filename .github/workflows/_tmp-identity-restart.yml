name: Temporary Catalog v2 identity & restart checks # reconcile all Gatus IDs
on:
  push:
    branches:
      - feat/catalog-v2-runtime-secrets-20261020
    paths:
      - .github/workflows/_tmp-identity-restart.yml
permissions:
  contents: write
jobs:
  verify-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Test generated identity and restart contracts without secrets
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest==9.1.1 PyYAML==6.0.3
          python -m pytest -q --disable-warnings --maxfail=1 --tb=short tests/test_catalog_v2_exports.py tests/test_catalog_v2_restart_plan.py
          python scripts/generate-catalog-v2-artifacts.py
          python scripts/generate-service-consumers.py --check
          python scripts/generate-catalog-v2-artifacts.py --check
          python - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('catalog/generated/identity-map.json').read_text())
          print({k:len(p[k]) for k in ('mappings','unresolved')})
          PY
      - name: Commit projections in this PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- catalog/generated/identity-map.json catalog/generated/entities.json catalog/generated/homelab.cdx.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(catalog): synchronize provenance-aware identity crosswalk'
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/feat/catalog-v2-runtime-secrets-20261020
