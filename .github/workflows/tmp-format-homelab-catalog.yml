---
name: Temporary format homelab catalog

on:
  push:
    branches:
      - feat/scanopy-homelab
    paths:
      - .github/workflows/tmp-format-homelab-catalog.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply canonical Prettier formatting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.4.2 --write catalog/homelab-services.json
          python3 -m json.tool catalog/homelab-services.json >/dev/null

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/homelab-services.json; then
            echo "Catalog already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/homelab-services.json
          git commit -m "style(catalog): apply canonical JSON formatting"
          git push origin HEAD:feat/scanopy-homelab
