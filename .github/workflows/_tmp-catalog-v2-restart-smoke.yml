name: Temporary Catalog v2 restart-plan offline smoke # retest blockers
on:
  push:
    branches: [feat/catalog-v2-runtime-secrets-20261020]
    paths: [.github/workflows/_tmp-catalog-v2-restart-smoke.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with: {python-version: '3.13'}
      - name: Validate crosswalk, restart plan and secret-safe snapshot
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML==6.0.3 pytest==9.1.1
          python scripts/generate-catalog-v2-artifacts.py --check
          python scripts/generate-service-consumers.py --check
          python -m pytest -q tests/test_catalog_v2_exports.py tests/test_catalog_v2_identity_map.py tests/test_catalog_v2_restart_plan.py
          python - <<'PY'
          from pathlib import Path
          import json
          apps = sorted({path.parent.name for path in Path("apps").glob("*/compose.yml")})
          states = [{"id": app, "state": "STOPPED" if app == "scanopy" else "RUNNING"} for app in apps]
          Path("/tmp/nabla-app-states-sanitized.json").write_text(json.dumps(states))
          PY
          python scripts/truenas/plan-catalog-v2-restart.py --app-query-json /tmp/nabla-app-states-sanitized.json --output /tmp/nabla-restart-plan.json
          python - <<'PY'
          import json
          j=json.load(open("/tmp/nabla-restart-plan.json", encoding="utf8"))
          assert j["readOnly"]
          assert len(j["apps"])>50
          assert any(x["appId"]=="scanopy" and x["stage"]=="remaining" for x in j["apps"])
          print("offline_restart_plan_ok", {k:len(v) for k,v in j["stages"].items()})
          PY
