name: Temporary PR 199 catalog generation

on:
  push:
    branches:
      - feat/cyberbro-mcp-observability
    paths:
      - .github/workflows/tmp-pr199-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/cyberbro-mcp-observability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.3

      - name: Regenerate canonical catalog and consumers
        run: |
          set -euo pipefail
          python scripts/generate-service-topology.py
          python scripts/generate-service-consumers.py

      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git add \
            catalog/service-topology.json \
            catalog/services.json \
            apps/homarr/generated/apps.json \
            apps/autokuma/static/generated-monitors.json \
            apps/gatus/config/config.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): regenerate PR 199 service consumers"
          git push origin HEAD:feat/cyberbro-mcp-observability
