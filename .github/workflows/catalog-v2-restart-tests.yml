---
name: TrueNAS Catalog v2 Restart Plan

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/truenas/plan-catalog-v2-restart.py"
      - "scripts/truenas/restart-catalog-v2-apps.py"
      - "scripts/truenas/catalog_v2_restart_dependencies.py"
      - "config/truenas/restore-optional-apps.txt"
      - "tests/test_catalog_v2_restart_plan.py"
      - "tests/test_catalog_v2_restart_waves.py"
      - "tests/test_catalog_v2_restart_dependencies.py"
      - "tests/test_catalog_v2_core_guard.py"
      - "scripts/secrets/inventory_vaultwarden.py"
      - "tests/test_vaultwarden_inventory_contract.py"
      - ".github/workflows/catalog-v2-restart-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-v2-restart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-offline:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Read-only restart contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Validate Python syntax
        run: >-
          python -m py_compile
          scripts/truenas/plan-catalog-v2-restart.py
          scripts/truenas/restart-catalog-v2-apps.py
          scripts/truenas/catalog_v2_restart_dependencies.py
          scripts/secrets/inventory_vaultwarden.py
      - name: Test planning and safety invariants (no TrueNAS access)
        run: |
          python -m pip install 'pytest==9.1.1'
          python -m pytest -q \
            tests/test_catalog_v2_restart_plan.py \
            tests/test_catalog_v2_restart_waves.py \
            tests/test_catalog_v2_restart_dependencies.py \
            tests/test_catalog_v2_core_guard.py \
            tests/test_vaultwarden_inventory_contract.py
