name: External attack surface (homelab)

# Outside-in Nuclei scan of the homelab names that reach the pfSense HAProxy.
# Scheduled and manual only: it hits production, so it is never a PR gate.
on:
  # checkov:skip=CKV_GHA_7:Manual reconnaissance uses allowlisted scan profiles and explicit WAN/CDN authorization, never build parameters.
  workflow_dispatch:
    inputs:
      scan_profile:
        description: "Manual scope (run only the selected scan)"
        required: true
        type: choice
        default: mail
        options:
          - mail
          - discovery
          - discovery-active
          - nuclei
          - network
          - tls
          - all
      confirm_active_discovery:
        description: "I authorize bounded active Amass DNS/TLS probes for the reviewed owned domains, including possible CDN hosts"
        required: true
        type: boolean
        default: false
      confirm_wan:
        description: "Confirm that the declared WAN IP is still owned and authorized for direct scanning"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: external-attack-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  WAN_ADDRESS: 82.66.4.247
  WAN_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_wan == true }}

jobs:
  nuclei:
    if: ${{ github.event_name == 'schedule' || inputs.scan_profile == 'nuclei' || inputs.scan_profile == 'all' }}
    runs-on: ubuntu-latest
    # Site Alban's 2 req/s scan never finished inside its 15 min job timeout (19/10 to 09/11).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned Nuclei with checksum verification
        shell: bash
        run: |
          bash scripts/security/install-pinned-nuclei.sh "${RUNNER_TEMP}/nuclei"
          "${RUNNER_TEMP}/nuclei" -ut

      - name: Read the declared targets and pin the HAProxy-only aliases
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/targets.txt"
          while read -r url pin; do
            [[ -z "${url}" || "${url}" == \#* ]] && continue
            if [[ ! "${url}" =~ ^https://(82\.66\.4\.247|[a-z0-9-]+(\.[a-z0-9-]+)*\.albandrieu\.com)(:[0-9]{1,5})?$ ]]; then
              echo "::error::target outside the homelab scope"
              exit 2
            fi
            # After router replacement an old address must not be probed by default.
            if [[ "${WAN_CONFIRMED}" != "true" && ( "${pin}" == "@wan" || "${url}" == "https://${WAN_ADDRESS}" ) ]]; then
              echo "Skipping direct WAN target: ownership not reconfirmed"
              continue
            fi
            if [[ "${pin}" == "@wan" ]]; then
              host="${url#https://}"
              echo "${WAN_ADDRESS} ${host%%:*}" | sudo tee -a /etc/hosts >/dev/null
            elif [[ -n "${pin}" ]]; then
              echo "::error::unknown target option"
              exit 2
            fi
            echo "${url}" >> "${RUNNER_TEMP}/targets.txt"
          done < config/security/external-attack-surface.txt
          wc -l < "${RUNNER_TEMP}/targets.txt"

      - name: Scan (bounded, non-intrusive templates)
        id: nuclei
        shell: bash
        env:
          NUCLEI_DISABLE_UPDATE_CHECK: "true"
          NUCLEI_NO_COLOR: "true"
        run: |
          set -euo pipefail
          mkdir -p nuclei-results
          # Doors only (login panels, exposed files, misconfigurations); no fuzzing, OAST, brute
          # force or default-login attempts. 20 req/s keeps ~3000 templates x 14 names under 30 min.
          "${RUNNER_TEMP}/nuclei" \
            -l "${RUNNER_TEMP}/targets.txt" \
            -pt http -ni \
            -tags panel,exposure,misconfig \
            -severity info,low,medium,high,critical \
            -etags dos,fuzz,bruteforce,intrusive,default-login \
            -rl 20 -c 10 -timeout 5 -retries 0 -stats -si 60 \
            -duc -or -jsonl -o nuclei-results/nuclei.raw.jsonl
          test -f nuclei-results/nuclei.raw.jsonl || : > nuclei-results/nuclei.raw.jsonl

      - name: Sanitize findings (no curl, extraction, URL path or response)
        id: nuclei_sanitize
        if: steps.nuclei.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/security/minimize-external-nuclei.py \
            nuclei-results/nuclei.raw.jsonl nuclei-results/nuclei.jsonl
          rm -f nuclei-results/nuclei.raw.jsonl

      - name: Summarize only sanitized findings
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.nuclei.outcome }}
          SANITIZE_OUTCOME: ${{ steps.nuclei_sanitize.outcome }}
        run: |
          {
            echo "## External attack surface"
            echo "Direct WAN scope explicitly confirmed: ${WAN_CONFIRMED}"
            if [[ "${SCAN_OUTCOME}" != "success" || "${SANITIZE_OUTCOME}" != "success" ]]; then
              echo "INCOMPLETE: no reliable findings count."
            else
              echo "| Host | Severity | Template |"
              echo "| --- | --- | --- |"
              jq -r '"| \(.host) | \(.severity) | \(.template_id) |"' nuclei-results/nuclei.jsonl | sort -u
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload findings (raw HTTP omitted, short retention)
        if: steps.nuclei.outcome == 'success' && steps.nuclei_sanitize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-attack-surface-${{ github.run_id }}
          path: nuclei-results/nuclei.jsonl
          retention-days: 7
          if-no-files-found: error

  mail-auth:
    name: Public DNS email anti-spoofing
    if: ${{ github.event_name == 'schedule' || inputs.scan_profile == 'mail' || inputs.scan_profile == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure dig is available
        run: |
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y dnsutils
          fi
      - name: Audit owned domain apices (SPF/DMARC/DKIM/MTA-STS/TLS-RPT)
        run: |
          python3 scripts/security/check-public-mail-auth.py --output public-mail-results.json
      - name: Upload value-blind mail posture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-mail-posture-${{ github.run_id }}
          path: public-mail-results.json
          retention-days: 7
          if-no-files-found: warn

  external-tcp-tls:
    name: Manual outside-in TCP and TLS evidence
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scan_profile == 'network' || inputs.scan_profile == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install bounded Nmap TCP scanner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y nmap
      - name: Scan reviewed WAN IP only; no raw banner or UDP scanning
        if: inputs.confirm_wan == true
        run: |
          # 1-1024 plus homelab app ports (8081 Nexus, 30000+ TrueNAS Apps) and the
          # Freebox OS remote-access ports (52190 HTTPS, 60146 HTTP), ~1100 ports at 10/s.
          nmap -sT -Pn -n --max-retries 1 --max-rate 10 --host-timeout 300s \
            -p 1-1024,2375,2376,3000,3100,3306,3389,4000,5432,5601,6379,6443,7000,8000,8080,8081,8082,8085,8091,8443,9090,9200,9922,10443,11434,18789,30059,30068,31085,31086,31087,31090,52190,60146 \
            -oX ports.xml 82.66.4.247
      - name: Confirm public certificates and produce minimal JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import socket
          import ssl
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ports = None
          if Path("ports.xml").is_file():
              xml = ET.parse("ports.xml")
              finished = xml.find("./runstats/finished")
              if finished is not None and finished.attrib.get("exit") == "success":
                  ports = sorted(int(p.attrib["portid"]) for p in xml.findall(".//port")
                                 if p.find("state") is not None and
                                 p.find("state").attrib.get("state") == "open")
          hosts = [("manager.albandrieu.com", 443),
                   ("truenas.albandrieu.com", 7000),
                   ("famp-albandrieu.albandrieu.com", 443),
                   ("www.albanandrieu.com", 443),
                   ("www.bababou.com", 443)]
          tls = []
          for hostname, port in hosts:
              row = {"hostname": hostname, "port": port, "status": "UNVERIFIED"}
              try:
                  with socket.create_connection((hostname, port), timeout=6) as tcp:
                      tcp.settimeout(6)
                      with ssl.create_default_context().wrap_socket(tcp, server_hostname=hostname) as conn:
                          cert = conn.getpeercert()
                          expiry = dt.datetime.fromtimestamp(
                              ssl.cert_time_to_seconds(cert["notAfter"]), dt.timezone.utc)
                          row.update(status="TLS_CERT_VERIFIED", expires_at=expiry.isoformat(),
                                     protocol=conn.version(), cipher=conn.cipher()[0])
              except (OSError, ssl.SSLError, KeyError, ValueError):
                  pass
              tls.append(row)
          with open("public-tcp-tls.json", "w", encoding="utf8") as file:
              json.dump({"vantage": "github-hosted-outside-in",
                         "port_scope": "selected_TCP_ports_not_full_65535",
                         "port_scan_status": "OBSERVED" if ports is not None else "NOT_RUN_OR_INCOMPLETE",
                         "open_tcp": ports, "tls": tls}, file, indent=2)
          print("Open TCP ports:", ports)
          print("TLS cert verified:", sum(x["status"] == "TLS_CERT_VERIFIED" for x in tls), "/", len(tls))
          PY
      - name: HEAD-only access probes for sensitive and admin paths
        shell: bash
        run: |
          python3 scripts/security/check-public-exposure-paths.py \
            --output public-path-head.json
      - name: Upload minimized network report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-tcp-tls-${{ github.run_id }}
          path: |
            public-tcp-tls.json
            public-path-head.json
          retention-days: 7
          if-no-files-found: warn

  tls-deep:
    name: Manual public TLS protocol and certificate audit
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scan_profile == 'tls' || inputs.scan_profile == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout owned scope
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout reviewed testssl.sh stable-branch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: testssl/testssl.sh
          ref: adf4dd45ed5a1a0e29097b747cbfc43d7b193821
          path: .ctem/testssl
          persist-credentials: false
      - name: Audit public TLS frontends; minimize results before upload
        run: |
          python3 scripts/security/run-public-tls-audit.py \
            --scanner .ctem/testssl/testssl.sh --output public-tls-audit.json
      - name: Upload sanitized TLS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-tls-audit-${{ github.run_id }}
          path: public-tls-audit.json
          retention-days: 7
          if-no-files-found: warn

  mail-deep:
    name: Independent DNS mail policy evidence (checkdmarc and Nuclei)
    if: ${{ github.event_name == 'schedule' || inputs.scan_profile == 'mail' || inputs.scan_profile == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout approved scope
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout only reviewed DNS templates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: projectdiscovery/nuclei-templates
          ref: 745c8d83f2daa49b5525793229a358044a8bb3e7
          path: .ctem/dns-templates
          sparse-checkout: |
            dns/dmarc-detect.yaml
            dns/spf-record-detect.yaml
            dns/spf-limit-lookup.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install reviewed mail validators
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/ctem-mail"
          "${RUNNER_TEMP}/ctem-mail/bin/pip" install --disable-pip-version-check --quiet 'checkdmarc==6.0.3'
          bash scripts/security/install-pinned-nuclei.sh "${RUNNER_TEMP}/nuclei"
      - name: Audit reviewed public domains without guessed DKIM selectors
        run: |
          python3 scripts/security/run-public-mail-deep.py \
            --checkdmarc "${RUNNER_TEMP}/ctem-mail/bin/checkdmarc" \
            --nuclei "${RUNNER_TEMP}/nuclei" \
            --templates .ctem/dns-templates/dns \
            --output public-mail-deep.json
      - name: Upload minimal DNS policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-mail-deep-${{ github.run_id }}
          path: public-mail-deep.json
          retention-days: 7
          if-no-files-found: warn

  amass-discovery:
    name: Outside-in Amass asset inventory (passive or explicitly active)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scan_profile == 'discovery' || inputs.scan_profile == 'discovery-active' || inputs.scan_profile == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reviewed scope
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install reviewed Amass release and verify archive
        run: |
          bash scripts/security/install-pinned-amass.sh "${RUNNER_TEMP}/amass"
      - name: Discover owned domains from outside the LAN
        shell: bash
        env:
          PROFILE: ${{ inputs.scan_profile }}
          ACTIVE_APPROVED: ${{ inputs.confirm_active_discovery }}
        run: |
          set -euo pipefail
          mode=passive
          if [[ "${PROFILE}" == discovery-active ]]; then
            if [[ "${ACTIVE_APPROVED}" != "true" ]]; then
              echo "::error::Active discovery requires explicit owned-domain approval."
              exit 2
            fi
            mode=active
          fi
          # GitHub external runner: ephemeral local Amass DB, never a TrueNAS
          # PostgreSQL connection and never private candidate uploads.
          python3 scripts/security/run-amass-inventory.py \
            --amass "${RUNNER_TEMP}/amass" --mode "${mode}" \
            --output public-amass-summary.json
      - name: Summarize discovery outcome without private hostnames
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("public-amass-summary.json")
          status = "NOT_RUN"
          candidates = 0
          if report.is_file():
              try:
                  summary = json.loads(report.read_text(encoding="utf-8"))
                  status = str(summary.get("status", "INVALID_REPORT"))
                  counts = summary.get("counts", {})
                  if isinstance(counts, dict):
                      candidates = sum(int(value) for value in counts.values()
                                       if isinstance(value, int) and value >= 0)
              except (ValueError, OSError, TypeError):
                  status = "INVALID_REPORT"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Amass owned-domain discovery\n\n")
              out.write(f"Status: {status} · asset candidates: {candidates}\n\n")
              if status != "OBSERVED_NOT_CERTIFIED":
                  out.write("INCOMPLETE — no clean inventory or zero-findings claim.\n")
          PY
      - name: Upload counts only, never discovered names or raw graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-amass-summary-${{ github.run_id }}
          path: public-amass-summary.json
          retention-days: 7
          if-no-files-found: warn
