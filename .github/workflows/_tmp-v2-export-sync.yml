name: Temporary v2 export sync
on:
  push:
    branches: [feat/catalog-v2-runtime-secrets-20261020]
    paths: [.github/workflows/_tmp-v2-export-sync.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --quiet PyYAML==6.0.3
          python scripts/generate-catalog-v2-artifacts.py
          python scripts/generate-service-consumers.py
          python scripts/generate-catalog-v2-artifacts.py --check
          python scripts/generate-service-consumers.py --check
      - name: Commit generated projections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- catalog/generated/entities.json catalog/generated/homelab.cdx.json apps/homarr/generated/apps.json apps/gatus/config/config.yml apps/autokuma/static/generated-monitors.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(catalog): sync Akvorado and Scanopy v2 projections'
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:refs/heads/feat/catalog-v2-runtime-secrets-20261020
