---
name: Temporary sync generated consumers

on:
  push:
    branches:
      - feat/secrets-first-migration-foundation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Generate canonical consumer configurations
        run: python scripts/generate-service-consumers.py

      - name: Commit generated configurations
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            apps/homarr/generated/apps.json \
            apps/gatus/config/config.yml \
            apps/autokuma/static/generated-monitors.json
          if git diff --cached --quiet; then
            echo "Generated consumer configurations are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(consumers): sync generated configurations"
          git push origin HEAD:feat/secrets-first-migration-foundation
