---
name: Secret Contract

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/secret-contract.yml"
      - "config/secrets/**"
      - "scripts/secrets/**"
      - "tests/test_secrets_renderer.py"
      - "apps/*/compose.yml"
      - "apps/*/compose.yaml"
      - "apps/*/docker-compose.yml"
      - "apps/*/docker-compose.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Secret Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Validate manifest JSON
        run: python -m json.tool config/secrets/manifest.json >/dev/null

      - name: Run secret contract tests
        run: python -m unittest tests.test_secrets_renderer -v
