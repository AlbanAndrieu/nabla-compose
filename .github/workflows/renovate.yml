---
name: Renovate

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Renovate
        if: env.RENOVATE_TOKEN != ''
        uses: renovatebot/github-action@87c405b9750f1b6affae06311395b50e3882d54f # v42.0.6
        with:
          token: ${{ env.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: AlbanAndrieu/nabla-compose
          RENOVATE_CONFIG_FILE: renovate.json

      - name: Skip Renovate when token is unavailable
        if: env.RENOVATE_TOKEN == ''
        run: echo "RENOVATE_TOKEN is not configured; skipping Renovate."
