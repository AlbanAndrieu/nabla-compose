---
name: Reconcile PR60 rebase

on:
  push:
    branches:
      - feat/secrets-first-migration-foundation
    paths:
      - .github/workflows/reconcile-pr60-rebase.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pytest

      - name: Preserve secrets-first roadmap intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/homelab-platform-migration-roadmap.md")
          text = path.read_text(encoding="utf-8")
          heading = "## P0 hard gate — secrets-first migration"
          if heading not in text:
              anchor = "## Target principles\n"
              section = """## P0 hard gate — secrets-first migration\n\nBefore continuing broad native-App-to-Compose cutovers, treat the Vaultwarden migration foundation as a P0 gate:\n\n- use `docs/secrets-migration-roadmap.md` as the detailed execution plan;\n- inventory secret variable names and consumers without committing values;\n- keep existing git-crypt shell exports and root-restricted TrueNAS `.env` files as temporary migration inputs only;\n- make Vaultwarden the interim source of truth for human-managed homelab secrets;\n- validate one canary service end-to-end before expanding the migration;\n- preserve migration-critical encryption keys exactly until their dependent data has been verified;\n- keep machine-secret migration to HashiCorp Vault as the later Kubernetes-oriented target.\n\nThis gate complements the current CrowdSec, TrueNAS/Talos and service-migration work; it must not roll those already-merged changes back.\n\n"""
              if anchor not in text:
                  raise SystemExit("Target-principles anchor not found")
              text = text.replace(anchor, section + anchor, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate service contracts
        run: |
          python scripts/generate-service-topology.py
          python scripts/generate-service-consumers.py
          python scripts/generate-service-topology.py --check
          python scripts/generate-service-consumers.py --check

      - name: Run secrets renderer tests
        run: python -m pytest -q tests/test_secrets_renderer.py

      - name: Commit reconciled state and remove helper
        shell: bash
        run: |
          rm .github/workflows/reconcile-pr60-rebase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(secrets): reconcile PR60 with current master"
          git push origin HEAD
