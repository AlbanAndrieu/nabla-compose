---
name: Entra ID lab - signed HCP OpenTofu

on:
  pull_request:
    branches: [master]
    paths:
      - terraform/entra-id-lab/**
      - scripts/entra/**
      - tests/test_entra_*.py
      - .pre-commit-config.yaml
      - .github/workflows/entra-id-lab.yml
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, plan, apply]
        default: validate
        required: true
      expected_sha:
        type: string
        required: false
        description: "Exact 40-character master SHA for plan/apply"
      plan_run_id:
        type: string
        required: false
        description: "Apply only: successful plan run ID containing the signed challenge"
      signature_b64:
        type: string
        required: false
        description: "Apply only: base64 OpenSSH FIDO2 signature of challenge.json"

permissions:
  contents: read

concurrency:
  group: entra-id-lab-remote-state
  cancel-in-progress: false

jobs:
  static:
    name: Entra policy, zizmor and signature contracts (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Offline security and formatting
        shell: bash
        run: |
          set -euo pipefail
          tofu fmt -check -diff terraform/entra-id-lab
          bash -n scripts/entra/entra-lab-preflight.sh
          python3 -m unittest tests.test_entra_id_lab_contract tests.test_entra_plan_policy tests.test_entra_workflow_contract tests.test_entra_approval -v
      - name: zizmor pinned offline audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check zizmor==1.31.1
          zizmor --offline .github/workflows/entra-id-lab.yml

  # This gate has NO Entra OIDC identity and NO HCP secret. Unapproved
  # changes cannot start the privileged apply job.
  approval_gate:
    name: Verify hardware signature before privileged job
    needs: static
    if: "${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: "${{ github.token }}"
      PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
      SIGNATURE_B64: "${{ inputs.signature_b64 }}"
      ALLOWED_SIGNER: "${{ vars.ENTRA_APPROVAL_ALLOWED_SIGNER }}"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download original challenge and verify YubiKey approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || exit 2
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          [[ "$ALLOWED_SIGNER" == "entra-operator sk-ssh-ed25519@openssh.com "* ]] || exit 2
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.event == "workflow_dispatch" and .head_branch == "master" and .head_sha == $sha and .conclusion == "success"' \
            <<< "$info" >/dev/null || exit 2
          umask 077
          mkdir -p "$RUNNER_TEMP/approval"
          gh run download "$PLAN_RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name "entra-challenge-$PLAN_RUN_ID" --dir "$RUNNER_TEMP/approval"
          printf '%s' "$SIGNATURE_B64" | base64 --decode > "$RUNNER_TEMP/approval/challenge.json.sig"
          printf '%s\n' "$ALLOWED_SIGNER" > "$RUNNER_TEMP/approval/allowed_signers"
          m="$RUNNER_TEMP/approval/challenge.json"
          python3 scripts/entra/approval.py verify --metadata-only \
            --manifest "$m" --signature "$RUNNER_TEMP/approval/challenge.json.sig" \
            --allowed-signer "$ALLOWED_SIGNER" \
            --allowed-signers-file "$RUNNER_TEMP/approval/allowed_signers" \
            --sha "$GITHUB_SHA" --tenant "$(jq -r '.tenant' "$m")" \
            --organization "$(jq -r '.hcp_organization' "$m")" \
            --workspace "$(jq -r '.hcp_workspace' "$m")" --run-id "$PLAN_RUN_ID"

  remote:
    name: "Entra HCP ${{ inputs.operation }} (hardware gated)"
    needs: [static, approval_gate]
    if: "${{ always() && needs.static.result == 'success' && github.event_name == 'workflow_dispatch' && (inputs.operation == 'plan' || (inputs.operation == 'apply' && needs.approval_gate.result == 'success')) }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: "${{ inputs.operation == 'apply' && 'entra-lab-apply' || 'entra-lab-plan' }}"
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_ci_use_oidc: "true"
      TF_VAR_enable_group_management: "false"
      TF_VAR_enable_user_management: "false"
      TF_VAR_lab_tenant_confirmed: "true"
      TF_VAR_tenant_id: "${{ vars.ENTRA_LAB_TENANT_ID }}"
      TF_VAR_ci_graph_client_id: "${{ vars.ENTRA_GRAPH_CLIENT_ID }}"
      ARM_CLIENT_ID: "${{ vars.ENTRA_GRAPH_CLIENT_ID }}"
      ARM_TENANT_ID: "${{ vars.ENTRA_LAB_TENANT_ID }}"
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      TF_TOKEN_app_terraform_io: "${{ secrets.HCP_TF_TOKEN }}"
      HCP_ORG: "${{ vars.HCP_TF_ORGANIZATION }}"
      HCP_WORKSPACE: "${{ vars.HCP_TF_WORKSPACE }}"
      APPLY_ENABLED: "${{ vars.ENTRA_LAB_APPLY_ENABLED }}"
      ALLOWED_SIGNER: "${{ vars.ENTRA_APPROVAL_ALLOWED_SIGNER }}"
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Deny wrong branch, SHA, identity, tenant, or missing HCP configuration
        shell: bash
        env:
          OPERATION: "${{ inputs.operation }}"
          EXPECTED_SHA: "${{ inputs.expected_sha }}"
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          SIGNATURE_B64: "${{ inputs.signature_b64 }}"
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]] || exit 2
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 2
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || exit 2
          [[ "$TF_VAR_tenant_id" =~ ^[0-9a-fA-F-]{36}$ ]] || exit 2
          [[ "$ARM_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || exit 2
          [[ "$HCP_ORG" =~ ^[A-Za-z0-9_-]{2,70}$ ]] || exit 2
          [[ "$HCP_WORKSPACE" =~ ^[A-Za-z0-9_-]{2,70}$ ]] || exit 2
          [[ -n "$TF_TOKEN_app_terraform_io" ]] || exit 2
          [[ -z "${ARM_CLIENT_SECRET:-}" && -z "${ARM_ACCESS_KEY:-}" && -z "${ARM_SAS_TOKEN:-}" ]] || exit 2
          if [[ "$OPERATION" == apply ]]; then
            [[ "$APPLY_ENABLED" == true ]] || exit 2
            [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ && ${#SIGNATURE_B64} -gt 32 ]] || exit 2
            [[ "$ALLOWED_SIGNER" == "entra-operator sk-ssh-ed25519@openssh.com "* ]] || exit 2
          fi
          echo "HCP local execution and Entra WIF are required; no credential printed."
      - name: Start open-source Falco runtime detector (ephemeral runner)
        uses: falcosecurity/falco-actions/start@558a3ceeee9403e1c875ffbeb704c34c93e24752
        with:
          mode: live
          falco-version: "0.45.2"
          verbose: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false
      - name: Ensure HCP workspace uses Local mode (OpenTofu CLI executes on runner)
        shell: bash
        run: |
          set -euo pipefail
          # Python keeps the bearer token out of process argv (including Falco).
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          url = "https://app.terraform.io/api/v2/organizations/{}/workspaces/{}".format(
              os.environ["HCP_ORG"], os.environ["HCP_WORKSPACE"]
          )
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["TF_TOKEN_app_terraform_io"],
              "Content-Type": "application/vnd.api+json",
          })
          try:
              with urlopen(request, timeout=20) as response:
                  mode = json.load(response)["data"]["attributes"]["execution-mode"]
          except Exception:
              sys.exit("DENIED: HCP workspace local mode could not be verified")
          if mode != "local":
              sys.exit("DENIED: HCP must use LOCAL execution mode for OpenTofu")
          # HCP Free tokens are owners: fail if this org contains other states.
          from urllib.parse import quote
          url2 = "https://app.terraform.io/api/v2/organizations/{}/workspaces?page%5Bsize%5D=100".format(
              quote(os.environ["HCP_ORG"], safe="")
          )
          request2 = Request(url2, headers={
              "Authorization": "Bearer " + os.environ["TF_TOKEN_app_terraform_io"],
              "Content-Type": "application/vnd.api+json",
          })
          try:
              with urlopen(request2, timeout=20) as response:
                  workspace_list = json.load(response)
              names = [item["attributes"]["name"] for item in workspace_list["data"]]
              meta = workspace_list.get("meta", {}).get("pagination", {})
          except Exception:
              sys.exit("DENIED: HCP dedicated organization inventory unavailable")
          if meta.get("total-count") != 1 or names != [os.environ["HCP_WORKSPACE"]]:
              sys.exit("DENIED: HCP Free organization must contain only this disposable workspace")
          PY
      - name: Init HCP remote state (no Azure Blob/Garage)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo 'hostname = "app.terraform.io"'
            printf 'organization = "%s"\n' "$HCP_ORG"
            printf 'workspaces { name = "%s" }\n' "$HCP_WORKSPACE"
          } > "$RUNNER_TEMP/hcp.tfbackend"
          cd terraform/entra-id-lab
          test -f .terraform.lock.hcl || { echo "Missing pinned provider lockfile"; exit 2; }
          tofu init -input=false -lockfile=readonly -backend-config="$RUNNER_TEMP/hcp.tfbackend"
          tofu validate -no-color
      - name: Verify the source plan run and fetch its public challenge
        if: inputs.operation == 'apply'
        shell: bash
        env:
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
          SIGNATURE_B64: "${{ inputs.signature_b64 }}"
        run: |
          set -euo pipefail
          info="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.event == "workflow_dispatch" and .head_branch == "master" and .head_sha == $sha and .conclusion == "success"' \
            <<< "$info" >/dev/null || exit 2
          mkdir -p "$RUNNER_TEMP/entra-challenge"
          gh run download "$PLAN_RUN_ID" -R "$GITHUB_REPOSITORY" \
            --name "entra-challenge-$PLAN_RUN_ID" --dir "$RUNNER_TEMP/entra-challenge"
          test -s "$RUNNER_TEMP/entra-challenge/challenge.json" || exit 2
          umask 077
          printf '%s' "$SIGNATURE_B64" | base64 --decode > "$RUNNER_TEMP/entra-challenge/challenge.json.sig"
          test -s "$RUNNER_TEMP/entra-challenge/challenge.json.sig" || exit 2
          printf '%s\n' "$ALLOWED_SIGNER" > "$RUNNER_TEMP/entra-challenge/allowed_signers"
      - name: Fresh policy-approved plan, hardware signature, and same-plan apply
        shell: bash
        env:
          OPERATION: "${{ inputs.operation }}"
          PLAN_RUN_ID: "${{ inputs.plan_run_id }}"
        run: |
          set -euo pipefail
          umask 077
          plan="$RUNNER_TEMP/entra.tfplan"
          json="$RUNNER_TEMP/entra-plan.json"
          trap 'rm -f "$plan" "$json"' EXIT
          cd terraform/entra-id-lab
          if [[ "$OPERATION" == plan ]]; then
            tofu plan -lock=false -input=false -no-color -out="$plan"
          else
            tofu plan -input=false -lock-timeout=5m -no-color -out="$plan"
          fi
          tofu show -json "$plan" > "$json"
          python3 ../../scripts/entra/check-plan.py "$json"
          if [[ "$OPERATION" == plan ]]; then
            python3 ../../scripts/entra/approval.py create \
              --plan "$json" --output "$RUNNER_TEMP/challenge.json" \
              --sha "$GITHUB_SHA" --tenant "$TF_VAR_tenant_id" \
              --organization "$HCP_ORG" --workspace "$HCP_WORKSPACE" --run-id "$GITHUB_RUN_ID"
          else
            python3 ../../scripts/entra/approval.py verify \
              --plan "$json" --manifest "$RUNNER_TEMP/entra-challenge/challenge.json" \
              --signature "$RUNNER_TEMP/entra-challenge/challenge.json.sig" \
              --allowed-signer "$ALLOWED_SIGNER" \
              --allowed-signers-file "$RUNNER_TEMP/entra-challenge/allowed_signers" \
              --sha "$GITHUB_SHA" --tenant "$TF_VAR_tenant_id" \
              --organization "$HCP_ORG" --workspace "$HCP_WORKSPACE" --run-id "$PLAN_RUN_ID"
            tofu apply -input=false -no-color "$plan"
          fi
      - name: Upload ONLY sanitized challenge (never the state or binary plan)
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: entra-challenge-${{ github.run_id }}
          path: "${{ runner.temp }}/challenge.json"
          if-no-files-found: error
          retention-days: 1
      - name: Stop Falco and summarize runtime alerts
        if: always()
        uses: falcosecurity/falco-actions/stop@558a3ceeee9403e1c875ffbeb704c34c93e24752
        with:
          mode: live
          verbose: false
