---
name: Service Consumers

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/service-consumers.yml"
      - "catalog/service-consumers.static.yml"
      - "catalog/service-icons.json"
      - "catalog/service-topology.static.json"
      - "catalog/service-topology.schema.json"
      - "catalog/services.schema.json"
      - "scripts/generate-service-consumers.py"
      - "scripts/generate-service-topology.py"
      - "apps/*/compose.yml"
      - "apps/*/compose.yaml"
      - "apps/*/docker-compose.yml"
      - "apps/*/docker-compose.yaml"
      - "apps/homarr/sync.py"
      - "apps/homarr/generated/apps.json"
      - "apps/gatus/config/config.yml"
      - "apps/autokuma/static/generated-monitors.json"
      - "tests/test_homarr_sync.py"
      - "tests/test_service_topology_generator.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-consumers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Service Consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate consumer configurations
        run: python scripts/generate-service-consumers.py

      - name: Archive generated configurations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-consumer-configs
          path: |
            apps/homarr/generated/apps.json
            apps/gatus/config/config.yml
            apps/autokuma/static/generated-monitors.json
          retention-days: 3
          if-no-files-found: error

      - name: Verify generated configurations are committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- \
            apps/homarr/generated/apps.json \
            apps/gatus/config/config.yml \
            apps/autokuma/static/generated-monitors.json
