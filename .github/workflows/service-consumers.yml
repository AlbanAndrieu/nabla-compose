---
name: Service Consumers

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/service-consumers.yml"
      - "catalog/service-consumers.static.yml"
      - "scripts/generate-service-consumers.py"
      - "apps/*/compose.yml"
      - "apps/*/compose.yaml"
      - "apps/*/docker-compose.yml"
      - "apps/*/docker-compose.yaml"
      - "apps/homarr/generated/apps.json"
      - "apps/gatus/config/config.yml"
      - "apps/autokuma/static/generated-monitors.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-consumers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Service Consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Generate canonical contracts
        run: |
          python scripts/generate-service-topology.py
          python scripts/generate-service-consumers.py

      - name: Commit canonical generated contracts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add \
            catalog/services.json \
            catalog/service-topology.json \
            apps/homarr/generated/apps.json \
            apps/gatus/config/config.yml \
            apps/autokuma/static/generated-monitors.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(catalog): regenerate service and consumer contracts'
          git push origin "HEAD:${HEAD_REF}"

      - name: Verify clean generated state
        run: git diff --check
