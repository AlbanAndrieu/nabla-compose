---
APPLY_FIXES: none
DEFAULT_BRANCH: master
ENABLE_LINTERS:
  - ACTION_ZIZMOR
  - COPYPASTE_JSCPD
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - JSON_JSONLINT
  - JSON_PRETTIER
  - REPOSITORY_CHECKOV
  - SPELL_CODESPELL
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - BASH_SHELLCHECK
  - MAKEFILE_CHECKMAKE
  - GIT_GIT_DIFF
  - DOCKERFILE_HADOLINT
DISABLE:
  - CLOUDFORMATION
  - MARKDOWN
  - TEKTON
DISABLE_LINTERS:
  - ANSIBLE_ANSIBLE_LINT
  - PYTHON_MYPY
  - PYTHON_ISORT
  - REPOSITORY_DEVSKIM
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_TRIVY_SBOM
  - REPOSITORY_SYFT
  - REPOSITORY_KICS
  - REPOSITORY_GRYPE
  - REPOSITORY_TRUFFLEHOG
  - REPOSITORY_GITLEAKS
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRIVY
  - RST_RSTCHECK
  - TERRAFORM_TERRAGRUNT
  - TERRAFORM_TERRASCAN
  - TERRAFORM_KICS
IGNORE_GITIGNORED_FILES: true
FILTER_REGEX_EXCLUDE: >-
  (megalinter-reports/|\.megalinter_github_conf/|anything-llm/|langfuse/|litellm/|n8n/|pgwatch/|plumber-platform/|reactive/|sentry/|temporal/|\.venv/|\.direnv/|\.mypy_cache/|(^|/)docker-compose\.yml$|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
ACTION_ZIZMOR_FILTER_REGEX_EXCLUDE: (^|/)\.github/workflows/linter\.yml$
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: >-
  ((^|/)(\.vscode|\.devcontainer)/|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: >-
  ((^|/)(\.vscode|\.devcontainer)/|(^|/)catalog/service-topology\.json$|(^|/)uv\.lock$|(^|/)Pipfile\.lock$|(^|/)trivy-sbom\.json$)
YAML_PRETTIER_FILTER_REGEX_EXCLUDE: (^|/)apps/gatus/config/config\.yml$
BASH_FILTER_REGEX_EXCLUDE: (lib/)
MARKDOWN_MARKDOWN_LINK_CHECK_DISABLE_ERRORS: true
DOCKERFILE_HADOLINT_ARGUMENTS: >-
  --ignore DL3003 --ignore DL3007 --ignore DL3013 --ignore DL3016 --ignore DL3018
  --ignore DL3028 --ignore DL4001 --ignore DL4006 --ignore SC2015 --ignore SC2016
  --ignore SC2039 --ignore SC2086 --ignore SC1091
DOCKERFILE_HADOLINT_DISABLE_ERRORS: false
DOCKERFILE_HADOLINT_DISABLE_ERRORS_IF_LESS_THAN: 2
BASH_SHELLCHECK_ARGUMENTS: -e "SC2162"
BASH_SHELLCHECK_FILTER_REGEX_EXCLUDE: (test\|examples|docs/Makefile)
BASH_SHELLCHECK_DISABLE_ERRORS: false
BASH_SHELLCHECK_DISABLE_ERRORS_IF_LESS_THAN: 7
EXCLUDED_DIRECTORIES:
  - .gitlab-ci
  - node_modules
  - .venv
  - .direnv
  - .mypy_cache
  - megalinter-reports
  - .megalinter_github_conf
  - anything-llm
  - langfuse
  - litellm
  - n8n
  - pgwatch
  - plumber-platform
  - reactive
  - sentry
  - temporal
PARALLEL: true
CLEAR_REPORT_FOLDER: true
PRINT_ALPACA: false
FAIL_IF_UPDATED_SOURCES: false
SHOW_ELAPSED_TIME: true
JSON_REPORTER: true
SARIF_REPORTER: true
GITHUB_COMMENT_REPORTER: true
REPORTERS_MARKDOWN_TYPE: simple
REPORTERS_MARKDOWN_SUMMARY_TYPE: table-sections
FILEIO_REPORTER: false
UPDATED_SOURCES_REPORTER: false
VALIDATE_ALL_CODEBASE: false
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
SHOW_SKIPPED_LINTERS: false
