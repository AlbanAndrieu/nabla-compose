---
configs:
  poll-config.yml:
    content: |
      - url: https://github.com/albanandrieu/nabla-compose.git
        reference: master
        interval: 3600
        deployments:
          - name: vaultwarden
            compose_file: apps/vaultwarden/compose.yml
          - name: garage
            compose_file: apps/garage/compose.yml

# TrueNAS runtime deployment definition. The workstation uses docker-compose.yml.
# 1Password Connect is disabled; Doco-CD uses the webhook secret-provider adapter.
# kics-scan ignore
services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.85.1
    container_name: doco-cd
    restart: unless-stopped
    # user: "568:568" # TrueNAS apps user
    ports:
      - "30080:80" # Webhook endpoint
      - "9120:9120" # Prometheus metrics
    # For all available environment variables and explanations, see https://doco.cd/latest/App-Settings/

    # secrets: ["1pw_token"]
    configs:
      - source: poll-config.yml
        target: /poll-config.yml

    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
      POLL_CONFIG_FILE: /poll-config.yml
      GIT_ACCESS_TOKEN: "${GITHUB_ACCESS_TOKEN_READ_ONLY}"
      SECRET_PROVIDER: webhook
      SECRET_PROVIDER_WEBHOOK_STORES_FILE: /secret-store.yml
      # <<: *poll-config  # Uncomment this line to use the poll configuration from above (the `x-poll-config` section).
      DOCKER_HOST: tcp://docker-socket-proxy:2375

    depends_on: []
    # depends_on:
    #  op-connect-api
    #  bitwarden-api:
    #    condition: service_healthy

    volumes:
      # Comment this mount if using docker-proxy
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # The data volume (left side) can also be replaced with a bind mount to a local directory, for example:
      # - ./data:/data
      - /mnt/cpool/dococd/:/data
      - ./secret-store.yml:/secret-store.yml:ro

    cap_drop:
      - ALL

    healthcheck:
      test: [CMD, /doco-cd, healthcheck]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - default
      - intranet
      - secrets-backend

networks:
  intranet:
    external: true
    name: intranet
  # proxy:
  #   external: true
  secrets-backend:
    external: true
