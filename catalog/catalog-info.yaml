apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: pfsense
  title: pfSense
  description: Homelab firewall, router and network-edge appliance.
  links:
    - url: https://172.17.0.1:10443
      title: Administration
  labels:
    albandrieu.com/operational-state: active
    albandrieu.com/operational-criticality: critical
    albandrieu.com/business-criticality: critical
    albandrieu.com/bia-scope: direct
  tags:
    - network
    - security
  annotations:
    albandrieu.com/lan-address: 172.17.0.1
    albandrieu.com/bia-mtpd: PT1H
    albandrieu.com/bia-rto: PT15M
    albandrieu.com/bia-rpo: P1D
    albandrieu.com/bia-mbco: lan-routing-dns-and-firewalling
    albandrieu.com/bia-status: provisional
    albandrieu.com/bia-reviewed-at: "2026-09-21"
    albandrieu.com/bia-impact-operational: critical
    albandrieu.com/bia-impact-customer: high
    albandrieu.com/bia-impact-financial: low
    albandrieu.com/bia-impact-legal-regulatory: low
    albandrieu.com/bia-impact-reputation: medium
    albandrieu.com/bia-impact-confidentiality: high
    albandrieu.com/bia-impact-integrity: critical
    albandrieu.com/bia-impact-privacy: medium
spec:
  type: firewall-router
  owner: group:default/nabla-platform
  system: system:default/nabla-homelab
x-nabla:
  exposure:
    - name: home
      hostnames:
        - home.albandrieu.com
      port: 10443
      protocol: HTTPS
      visibility: lan
      gatewayRef: resource:default/pfsense
      backend: https://172.17.0.1:10443
      riskAcceptance:
        id: pfsense-home-alias-trusted-sources
        status: rejected
        reason: "home.albandrieu.com:10443 aliases the pfSense administration/API listener. This source-aware policy permits only approved stable administration sources; FastAPI Cloud direct reachability is intentionally treated as a policy failure until a controlled workload identity or out-of-band observer is used."
        control: trusted-source-allowlist
        reviewAfter: null
    - name: admin
      hostnames:
        - pfsense.albandrieu.com
      protocol: HTTPS
      visibility: lan
      gatewayRef: resource:default/pfsense
      backend: https://172.17.0.1:10443
      riskAcceptance:
        id: pfsense-admin-trusted-sources
        status: rejected
        reason: "The pfSense administration/API listener on 10443 is a trusted-source-only endpoint. FastAPI Cloud is not an approved administration source: direct reachability from that runtime is a negative exposure check and a security-policy failure. Keep administration limited to approved stable sources, use dedicated least-privilege API identities, and move durable posture/Snort telemetry to an out-of-band observer."
        control: trusted-source-allowlist
        reviewAfter: null
