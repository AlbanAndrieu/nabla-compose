---
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--log.level=${PROMETHEUS_LOG_LEVEL:-warn}"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./temporal/deployment/prometheus/config.yml
        target: /etc/prometheus/prometheus.yml
    networks: [intranet]

  telegraf:
    image: telegraf:1.35.4
    container_name: telegraf
    restart: always
    volumes:
      - ./config/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "8126:8125"
    networks: [intranet]

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    user: "0:0"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/postgres/1-global-db-overview.json
      GF_INSTALL_PLUGINS: marcusolsson-treemap-panel,grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel,grafana-worldmap-panel
    ports:
      - "${GRAFANA_PORT:-3009}:3000"
    restart: unless-stopped
    volumes:
      - ./pgwatch/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/pgwatch_dashboards.yml
      - ./pgwatch/grafana/postgres_datasource.yml:/etc/grafana/provisioning/datasources/postgres_datasource.yml
      - ./pgwatch/grafana/prometheus_datasource.yml:/etc/grafana/provisioning/datasources/prometheus_datasource.yml
      - ./pgwatch/grafana/postgres/v12:/var/lib/grafana/dashboards/postgres
      - ./pgwatch/grafana/prometheus/v12:/var/lib/grafana/dashboards/prometheus
      - ./temporal/deployment/grafana/dashboards:/var/lib/grafana/dashboards/temporal:ro
      - ./temporal/deployment/grafana/provisioning/datasources/all.yml:/etc/grafana/provisioning/datasources/temporal_datasources.yml:ro
      - ./temporal/deployment/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/provisioning/datasources/pyroscope.yml:/etc/grafana/provisioning/datasources/pyroscope.yml
      - type: bind
        source: ./temporal/deployment/grafana/grafana.ini
        target: /etc/grafana/grafana.ini
        read_only: true
    networks: [intranet]

  github-exporter:
    image: githubexporter/github-exporter:1.0.3
    container_name: github-exporter
    expose: [9171]
    ports: ["9171:9171"]
    environment:
      - REPOS=AlbanAndrieu/nabla-hooks
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks: [intranet]

  netalertx:
    image: ghcr.io/jokob-sk/netalertx:25.8.6
    container_name: netalertx
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./netalertx/db:/data/db
      - ./netalertx/config:/data/config
      - ./netalertx/log:/tmp/log
    environment:
      - TZ=Europe/Paris
      - PUID=20211
      - PGID=20211
      - PORT=${PORT:-20211}
      - LISTEN_ADDR=${LISTEN_ADDR:-0.0.0.0}
      - GRAPHQL_PORT=${GRAPHQL_PORT:-20212}
      - APP_DATA_LOCATION=/data
    mem_limit: 2048m
    mem_reservation: 1024m
    cpu_shares: 512
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  portracker:
    image: mostafawahied/portracker:1.1.0
    container_name: portracker
    restart: unless-stopped
    pid: host
    cap_add: [SYS_PTRACE, SYS_ADMIN]
    security_opt: [apparmor:unconfined]
    volumes:
      - ./portracker-data:/data
    ports: ["4999:4999"]
    environment:
      - TRUENAS_API_KEY=${TRUENAS_API_KEY}

  scrutiny-collector:
    image: ghcr.io/analogj/scrutiny:v0.8.1-collector
    container_name: scrutiny
    restart: unless-stopped
    cap_add: [SYS_RAWIO]
    volumes:
      - /run/udev:/run/udev:ro
    environment:
      COLLECTOR_API_ENDPOINT: http://172.17.0.24:31054/
      COLLECTOR_HOST_ID: albandrieu
      COLLECTOR_RUN_STARTUP: false
    devices: [/dev/sda, /dev/sdb, /dev/sdc]
    networks: [intranet]

  dozzle-agent:
    image: amir20/dozzle:v8.14.4
    container_name: dozzle-agent
    command: agent
    healthcheck:
      test: [CMD, /dozzle, healthcheck]
      interval: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s
    environment:
      DOZZLE_HOSTNAME: albandrieu
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    ports: ["7007:7007"]
    networks: [intranet]

networks:
  intranet:
    external: true
    name: intranet
